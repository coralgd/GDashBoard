<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Лидерборд</title>
<link rel="stylesheet" href="hud.css">
</head>
<body>
<div class="hud" style="max-width:900px;margin:40px auto;">
  <div class="page-header">
    <h1 style="margin:0;">Лидерборд</h1>
    <button id="back" class="btn-ghost">На главную</button>
  </div>

  <p id="status" style="color:#00ffff;">Загрузка...</p>
  <div class="row small"><div>#</div><div>Ник</div><div>Очки</div></div>
  <div id="list"></div>
</div>

<div id="modal" class="dialog-backdrop"><div class="dialog"><div class="page-header"><h2 id="mTitle">Инфо</h2><button id="mClose" class="btn-ghost">Закрыть</button></div><div id="mBody"></div></div></div>

<script type="module">
import { auth, db, getNetworkErrorMessage } from './firebase.js';
import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.14.0/firebase-auth.js";
import { collection, getDocs, orderBy, query, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.14.0/firebase-firestore.js";

const statusEl = document.getElementById('status');
const listEl = document.getElementById('list');
document.getElementById('back').onclick = ()=> location.href='main.html';

onAuthStateChanged(auth, async user => {
  if(!user) return location.href='index.html';

  try {
    const meSnap = await getDoc(doc(db,'users',user.uid));
    const me = meSnap.exists() ? meSnap.data() : null;
    if(!me || me.situation!=='verified') return location.href='nick.html';

    const snap = await getDocs(query(collection(db,'users'), orderBy('points','desc')));
    listEl.innerHTML = '';

    let seen = 0;
    let rank = 0;
    let lastPoints = null;

    snap.forEach(d => {
      const u = d.data();
      if(u.situation !== 'verified') return;

      const points = Number(u.points ?? 0);
      seen += 1;
      if(lastPoints !== points){
        rank = seen;
        lastPoints = points;
      }

      const row = document.createElement('div');
      row.className = 'row list-item';
      row.innerHTML = `<div>${rank}</div><div>${u.nick ?? 'Без ника'}</div><div>${points}</div>`;
      listEl.appendChild(row);
    });

    if(!listEl.children.length){
      statusEl.textContent = 'Нет верифицированных игроков.';
      return;
    }

    statusEl.textContent = '';
  } catch (e) {
    statusEl.textContent = getNetworkErrorMessage(e);
  }
});
</script>
</body>
</html>
