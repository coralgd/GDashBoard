<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Лидерборд</title>
<link rel="stylesheet" href="hud.css">
<style>
  .panel{display:none}
  .panel.active{display:block}
  .row-head{display:grid;grid-template-columns:70px 1fr 140px;padding:10px 12px;border-bottom:1px solid rgba(0,160,255,0.35);font-weight:700;opacity:.9}
  .level-card{border:1px solid #2d8cff55;background:rgba(0,20,50,.35);padding:10px;border-radius:10px;margin-bottom:10px}
</style>
</head>
<body>
<div class="hud" style="max-width:1100px;margin:30px auto;">
  <div class="page-header">
    <h1 style="margin:0;">Лидерборд</h1>
    <button id="backMain" class="btn-ghost">На главную</button>
  </div>
  <p id="status" style="color:#00ffff;margin:8px 0 12px;">Загрузка...</p>

  <div class="stats-grid">
    <div class="stat"><div class="small">Верифицированных</div><b id="statUsers">—</b></div>
    <div class="stat"><div class="small">Уровней в листе</div><b id="statLevels">—</b></div>
  </div>

  <div class="tabs" style="grid-template-columns:repeat(2,minmax(0,1fr));margin-top:10px;">
    <button id="openPlayers">Игроки</button>
    <button id="openLevels">Лист уровней</button>
  </div>

  <section id="playersPanel" class="panel active">
    <div class="toolbar">
      <input id="playerSearch" placeholder="Поиск по нику">
      <select id="roleFilter">
        <option value="all">Все роли</option>
        <option value="player">Игроки</option>
        <option value="moderator">Модераторы</option>
        <option value="elder">Старшие модераторы</option>
      </select>
    </div>
    <div class="row-head"><div>#</div><div>Игрок</div><div>Очки</div></div>
    <div id="playersList"></div>
  </section>

  <section id="levelsPanel" class="panel">
    <div class="toolbar">
      <input id="levelSearch" placeholder="Поиск по уровню/ссылке">
      <select id="levelSort">
        <option value="rankAsc">Сначала топ</option>
        <option value="rankDesc">Сначала низ</option>
      </select>
    </div>
    <div id="levelsList"></div>
  </section>
</div>

<script type="module">
import { auth, db } from './firebase.js';
import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.14.0/firebase-auth.js";
import { collection, query, orderBy, getDocs, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.14.0/firebase-firestore.js";

const playersList = document.getElementById('playersList');
const levelsList = document.getElementById('levelsList');
const statUsers = document.getElementById('statUsers');
const statLevels = document.getElementById('statLevels');

const playerSearch = document.getElementById('playerSearch');
const roleFilter = document.getElementById('roleFilter');
const levelSearch = document.getElementById('levelSearch');
const levelSort = document.getElementById('levelSort');

let currentUid = null;
let users = [];
let levels = [];
let scoring = { maximumPoints:100, rankDecayFactor:3, repeatPenaltyPower:0.5 };

function esc(v){ return String(v ?? '').replace(/[&<>'"]/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;' }[c])); }
function safeUrl(v){ try{ const u = new URL((v ?? '').trim()); return (u.protocol==='http:' || u.protocol==='https:') ? u.toString() : ''; }catch{return '';} }
function pointsForRank(rank,size,k=1){
  const n = Math.max(2, Number(size || 2));
  const r = Math.max(1, Math.min(Number(rank || 1), n));
  const x = (r - 1)/(n - 1);
  return Math.round((scoring.maximumPoints * Math.exp(-scoring.rankDecayFactor*x) / Math.pow(Math.max(1,k), scoring.repeatPenaltyPower))*100)/100;
}

function setPanel(name){
  document.getElementById('playersPanel').classList.toggle('active', name==='players');
  document.getElementById('levelsPanel').classList.toggle('active', name==='levels');
  document.getElementById('openPlayers').classList.toggle('active', name==='players');
  document.getElementById('openLevels').classList.toggle('active', name==='levels');
}

document.getElementById('openPlayers').onclick = ()=>setPanel('players');
document.getElementById('openLevels').onclick = ()=>setPanel('levels');
document.getElementById('backMain').onclick = ()=> location.href='main.html';

function renderPlayers(){
  playersList.innerHTML = '';
  const q = playerSearch.value.trim().toLowerCase();
  const role = roleFilter.value;

  const filtered = users.filter(u=>{
    const r = (u.role==='moderator' || u.role==='elder') ? u.role : 'player';
    if(role !== 'all' && role !== r) return false;
    if(q && !String(u.nick ?? '').toLowerCase().includes(q)) return false;
    return true;
  });

  let place = 0, idx = 0, last = null;
  filtered.forEach(u=>{
    idx++;
    if(u.points !== last){ place = idx; last = u.points; }
    const row = document.createElement('div');
    row.className = 'row';
    if(u.id===currentUid) row.classList.add('me');
    if(u.role==='moderator') row.classList.add('moderator');
    if(u.role==='elder') row.classList.add('elder');
    row.innerHTML = `<div>${place}</div><div>${esc(u.nick ?? 'Без ника')}</div><div>${Number(u.points ?? 0)}</div>`;
    playersList.appendChild(row);
  });
  statPlayers.textContent = String(usersCache.length);
  renderPlayers();
}

  if(!playersList.childElementCount) playersList.innerHTML = '<p>Игроки не найдены.</p>';
}

function renderLevels(){
  const q = levelSearch.value.trim().toLowerCase();
  const sort = levelSort.value;
  levelsList.innerHTML = '';

  const list = levelsCache
    .filter(l=>l.status !== 'archived')
    .filter(l=>`${l.text ?? ''} ${l.link ?? ''}`.toLowerCase().includes(q))
    .sort((a,b)=> sort==='rankDesc' ? Number(b.rank ?? 999999)-Number(a.rank ?? 999999) : Number(a.rank ?? 999999)-Number(b.rank ?? 999999));

  const quantity = Math.max(2, list.length);
  list.forEach(l=>{
    const item = document.createElement('div');
    item.className='item';
    const safeLink = normalizeUrl(l.link);
    const safeFile = normalizeUrl(l.fileUrl);
    const pts = calculateCompletionPoints(Number(l.rank ?? 1), quantity, 1, scoringCfg);
    item.innerHTML = `
      <b>#${Number(l.rank ?? 0) || '—'}</b> · ${safeLink ? `<a href="${safeLink}" target="_blank" rel="noopener noreferrer">Открыть уровень</a>` : '<span class="small">Некорректная ссылка</span>'}
      <br>${escapeHtml(l.text ?? '')}
      <br><span class="small">Файл: ${safeFile ? `<a href="${safeFile}" target="_blank" rel="noopener noreferrer">ссылка</a>` : '—'}</span>
      <br><span class="small">Очки за прохождение: ${pts}</span>
    `;
    levelsList.appendChild(item);
  });

  if(!playersList.childElementCount) playersList.innerHTML = '<p>Игроки не найдены.</p>';
}

function renderLevels(){
  levelsList.innerHTML = '';
  const q = levelSearch.value.trim().toLowerCase();
  const sort = levelSort.value;

  const visible = levels
    .filter(l=>l.status!=='archived')
    .filter(l=>`${l.text ?? ''} ${l.link ?? ''}`.toLowerCase().includes(q))
    .sort((a,b)=> sort==='rankDesc' ? Number(b.rank ?? 999999)-Number(a.rank ?? 999999) : Number(a.rank ?? 999999)-Number(b.rank ?? 999999));

  const size = Math.max(2, visible.length);
  visible.forEach(l=>{
    const link = safeUrl(l.link);
    const file = safeUrl(l.fileUrl);
    const card = document.createElement('div');
    card.className='level-card';
    card.innerHTML = `
      <b>#${Number(l.rank ?? 0) || '—'}</b> · ${link ? `<a href="${link}" target="_blank" rel="noopener noreferrer">Открыть уровень</a>` : '<span class="small">Некорректная ссылка</span>'}
      <br>${esc(l.text ?? '')}
      <br><span class="small">Файл: ${file ? `<a href="${file}" target="_blank" rel="noopener noreferrer">ссылка</a>` : '—'}</span>
      <br><span class="small">Очки за прохождение: ${pointsForRank(Number(l.rank ?? 1), size, 1)}</span>
    `;
    levelsList.appendChild(card);
  });

  if(!levelsList.childElementCount) levelsList.innerHTML = '<p>Уровни не найдены.</p>';
}

playerSearch.oninput = renderPlayers;
roleFilter.onchange = renderPlayers;
levelSearch.oninput = renderLevels;
levelSort.onchange = renderLevels;

async function loadAll(){
  const [userSnap, levelSnap, scoringSnap] = await Promise.all([
    getDocs(query(collection(db,'users'), orderBy('points','desc'))),
    getDocs(query(collection(db,'levels'), orderBy('rank','asc'))),
    getDoc(doc(db,'settings','scoring'))
  ]);

  const s = scoringSnap.exists() ? scoringSnap.data() : {};
  scoring = {
    maximumPoints: Number(s.maximumPoints ?? s.maxPoints ?? 100),
    rankDecayFactor: Number(s.rankDecayFactor ?? s.decayA ?? 3),
    repeatPenaltyPower: Number(s.repeatPenaltyPower ?? s.grindPower ?? 0.5)
  };

  users = [];
  userSnap.forEach(d=>{ const u=d.data(); if(u.situation==='verified') users.push({id:d.id, ...u}); });
  levels = [];
  levelSnap.forEach(d=>levels.push({id:d.id, ...d.data()}));

  statUsers.textContent = String(users.length);
  statLevels.textContent = String(levels.filter(x=>x.status!=='archived').length);

  renderPlayers();
  renderLevels();
}

onAuthStateChanged(auth, async user=>{
  if(!user) return location.href='index.html';
  try{
    const meSnap = await getDoc(doc(db,'users',user.uid));
    const me = meSnap.exists() ? meSnap.data() : null;
    if(!me || me.situation!=='verified') return location.href='nick.html';

    currentUid = user.uid;
    await loadAll();
    statusEl.textContent = '';
  } catch (e){
    console.error(e);
    statusEl.textContent = 'Лидерборд не загрузился. Проверь интернет/правила Firestore.';
  }
});
</script>
</body>
</html>
