<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Leaderboard</title>
<link rel="stylesheet" href="hud.css">
<style>
  .panel{display:none}
  .panel.active{display:block}
  .item{border:1px solid #2d8cff55;background:rgba(0,20,50,.35);padding:10px;border-radius:10px;margin-bottom:10px}
</style>
</head>
<body>
<div class="hud" style="max-width:1080px;margin:30px auto;">
  <div class="page-header">
    <h1 style="margin:0;">Лидерборд и лист</h1>
    <button id="backMain" class="btn-ghost">На главную</button>
  </div>

  <div class="stats-grid">
    <div class="stat"><div class="small">Верифицированных игроков</div><b id="statPlayers">—</b></div>
    <div class="stat"><div class="small">Уровней в листе</div><b id="statLevels">—</b></div>
  </div>
  <p id="status" style="color:#00ffff;margin:8px 0 10px;">Загрузка...</p>

  <div class="tabs">
    <button data-tab="players">Игроки</button>
    <button data-tab="levels">Лист уровней</button>
  </div>

  <div id="players" class="panel active">
    <div class="toolbar">
      <input id="playerSearch" placeholder="Поиск игрока по нику">
      <select id="roleFilter">
        <option value="all">Все роли</option>
        <option value="player">Игроки</option>
        <option value="moderator">Модераторы</option>
        <option value="elder">Старшие модеры</option>
      </select>
    </div>
    <div id="playersList"></div>
  </div>

  <div id="levels" class="panel">
    <div class="toolbar">
      <input id="levelSearch" placeholder="Поиск уровня по описанию/ссылке">
      <select id="levelSort">
        <option value="rankAsc">Сначала топ</option>
        <option value="rankDesc">Сначала низ</option>
      </select>
    </div>
    <div id="levelsList"></div>
  </div>
</div>

<script type="module">
import { auth, db } from './firebase.js';
import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.14.0/firebase-auth.js";
import { collection, query, orderBy, getDocs, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.14.0/firebase-firestore.js";

const playersList = document.getElementById('playersList');
const levelsList = document.getElementById('levelsList');
const playerSearch = document.getElementById('playerSearch');
const roleFilter = document.getElementById('roleFilter');
const levelSearch = document.getElementById('levelSearch');
const levelSort = document.getElementById('levelSort');
const statPlayers = document.getElementById('statPlayers');
const statLevels = document.getElementById('statLevels');
const statusEl = document.getElementById('status');

let currentUid = null;
let usersCache = [];
let levelsCache = [];
let scoringCfg = { maximumPoints:100, rankDecayFactor:3, repeatPenaltyPower:0.5 };

function escapeHtml(value){
  return String(value ?? '').replace(/[&<>'"]/g, ch => ({ '&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;' }[ch]));
}

function normalizeUrl(input){
  const value = (input ?? '').trim();
  if(!value) return '';
  try {
    const parsed = new URL(value);
    if(parsed.protocol !== 'http:' && parsed.protocol !== 'https:') return '';
    return parsed.toString();
  } catch {
    return '';
  }
}

function setTab(id){
  document.querySelectorAll('.panel').forEach(x=>x.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  document.querySelectorAll('.tabs button').forEach(btn=>btn.classList.toggle('active', btn.dataset.tab===id));
  history.replaceState(null, '', `#${id}`);
}

function calculateCompletionPoints(listRank, listSize, approvedCompletionsCount, scoringSettings){
  const normalizedListSize = Math.max(2, Number(listSize || 2));
  const normalizedRank = Math.max(1, Math.min(Number(listRank || 1), normalizedListSize));
  const x = (normalizedRank - 1) / (normalizedListSize - 1);
  const base = scoringSettings.maximumPoints * Math.exp(-scoringSettings.rankDecayFactor * x);
  const antiGrind = 1 / Math.pow(Math.max(1, approvedCompletionsCount), scoringSettings.repeatPenaltyPower);
  return Math.round(base * antiGrind * 100) / 100;
}

async function getScoring(){
  const snap = await getDoc(doc(db,'settings','scoring'));
  const s = snap.exists() ? snap.data() : {};
  return {
    maximumPoints: Number(s.maximumPoints ?? s.maxPoints ?? 100),
    rankDecayFactor: Number(s.rankDecayFactor ?? s.decayA ?? 3),
    repeatPenaltyPower: Number(s.repeatPenaltyPower ?? s.grindPower ?? 0.5)
  };
}

function renderPlayers(){
  const q = playerSearch.value.trim().toLowerCase();
  const role = roleFilter.value;
  playersList.innerHTML = '';

  const filtered = usersCache.filter(({data}) => {
    const nick = String(data.nick ?? '').toLowerCase();
    const userRole = data.role === 'moderator' || data.role === 'elder' ? data.role : 'player';
    if(role !== 'all' && role !== userRole) return false;
    if(q && !nick.includes(q)) return false;
    return true;
  });

  let displayRank = 0;
  let leaderboardIndex = 0;
  let lastPoints = null;

  filtered.forEach(({id, data})=>{
    leaderboardIndex++;
    if(data.points !== lastPoints){ displayRank = leaderboardIndex; lastPoints = data.points; }

    const row = document.createElement('div');
    row.className='row';
    if(id===currentUid) row.classList.add('me');
    if(data.role==='moderator') row.classList.add('moderator');
    if(data.role==='elder') row.classList.add('elder');
    row.innerHTML = `<div>${displayRank}</div><div>${escapeHtml(data.nick ?? 'Без ника')}</div><div>${Number(data.points ?? 0)}</div>`;
    playersList.appendChild(row);
  });
  statPlayers.textContent = String(usersCache.length);
  renderPlayers();
}

  if(!playersList.childElementCount) playersList.innerHTML = '<p>Ничего не найдено.</p>';
}

function renderLevels(){
  const q = levelSearch.value.trim().toLowerCase();
  const sortMode = levelSort.value;
  levelsList.innerHTML = '';

  const list = levelsCache
    .filter(({data}) => data.status !== 'archived')
    .filter(({data}) => (`${data.text ?? ''} ${data.link ?? ''}`).toLowerCase().includes(q))
    .sort((a,b)=>{
      const ar = Number(a.data.rank ?? 999999);
      const br = Number(b.data.rank ?? 999999);
      return sortMode === 'rankDesc' ? br - ar : ar - br;
    });

  const quantity = Math.max(list.length, 2);
  list.forEach(({data})=>{
    const safeLink = normalizeUrl(data.link);
    const safeFile = normalizeUrl(data.fileUrl);
    const levelPoints = calculateCompletionPoints(Number(data.rank ?? 1), quantity, 1, scoringCfg);
    const item = document.createElement('div');
    item.className = 'item';
    item.innerHTML = `
      <b>#${Number(data.rank ?? 0) || '—'}</b> ·
      ${safeLink ? `<a target="_blank" href="${escapeHtml(safeLink)}" rel="noopener noreferrer">Открыть уровень</a>` : '<span class="small">Некорректная ссылка</span>'}
      <br>${escapeHtml(data.text ?? '')}
      <br><span class="small">Файл: ${safeFile ? `<a target="_blank" href="${escapeHtml(safeFile)}" rel="noopener noreferrer">ссылка</a>` : '—'}</span>
      <br><span class="small">Очки за прохождение: ${levelPoints}</span>
    `;
    levelsList.appendChild(item);
  });

  if(!levelsList.childElementCount) levelsList.innerHTML = '<p>Уровни не найдены.</p>';
}

async function refreshUsers(){
  const usersSnap = await getDocs(query(collection(db,'users'),orderBy('points','desc')));
  usersCache = [];
  usersSnap.forEach(d=>{
    const u = d.data();
    if(u.situation!=='verified') return;
    usersCache.push({ id:d.id, data:u });
  });
  statPlayers.textContent = String(usersCache.length);
  renderPlayers();
}

async function refreshLevels(){
  const levelsSnap = await getDocs(query(collection(db,'levels'), orderBy('rank','asc')));
  scoringCfg = await getScoring();
  levelsCache = [];
  levelsSnap.forEach(d=>levelsCache.push({ id:d.id, data:d.data() }));
  statLevels.textContent = String(levelsCache.filter(x=>x.data.status!=='archived').length);
  renderLevels();
}

document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>setTab(b.dataset.tab));
playerSearch.oninput = renderPlayers;
roleFilter.onchange = renderPlayers;
levelSearch.oninput = renderLevels;
levelSort.onchange = renderLevels;
document.getElementById('backMain').onclick = ()=> location.href='main.html';

onAuthStateChanged(auth, async u=>{
  if(!u) return location.href='index.html';
  try{
    const meSnap = await getDoc(doc(db,'users',u.uid));
    const me = meSnap.exists() ? meSnap.data() : null;
    if(!me || me.situation!=='verified') return location.href='nick.html';
    currentUid = u.uid;
    await refreshUsers();
    await refreshLevels();
    statusEl.textContent = '';
  } catch (e){
    console.error(e);
    statusEl.textContent = 'Не удалось загрузить лидерборд.';
  }
});
</script>
</body>
</html>
