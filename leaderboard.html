<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Лидерборд</title>
<link rel="stylesheet" href="hud.css">
<style>
  .panel{display:none}
  .panel.active{display:block}
  .item{border:1px solid #2d8cff55;background:rgba(0,20,50,.35);padding:10px;border-radius:10px;margin-bottom:10px}
</style>
</head>
<body>
<div class="hud" style="max-width:1080px;margin:30px auto;">
  <div class="page-header">
    <h1 style="margin:0;">Лидерборд и лист</h1>
    <button id="backMain" class="btn-ghost">На главную</button>
  </div>

  <p id="status" style="color:#00ffff;margin:8px 0 10px;">Загрузка...</p>

  <div class="tabs" style="grid-template-columns:repeat(2,minmax(0,1fr));">
    <button id="tabPlayers">Игроки</button>
    <button id="tabLevels">Лист уровней</button>
  </div>

  <div id="playersPanel" class="panel active">
    <div class="toolbar">
      <input id="playerSearch" placeholder="Поиск игрока по нику">
      <select id="roleFilter">
        <option value="all">Все роли</option>
        <option value="player">Игроки</option>
        <option value="moderator">Модераторы</option>
        <option value="elder">Старшие модеры</option>
      </select>
    </div>
    <div id="playersList"></div>
  </div>

  <div id="levelsPanel" class="panel">
    <div class="toolbar">
      <input id="levelSearch" placeholder="Поиск уровня по описанию или ссылке">
      <select id="levelSort">
        <option value="rankAsc">Сначала топ</option>
        <option value="rankDesc">Сначала низ</option>
      </select>
    </div>
    <div id="levelsList"></div>
  </div>
</div>

<script type="module">
import { auth, db } from './firebase.js';
import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.14.0/firebase-auth.js";
import { collection, query, orderBy, getDocs, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.14.0/firebase-firestore.js";

const statusEl = document.getElementById('status');
const playersList = document.getElementById('playersList');
const levelsList = document.getElementById('levelsList');
const playerSearch = document.getElementById('playerSearch');
const roleFilter = document.getElementById('roleFilter');
const levelSearch = document.getElementById('levelSearch');
const levelSort = document.getElementById('levelSort');

let currentUid = null;
let usersCache = [];
let levelsCache = [];
let scoringCfg = { maximumPoints:100, rankDecayFactor:3, repeatPenaltyPower:0.5 };

function escapeHtml(v){ return String(v ?? '').replace(/[&<>'"]/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;' }[c])); }
function normalizeUrl(value){
  try {
    const u = new URL((value ?? '').trim());
    if(u.protocol !== 'http:' && u.protocol !== 'https:') return '';
    return u.toString();
  } catch { return ''; }
}
function calculateCompletionPoints(rank, size, k, s){
  const normalizedListSize = Math.max(2, Number(size || 2));
  const normalizedRank = Math.max(1, Math.min(Number(rank || 1), normalizedListSize));
  const x = (normalizedRank - 1) / (normalizedListSize - 1);
  const base = s.maximumPoints * Math.exp(-s.rankDecayFactor * x);
  const anti = 1 / Math.pow(Math.max(1, k), s.repeatPenaltyPower);
  return Math.round(base * anti * 100) / 100;
}

function setTab(panel){
  document.getElementById('playersPanel').classList.toggle('active', panel==='players');
  document.getElementById('levelsPanel').classList.toggle('active', panel==='levels');
  document.getElementById('tabPlayers').classList.toggle('active', panel==='players');
  document.getElementById('tabLevels').classList.toggle('active', panel==='levels');
}

document.getElementById('tabPlayers').onclick = ()=>setTab('players');
document.getElementById('tabLevels').onclick = ()=>setTab('levels');
document.getElementById('backMain').onclick = ()=> location.href='main.html';

function renderPlayers(){
  const q = playerSearch.value.trim().toLowerCase();
  const role = roleFilter.value;
  playersList.innerHTML = '';

  const filtered = usersCache.filter(u=>{
    const normalizedRole = (u.role==='moderator' || u.role==='elder') ? u.role : 'player';
    if(role !== 'all' && role !== normalizedRole) return false;
    if(q && !String(u.nick ?? '').toLowerCase().includes(q)) return false;
    return true;
  });

  let pos = 0, rank = 0, lastPoints = null;
  filtered.forEach(u=>{
    pos++;
    if(u.points !== lastPoints){ rank = pos; lastPoints = u.points; }
    const row = document.createElement('div');
    row.className='row';
    if(u.id===currentUid) row.classList.add('me');
    if(u.role==='moderator') row.classList.add('moderator');
    if(u.role==='elder') row.classList.add('elder');
    row.innerHTML = `<div>${rank}</div><div>${escapeHtml(u.nick ?? 'Без ника')}</div><div>${Number(u.points ?? 0)}</div>`;
    playersList.appendChild(row);
  });

  if(!playersList.childElementCount) playersList.innerHTML = '<p>Игроки не найдены.</p>';
}

function renderLevels(){
  const q = levelSearch.value.trim().toLowerCase();
  const sort = levelSort.value;
  levelsList.innerHTML = '';

  const list = levelsCache
    .filter(l=>l.status !== 'archived')
    .filter(l=>`${l.text ?? ''} ${l.link ?? ''}`.toLowerCase().includes(q))
    .sort((a,b)=> sort==='rankDesc' ? Number(b.rank ?? 999999)-Number(a.rank ?? 999999) : Number(a.rank ?? 999999)-Number(b.rank ?? 999999));

  const quantity = Math.max(2, list.length);
  list.forEach(l=>{
    const item = document.createElement('div');
    item.className='item';
    const safeLink = normalizeUrl(l.link);
    const safeFile = normalizeUrl(l.fileUrl);
    const pts = calculateCompletionPoints(Number(l.rank ?? 1), quantity, 1, scoringCfg);
    item.innerHTML = `
      <b>#${Number(l.rank ?? 0) || '—'}</b> · ${safeLink ? `<a href="${safeLink}" target="_blank" rel="noopener noreferrer">Открыть уровень</a>` : '<span class="small">Некорректная ссылка</span>'}
      <br>${escapeHtml(l.text ?? '')}
      <br><span class="small">Файл: ${safeFile ? `<a href="${safeFile}" target="_blank" rel="noopener noreferrer">ссылка</a>` : '—'}</span>
      <br><span class="small">Очки за прохождение: ${pts}</span>
    `;
    levelsList.appendChild(item);
  });

  if(!levelsList.childElementCount) levelsList.innerHTML = '<p>Уровни не найдены.</p>';
}

playerSearch.oninput = renderPlayers;
roleFilter.onchange = renderPlayers;
levelSearch.oninput = renderLevels;
levelSort.onchange = renderLevels;

async function loadData(){
  const [usersSnap, levelsSnap, scoringSnap] = await Promise.all([
    getDocs(query(collection(db,'users'), orderBy('points','desc'))),
    getDocs(query(collection(db,'levels'), orderBy('rank','asc'))),
    getDoc(doc(db,'settings','scoring'))
  ]);

  const s = scoringSnap.exists() ? scoringSnap.data() : {};
  scoringCfg = {
    maximumPoints: Number(s.maximumPoints ?? s.maxPoints ?? 100),
    rankDecayFactor: Number(s.rankDecayFactor ?? s.decayA ?? 3),
    repeatPenaltyPower: Number(s.repeatPenaltyPower ?? s.grindPower ?? 0.5)
  };

  usersCache = [];
  usersSnap.forEach(d=>{
    const u = d.data();
    if(u.situation!=='verified') return;
    usersCache.push({ id:d.id, ...u });
  });

  levelsCache = [];
  levelsSnap.forEach(d=>levelsCache.push({ id:d.id, ...d.data() }));

  renderPlayers();
  renderLevels();
}

onAuthStateChanged(auth, async user=>{
  if(!user) return location.href='index.html';
  try {
    const meSnap = await getDoc(doc(db,'users',user.uid));
    const me = meSnap.exists() ? meSnap.data() : null;
    if(!me || me.situation!=='verified') return location.href='nick.html';

    currentUid = user.uid;
    await loadData();
    statusEl.textContent = '';
  } catch (e) {
    console.error(e);
    statusEl.textContent = 'Не удалось загрузить лидерборд. Проверь правила Firestore/интернет.';
  }
});
</script>
</body>
</html>
