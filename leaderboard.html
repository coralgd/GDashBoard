<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Лидерборд и лист</title>
<link rel="stylesheet" href="hud.css">
<style>
  .panel{display:none}
  .panel.active{display:block}
</style>
</head>
<body>
<div class="hud" style="max-width:1120px;margin:30px auto;">
  <div class="page-header">
    <h1 style="margin:0;">Лидерборд и лист уровней</h1>
    <button id="backMain" class="btn-ghost">На главную</button>
  </div>
  <p id="status" style="color:#00ffff;">Загрузка...</p>

  <div class="top-actions">
    <button id="toggleView">Показать лист уровней</button>
  </div>

  <div id="playersPanel" class="panel active">
    <div class="toolbar">
      <input id="playerSearch" placeholder="Поиск игрока">
    </div>
    <div id="playersList"></div>
  </div>

  <div id="levelsPanel" class="panel">
    <div id="levelsList"></div>
  </div>
</div>

<div id="infoModal" class="dialog-backdrop">
  <div class="dialog">
    <div class="page-header">
      <h2 id="infoTitle" style="margin:0;">Информация</h2>
      <button id="closeInfo" class="btn-ghost">Закрыть</button>
    </div>
    <div id="infoBody"></div>
  </div>
</div>

<script type="module">
import { auth, db } from './firebase.js';
import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.14.0/firebase-auth.js";
import { collection, doc, getDoc, getDocs, orderBy, query, where } from "https://www.gstatic.com/firebasejs/10.14.0/firebase-firestore.js";

const statusEl = document.getElementById('status');
const toggleBtn = document.getElementById('toggleView');
const playersPanel = document.getElementById('playersPanel');
const levelsPanel = document.getElementById('levelsPanel');
const playersList = document.getElementById('playersList');
const levelsList = document.getElementById('levelsList');
const searchInput = document.getElementById('playerSearch');
const infoModal = document.getElementById('infoModal');
const infoBody = document.getElementById('infoBody');
const infoTitle = document.getElementById('infoTitle');

document.getElementById('backMain').onclick = ()=> location.href='main.html';
document.getElementById('closeInfo').onclick = ()=> infoModal.classList.remove('open');

let users = [];
let levels = [];
let comps = [];
let showLevels = false;
let scoring = { maximumPoints:100, rankDecayFactor:3, repeatPenaltyPower:0.5 };

function points(rank, size, k = 1){
  const n = Math.max(2, Number(size || 2));
  const r = Math.max(1, Math.min(Number(rank || 1), n));
  const x = (r - 1) / (n - 1);
  const value = scoring.maximumPoints * Math.exp(-scoring.rankDecayFactor * x) / Math.pow(Math.max(1, k), scoring.repeatPenaltyPower);
  return Math.round(value * 100) / 100;
}
function esc(v){ return String(v ?? '').replace(/[&<>'"]/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;' }[c])); }
function safeUrl(v){ try { const u = new URL((v ?? '').trim()); return (u.protocol==='http:' || u.protocol==='https:') ? u.toString() : ''; } catch { return ''; } }

function toggleView(){
  showLevels = !showLevels;
  playersPanel.classList.toggle('active', !showLevels);
  levelsPanel.classList.toggle('active', showLevels);
  toggleBtn.textContent = showLevels ? 'Показать топ игроков' : 'Показать лист уровней';
}

toggleBtn.onclick = toggleView;

function openModal(title){
  infoTitle.textContent = title;
  infoBody.innerHTML = '';
  infoModal.classList.add('open');
}

function text(tag, value, className = ''){
  const el = document.createElement(tag);
  if(className) el.className = className;
  el.textContent = value;
  return el;
}

function renderPlayers(){
  const q = searchInput.value.trim().toLowerCase();
  playersList.innerHTML = '';

  const filtered = users.filter(u => !q || String(u.nick ?? '').toLowerCase().includes(q));
  let rowNo = 0;
  let rank = 0;
  let prev = null;

  filtered.forEach(u => {
    rowNo++;
    if(u.points !== prev){ rank = rowNo; prev = u.points; }

    const row = document.createElement('div');
    row.className = 'row list-item clickable';
    if(u.role === 'moderator') row.classList.add('moderator');
    if(u.role === 'elder') row.classList.add('elder');

    row.append(text('div', String(rank)), text('div', u.nick ?? 'Без ника'), text('div', String(Number(u.points ?? 0))));
    row.onclick = ()=> openPlayer(u);
    playersList.appendChild(row);
  });

  if(!filtered.length) playersList.append(text('p', 'Игроки не найдены.'));
}

function renderLevels(){
  levelsList.innerHTML = '';
  const size = Math.max(2, levels.length);

  levels.forEach(l => {
    const row = document.createElement('div');
    row.className = 'row list-item clickable';
    row.append(
      text('div', `#${l.rank ?? '—'}`),
      text('div', l.text ?? 'Без названия'),
      text('div', String(points(l.rank, size, 1)))
    );
    row.onclick = ()=> openLevel(l);
    levelsList.appendChild(row);
  });

  if(!levels.length) levelsList.append(text('p', 'Лист уровней пуст.'));
}

function openPlayer(u){
  openModal(`Игрок: ${u.nick ?? 'Без ника'}`);
  infoBody.append(
    text('p', `Почта: ${u.email ?? '—'}`),
    text('p', `Роль: ${u.role ?? 'player'}`),
    text('p', `Очки: ${Number(u.points ?? 0)}`)
  );

  const passed = comps.filter(c => c.playerId === u.id);
  infoBody.append(text('h3', 'Подтверждённые прохождения'));
  if(!passed.length){
    infoBody.append(text('p', 'Пока нет прохождений.'));
    return;
  }
  document.getElementById('infoBody').innerHTML = lines.join('');
  infoModal.classList.add('open');
}

function openLevelInfo(level){
  document.getElementById('infoTitle').textContent = `Уровень #${level.rank ?? '—'}`;
  const passed = approvedComps.filter(c=> (c.levelId && c.levelId===level.id) || (!c.levelId && Number(c.listRank)===Number(level.rank)) );
  const rows = [];
  const link = safeUrl(level.link);
  rows.push(`<p><b>Название/описание:</b> ${esc(level.text ?? '—')}</p>`);
  rows.push(`<p><b>Место:</b> ${Number(level.rank ?? 0) || '—'}</p>`);
  rows.push(`<p><b>Ссылка:</b> ${link ? `<a href="${link}" target="_blank">Открыть</a>` : '—'}</p>`);
  rows.push('<h3>Игроки, прошедшие уровень</h3>');
  if(!passed.length) rows.push('<p>Пока никто не прошел.</p>');
  else passed.forEach(c=>rows.push(`<div class="row"><div>${esc(c.nick ?? 'Без ника')}</div><div></div><div>${Number(c.awardedPoints ?? 0)}</div></div>`));
  document.getElementById('infoBody').innerHTML = rows.join('');
  infoModal.classList.add('open');
}

playerSearch.oninput = renderPlayers;

async function loadAll(){
  const [usersSnap, levelsSnap, compsSnap, scoringSnap] = await Promise.all([
    getDocs(query(collection(db,'users'), orderBy('points','desc'))),
    getDocs(query(collection(db,'levels'), orderBy('rank','asc'))),
    getDocs(query(collection(db,'completion_submissions'), where('status','==','approved'))),
    getDoc(doc(db,'settings','scoring'))
  ]);

  users = [];
  usersSnap.forEach(d=>{ const u=d.data(); if(u.situation==='verified') users.push({id:d.id, ...u}); });
  levels = [];
  levelsSnap.forEach(d=>{ const l=d.data(); if(l.status!=='archived') levels.push({id:d.id, ...l}); });
  approvedComps = [];
  compsSnap.forEach(d=>approvedComps.push({id:d.id, ...d.data()}));

  const s = scoringSnap.exists() ? scoringSnap.data() : {};
  scoring = {
    maximumPoints: Number(s.maximumPoints ?? s.maxPoints ?? 100),
    rankDecayFactor: Number(s.rankDecayFactor ?? s.decayA ?? 3),
    repeatPenaltyPower: Number(s.repeatPenaltyPower ?? s.grindPower ?? 0.5)
  };

  renderPlayers();
  renderLevels();
}

onAuthStateChanged(auth, async user=>{
  if(!user) return location.href='index.html';
  try {
    const meSnap = await getDoc(doc(db,'users',user.uid));
    const me = meSnap.exists() ? meSnap.data() : null;
    if(!me || me.situation!=='verified') return location.href='nick.html';

  passed.forEach(c => {
    const lv = c.levelId ? levels.find(x => x.id === c.levelId) : levels.find(x => Number(x.rank) === Number(c.listRank));
    const row = document.createElement('div');
    row.className = 'row list-item';
    row.append(
      text('div', `#${Number(c.listRank ?? 0) || '—'}`),
      text('div', lv?.text ?? c.text ?? 'Уровень'),
      text('div', String(Number(c.awardedPoints ?? 0)))
    );
    infoBody.appendChild(row);
  });
}

function openLevel(level){
  openModal(`Уровень #${level.rank ?? '—'}`);
  const linkP = document.createElement('p');
  linkP.textContent = 'Ссылка: ';
  if(level.link){
    const a = document.createElement('a');
    a.href = level.link;
    a.target = '_blank';
    a.rel = 'noopener';
    a.textContent = 'Открыть';
    linkP.appendChild(a);
  } else {
    linkP.append('—');
  }
  infoBody.append(text('p', `Название: ${level.text ?? '—'}`), text('p', `Место: ${level.rank ?? '—'}`), linkP);

  infoBody.append(text('h3', 'Игроки, прошедшие уровень'));
  const passed = comps.filter(c => (c.levelId && c.levelId === level.id) || (!c.levelId && Number(c.listRank) === Number(level.rank)));
  if(!passed.length){
    infoBody.append(text('p', 'Пока никто не прошёл.'));
    return;
  }

  passed.forEach(c => {
    const row = document.createElement('div');
    row.className = 'row list-item';
    row.append(text('div', c.nick ?? 'Без ника'), text('div', ''), text('div', String(Number(c.awardedPoints ?? 0))));
    infoBody.appendChild(row);
  });
}

async function loadData(){
  const [uSnap, lSnap, cSnap, sSnap] = await Promise.all([
    getDocs(query(collection(db,'users'), orderBy('points','desc'))),
    getDocs(query(collection(db,'levels'), orderBy('rank','asc'))),
    getDocs(query(collection(db,'completion_submissions'), where('status','==','approved'))),
    getDoc(doc(db,'settings','scoring'))
  ]);

  users = [];
  uSnap.forEach(d => { const u = d.data(); if(u.situation === 'verified') users.push({ id:d.id, ...u }); });
  levels = [];
  lSnap.forEach(d => { const l = d.data(); if(l.status !== 'archived') levels.push({ id:d.id, ...l }); });
  comps = [];
  cSnap.forEach(d => comps.push({ id:d.id, ...d.data() }));

  const s = sSnap.exists() ? sSnap.data() : {};
  scoring = {
    maximumPoints: Number(s.maximumPoints ?? s.maxPoints ?? 100),
    rankDecayFactor: Number(s.rankDecayFactor ?? s.decayA ?? 3),
    repeatPenaltyPower: Number(s.repeatPenaltyPower ?? s.grindPower ?? 0.5)
  };

  renderPlayers();
  renderLevels();
}

searchInput.oninput = renderPlayers;

onAuthStateChanged(auth, async user => {
  if(!user) return location.href='index.html';
  const meSnap = await getDoc(doc(db,'users',user.uid));
  const me = meSnap.exists() ? meSnap.data() : null;
  if(!me || me.situation !== 'verified') return location.href='nick.html';

  await loadData();
  statusEl.textContent = '';
});
</script>
</body>
</html>
