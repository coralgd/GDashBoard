<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Лидерборд</title>
<link rel="stylesheet" href="hud.css">
<style>
  .panel{display:none}
  .panel.active{display:block}
  #modal .dialog{width:min(1100px,96vw);max-height:95vh;min-height:70vh}
  .modal-table{width:100%;border-collapse:collapse;margin-top:8px}
  .modal-table th,.modal-table td{border:1px solid #3f8fcc55;padding:8px;text-align:left;vertical-align:top}
</style>
</head>
<body>
<div class="hud" style="max-width:1000px;margin:40px auto;">
  <div class="page-header">
    <h1 style="margin:0;">Лидерборд</h1>
    <button id="back" class="btn-ghost">На главную</button>
  </div>

  <p id="status" style="color:#00ffff;">Загрузка...</p>

  <div class="top-actions">
    <button id="showPlayers" class="btn-success">Игроки</button>
    <button id="showLevels">Лист уровней</button>
  </div>

  <div id="playersPanel" class="panel active">
    <div id="playersList"></div>
  </div>

  <div id="levelsPanel" class="panel">
    <div id="levelsList"></div>
  </div>
</div>

<div id="modal" class="dialog-backdrop">
  <div class="dialog">
    <div class="page-header">
      <h2 id="modalTitle" style="margin:0;">Детали</h2>
      <button id="closeModal" class="btn-ghost">Закрыть</button>
    </div>
    <div id="modalBody"></div>
  </div>
</div>

<script type="module">
import { auth, db, getNetworkErrorMessage } from './firebase.js';
import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.14.0/firebase-auth.js";
import { collection, getDocs, orderBy, query, where, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.14.0/firebase-firestore.js";

const statusEl = document.getElementById('status');
const playersList = document.getElementById('playersList');
const levelsList = document.getElementById('levelsList');
const playersPanel = document.getElementById('playersPanel');
const levelsPanel = document.getElementById('levelsPanel');
const modal = document.getElementById('modal');
const modalTitle = document.getElementById('modalTitle');
const modalBody = document.getElementById('modalBody');

let approvedCompletions = [];
let levelsById = new Map();

function setView(name){
  const players = name === 'players';
  playersPanel.classList.toggle('active', players);
  levelsPanel.classList.toggle('active', !players);
  document.getElementById('showPlayers').classList.toggle('btn-success', players);
  document.getElementById('showLevels').classList.toggle('btn-success', !players);
}

function openModal(title, html){
  modalTitle.textContent = title;
  modalBody.innerHTML = html;
  modal.classList.add('open');
}

document.getElementById('showPlayers').onclick = ()=> setView('players');
document.getElementById('showLevels').onclick = ()=> setView('levels');
document.getElementById('back').onclick = ()=> location.href='main.html';
document.getElementById('closeModal').onclick = ()=> modal.classList.remove('open');

function renderPlayers(users){
  playersList.innerHTML = '';

  if(!users.length){
    playersList.innerHTML = '<p>Нет верифицированных игроков.</p>';
    return;
  }

  users.forEach(u => {
    const row = document.createElement('div');
    row.className = 'row list-item clickable';
    if(u.role==='moderator') row.classList.add('moderator');
    if(u.role==='elder') row.classList.add('elder');
    row.innerHTML = `<div>${u.rank}</div><div>${u.nick ?? 'Без ника'}</div><div>${u.points}</div>`;

    row.onclick = ()=>{
      const mine = approvedCompletions.filter(x=>x.playerId===u.id);
      if(!mine.length){
        openModal(`Игрок: ${u.nick ?? 'Без ника'}`, '<p>Подтвержденных прохождений нет.</p>');
        return;
      }

      let html = `
        <p><b>Ник:</b> ${u.nick ?? 'Без ника'}</p>
        <p><b>Почта:</b> ${u.email ?? '—'}</p>
        <p><b>Роль:</b> ${u.role ?? 'player'}</p>
        <p><b>Статус:</b> ${u.situation ?? '—'}</p>
        <p><b>Очки:</b> ${Number(u.points ?? 0)}</p>
        <p><b>Место в топе:</b> ${u.rank}</p>
        <p><b>Подтвержденных прохождений:</b> ${mine.length}</p>
        <table class="modal-table"><thead><tr><th>#</th><th>Уровень</th><th>Очки</th></tr></thead><tbody>
      `;
      mine
        .sort((a,b)=>(a.reviewedAt?.seconds ?? 0) - (b.reviewedAt?.seconds ?? 0))
        .forEach((c, idx)=>{
          const level = c.levelId ? levelsById.get(c.levelId) : null;
          const levelName = level?.text ?? c.text ?? 'Уровень';
          html += `<tr><td>${idx+1}</td><td>${levelName}</td><td>${Number(c.awardedPoints ?? 0)}</td></tr>`;
        });
      html += '</tbody></table>';
      openModal(`Игрок: ${u.nick ?? 'Без ника'}`, html);
    };

    playersList.appendChild(row);
  });
}

function renderLevels(levels){
  levelsList.innerHTML = '';

  if(!levels.length){
    levelsList.innerHTML = '<p>Лист уровней пуст.</p>';
    return;
  }

  levels.forEach(l => {
    const row = document.createElement('div');
    row.className = 'row list-item clickable';
    row.innerHTML = `<div>${Number(l.rank ?? 0) || '—'}</div><div>${l.text ?? 'Без названия'}</div><div><a target="_blank" href="${l.link ?? '#'}">Открыть</a></div>`;

    row.onclick = (e)=>{
      if(e.target.tagName === 'A') return;
      const passed = approvedCompletions.filter(c => {
        if(c.levelId && l.id) return c.levelId === l.id;
        return Number(c.listRank ?? -1) === Number(l.rank ?? -2);
      });

      if(!passed.length){
        openModal(`Уровень #${l.rank ?? '—'}`, '<p>Этот уровень пока никто не прошел.</p>');
        return;
      }

      let html = '<table class="modal-table"><thead><tr><th>#</th><th>Игрок</th><th>Очки</th></tr></thead><tbody>';
      passed.forEach((c, idx)=>{
        html += `<tr><td>${idx+1}</td><td>${c.nick ?? 'Без ника'}</td><td>${Number(c.awardedPoints ?? 0)}</td></tr>`;
      });
      html += '</tbody></table>';
      openModal(`Уровень #${l.rank ?? '—'}`, html);
    };

    levelsList.appendChild(row);
  });
}

onAuthStateChanged(auth, async user => {
  if(!user) return location.href='index.html';

  try {
    const meSnap = await getDoc(doc(db,'users',user.uid));
    const me = meSnap.exists() ? meSnap.data() : null;
    if(!me || me.situation!=='verified') return location.href='nick.html';

    const [usersSnap, levelsSnap, compSnap] = await Promise.all([
      getDocs(query(collection(db,'users'), orderBy('points','desc'))),
      getDocs(query(collection(db,'levels'), orderBy('rank','asc'))),
      getDocs(query(collection(db,'completion_submissions'), where('status','==','approved')))
    ]);

    const users = [];
    let seen = 0;
    let rank = 0;
    let lastPoints = null;

    usersSnap.forEach(d => {
      const u = d.data();
      if(u.situation !== 'verified') return;

      const points = Number(u.points ?? 0);
      seen += 1;
      if(lastPoints !== points){
        rank = seen;
        lastPoints = points;
      }
      users.push({ id:d.id, ...u, points, rank });
    });

    const levels = [];
    levelsById = new Map();
    levelsSnap.forEach(d => {
      const l = d.data();
      if(l.status === 'archived') return;
      const item = { id:d.id, ...l };
      levels.push(item);
      levelsById.set(d.id, item);
    });

    approvedCompletions = [];
    compSnap.forEach(d=>approvedCompletions.push({ id:d.id, ...d.data() }));

    renderPlayers(users);
    renderLevels(levels);

    statusEl.textContent = '';
    setView('players');
  } catch (e) {
    statusEl.textContent = getNetworkErrorMessage(e);
  }
});
</script>
</body>
</html>
