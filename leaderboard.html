<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Лидерборд и лист</title>
<link rel="stylesheet" href="hud.css">
<style>.panel{display:none}.panel.active{display:block}</style>
</head>
<body>
<div class="hud">
  <div class="page-header">
    <h1>Лидерборд и лист уровней</h1>
    <button id="back" class="btn-ghost">На главную</button>
  </div>
  <p id="status" style="color:#00e5ff">Загрузка...</p>

  <div class="top-actions">
    <button id="toggle">Показать лист уровней</button>
  </div>

  <div id="playersPanel" class="panel active">
    <div class="toolbar"><input id="search" placeholder="Поиск игрока"></div>
    <div id="players"></div>
  </div>
  <div id="levelsPanel" class="panel"><div id="levels"></div></div>
</div>

<div id="modal" class="dialog-backdrop"><div class="dialog"><div class="page-header"><h2 id="mTitle">Инфо</h2><button id="mClose" class="btn-ghost">Закрыть</button></div><div id="mBody"></div></div></div>

<script type="module">
import { auth, db, getNetworkErrorMessage } from './firebase.js';
import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.14.0/firebase-auth.js";
import { collection, doc, getDoc, getDocs, orderBy, query, where } from "https://www.gstatic.com/firebasejs/10.14.0/firebase-firestore.js";

const state={users:[],levels:[],comps:[],showLevels:false,scoring:{maximumPoints:100,rankDecayFactor:3,repeatPenaltyPower:.5}};
const statusEl=document.getElementById('status');

document.getElementById('back').onclick=()=>location.href='main.html';
document.getElementById('mClose').onclick=()=>document.getElementById('modal').classList.remove('open');

function calc(rank,size,k=1){
  const n=Math.max(2,Number(size||2));
  const r=Math.max(1,Math.min(Number(rank||1),n));
  const x=(r-1)/(n-1);
  return Math.round((state.scoring.maximumPoints*Math.exp(-state.scoring.rankDecayFactor*x)/Math.pow(Math.max(1,k),state.scoring.repeatPenaltyPower))*100)/100;
}

function openModal(title, html){
  document.getElementById('mTitle').textContent=title;
  document.getElementById('mBody').innerHTML=html;
  document.getElementById('modal').classList.add('open');
}

function renderPlayers(){
  const q=document.getElementById('search').value.trim().toLowerCase();
  const box=document.getElementById('players');
  box.innerHTML='';
  const filtered=state.users.filter(u=>!q||String(u.nick??'').toLowerCase().includes(q));
  let i=0,rank=0,last=null;
  filtered.forEach(u=>{
    i++; if(u.points!==last){rank=i;last=u.points;}
    const row=document.createElement('div');
    row.className='row list-item clickable';
    if(u.role==='moderator') row.classList.add('moderator');
    if(u.role==='elder') row.classList.add('elder');
    row.innerHTML=`<div>${rank}</div><div>${u.nick??'Без ника'}</div><div>${Number(u.points??0)}</div>`;
    row.onclick=()=>{
      const passed=state.comps.filter(c=>c.playerId===u.id);
      let html=`<p>Почта: ${u.email??'—'}</p><p>Роль: ${u.role??'player'}</p><p>Очки: ${Number(u.points??0)}</p><h3>Прохождения</h3>`;
      if(!passed.length) html+='<p>Нет подтвержденных прохождений.</p>';
      else passed.forEach(c=>{html+=`<div class='row'><div>#${c.listRank??'—'}</div><div>${c.text??'Уровень'}</div><div>${Number(c.awardedPoints??0)}</div></div>`});
      openModal(`Игрок: ${u.nick??'Без ника'}`,html);
    };
    box.appendChild(row);
  });
  if(!filtered.length) box.innerHTML='<p>Игроки не найдены.</p>';
}

function renderLevels(){
  const box=document.getElementById('levels');
  box.innerHTML='';
  const size=Math.max(state.levels.length,2);
  state.levels.forEach(l=>{
    const row=document.createElement('div');
    row.className='row list-item clickable';
    row.innerHTML=`<div>#${l.rank??'—'}</div><div>${l.text??'Без названия'}</div><div>${calc(l.rank,size,1)}</div>`;
    row.onclick=()=>{
      const passed=state.comps.filter(c=>(c.levelId&&c.levelId===l.id)||(!c.levelId&&Number(c.listRank)===Number(l.rank)));
      let html=`<p>Название: ${l.text??'—'}</p><p>Место: ${l.rank??'—'}</p><h3>Кто прошел</h3>`;
      if(!passed.length) html+='<p>Пока никто.</p>';
      else passed.forEach(c=>{html+=`<div class='row'><div>${c.nick??'Без ника'}</div><div></div><div>${Number(c.awardedPoints??0)}</div></div>`;});
      openModal(`Уровень #${l.rank??'—'}`,html);
    };
    box.appendChild(row);
  });
  if(!state.levels.length) box.innerHTML='<p>Лист уровней пуст.</p>';
}

document.getElementById('search').oninput=renderPlayers;
document.getElementById('toggle').onclick=()=>{
  state.showLevels=!state.showLevels;
  document.getElementById('playersPanel').classList.toggle('active',!state.showLevels);
  document.getElementById('levelsPanel').classList.toggle('active',state.showLevels);
  document.getElementById('toggle').textContent=state.showLevels?'Показать топ игроков':'Показать лист уровней';
};

onAuthStateChanged(auth, async user=>{
  if(!user) return location.href='index.html';
  try {
    const me=await getDoc(doc(db,'users',user.uid));
    const my=me.exists()?me.data():null;
    if(!my||my.situation!=='verified') return location.href='nick.html';

    const [uSnap,lSnap,cSnap,sSnap]=await Promise.all([
      getDocs(query(collection(db,'users'),orderBy('points','desc'))),
      getDocs(query(collection(db,'levels'),orderBy('rank','asc'))),
      getDocs(query(collection(db,'completion_submissions'),where('status','==','approved'))),
      getDoc(doc(db,'settings','scoring'))
    ]);

    state.users=[];uSnap.forEach(d=>{const u=d.data();if(u.situation==='verified')state.users.push({id:d.id,...u});});
    state.levels=[];lSnap.forEach(d=>{const l=d.data();if(l.status!=='archived')state.levels.push({id:d.id,...l});});
    state.comps=[];cSnap.forEach(d=>state.comps.push({id:d.id,...d.data()}));

    const s=sSnap.exists()?sSnap.data():{};
    state.scoring={maximumPoints:Number(s.maximumPoints??s.maxPoints??100),rankDecayFactor:Number(s.rankDecayFactor??s.decayA??3),repeatPenaltyPower:Number(s.repeatPenaltyPower??s.grindPower??.5)};

    renderPlayers(); renderLevels();
    statusEl.textContent='';
  } catch (e) {
    console.error(e);
    statusEl.textContent=getNetworkErrorMessage(e);
  }
});
</script>
</body>
</html>
