<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Лидерборд</title>
<link rel="stylesheet" href="hud.css">
<style>
  .panel{display:none}
  .panel.active{display:block}
</style>
</head>
<body>
<div class="hud" style="max-width:1120px;margin:30px auto;">
  <div class="page-header">
    <h1 style="margin:0;">Лидерборд</h1>
    <button id="back" class="btn-ghost">На главную</button>
  </div>
  <p id="status" style="color:#00ffff;">Загрузка...</p>

  <div class="top-actions">
    <button id="showPlayers" class="btn-success">Топ игроков</button>
    <button id="showLevels">Лист уровней</button>
  </div>

  <div id="playersPanel" class="panel active">
    <div class="toolbar"><input id="search" placeholder="Поиск по нику"></div>
    <div id="players"></div>
  </div>
  <div id="levelsPanel" class="panel">
    <div id="levels"></div>
  </div>
</div>

<div id="infoModal" class="dialog-backdrop">
  <div class="dialog">
    <div class="page-header">
      <h2 id="infoTitle" style="margin:0;">Инфо</h2>
      <button id="closeInfo" class="btn-ghost">Закрыть</button>
    </div>
    <div id="infoBody"></div>
  </div>
  <div id="levelsPanel" class="panel"><div id="levels"></div></div>
</div>

<div id="modal" class="dialog-backdrop"><div class="dialog"><div class="page-header"><h2 id="mTitle">Инфо</h2><button id="mClose" class="btn-ghost">Закрыть</button></div><div id="mBody"></div></div></div>

<script type="module">
import { auth, db, getNetworkErrorMessage } from './firebase.js';
import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.14.0/firebase-auth.js";
import { collection, doc, getDoc, getDocs, orderBy, query, where } from "https://www.gstatic.com/firebasejs/10.14.0/firebase-firestore.js";

const state={users:[],levels:[],comps:[],scoring:{maximumPoints:100,rankDecayFactor:3,repeatPenaltyPower:.5},playersView:true};
const statusEl=document.getElementById('status');
const playersPanel=document.getElementById('playersPanel');
const levelsPanel=document.getElementById('levelsPanel');

function calc(rank,size,k=1){
  const n=Math.max(2,Number(size||2));
  const r=Math.max(1,Math.min(Number(rank||1),n));
  const x=(r-1)/(n-1);
  return Math.round((state.scoring.maximumPoints*Math.exp(-state.scoring.rankDecayFactor*x)/Math.pow(Math.max(1,k),state.scoring.repeatPenaltyPower))*100)/100;
}

function openInfo(title,html){
  document.getElementById('infoTitle').textContent=title;
  document.getElementById('infoBody').innerHTML=html;
  document.getElementById('infoModal').classList.add('open');
}

function renderPlayers(){
  const q=document.getElementById('search').value.trim().toLowerCase();
  const box=document.getElementById('players');
  box.innerHTML='';

  const filtered=state.users.filter(u=>!q || String(u.nick??'').toLowerCase().includes(q));
  let rowNo=0,rank=0,last=null;
  filtered.forEach(u=>{
    rowNo++; if(u.points!==last){rank=rowNo;last=u.points;}
    const row=document.createElement('div');
    row.className='row list-item clickable';
    if(u.role==='moderator') row.classList.add('moderator');
    if(u.role==='elder') row.classList.add('elder');
    row.innerHTML=`<div>${rank}</div><div>${u.nick??'Без ника'}</div><div>${Number(u.points??0)}</div>`;
    row.onclick=()=>{
      const comps=state.comps.filter(c=>c.playerId===u.id);
      let html=`<p><b>Почта:</b> ${u.email??'—'}</p><p><b>Роль:</b> ${u.role??'player'}</p><p><b>Очки:</b> ${Number(u.points??0)}</p><h3>Подтвержденные прохождения</h3>`;
      if(!comps.length) html+='<p>Нет подтвержденных прохождений.</p>';
      else comps.forEach(c=>{html+=`<div class='row'><div>#${c.listRank??'—'}</div><div>${c.text??'Уровень'}</div><div>${Number(c.awardedPoints??0)}</div></div>`});
      openInfo(`Игрок: ${u.nick??'Без ника'}`, html);
    };
    box.appendChild(row);
  });
  if(!filtered.length) box.innerHTML='<p>Игроки не найдены.</p>';
}

function renderLevels(){
  const box=document.getElementById('levels');
  box.innerHTML='';
  const size=Math.max(2,state.levels.length);

  state.levels.forEach(l=>{
    const row=document.createElement('div');
    row.className='row list-item clickable';
    row.innerHTML=`<div>#${l.rank??'—'}</div><div>${l.text??'Без названия'}</div><div>${calc(l.rank,size,1)}</div>`;
    row.onclick=()=>{
      const passed=state.comps.filter(c=>(c.levelId&&c.levelId===l.id)||(!c.levelId&&Number(c.listRank)===Number(l.rank)));
      let html=`<p><b>Название:</b> ${l.text??'—'}</p><p><b>Место:</b> ${l.rank??'—'}</p><h3>Прошли уровень</h3>`;
      if(!passed.length) html+='<p>Пока никто не прошел.</p>';
      else passed.forEach(c=>{html+=`<div class='row'><div>${c.nick??'Без ника'}</div><div></div><div>${Number(c.awardedPoints??0)}</div></div>`});
      openInfo(`Уровень #${l.rank??'—'}`, html);
    };
    box.appendChild(row);
  });
  if(!state.levels.length) box.innerHTML='<p>Лист уровней пуст.</p>';
}

  if(!state.levels.length) box.innerHTML='<p>Лист уровней пуст.</p>';
}

function setView(players){
  state.playersView=players;
  playersPanel.classList.toggle('active',players);
  levelsPanel.classList.toggle('active',!players);
  document.getElementById('showPlayers').classList.toggle('btn-success',players);
  document.getElementById('showLevels').classList.toggle('btn-success',!players);
}

document.getElementById('showPlayers').onclick=()=>setView(true);
document.getElementById('showLevels').onclick=()=>setView(false);
document.getElementById('search').oninput=renderPlayers;
document.getElementById('back').onclick=()=>location.href='main.html';
document.getElementById('closeInfo').onclick=()=>document.getElementById('infoModal').classList.remove('open');

onAuthStateChanged(auth, async user=>{
  if(!user) return location.href='index.html';
  try {
    const meSnap=await getDoc(doc(db,'users',user.uid));
    const me=meSnap.exists()?meSnap.data():null;
    if(!me || me.situation!=='verified') return location.href='nick.html';

    const [uSnap,lSnap,cSnap,sSnap]=await Promise.all([
      getDocs(query(collection(db,'users'),orderBy('points','desc'))),
      getDocs(query(collection(db,'levels'),orderBy('rank','asc'))),
      getDocs(query(collection(db,'completion_submissions'),where('status','==','approved'))),
      getDoc(doc(db,'settings','scoring'))
    ]);

    state.users=[]; uSnap.forEach(d=>{const u=d.data(); if(u.situation==='verified') state.users.push({id:d.id,...u});});
    state.levels=[]; lSnap.forEach(d=>{const l=d.data(); if(l.status!=='archived') state.levels.push({id:d.id,...l});});
    state.comps=[]; cSnap.forEach(d=>state.comps.push({id:d.id,...d.data()}));

    const s=sSnap.exists()?sSnap.data():{};
    state.scoring={
      maximumPoints:Number(s.maximumPoints??s.maxPoints??100),
      rankDecayFactor:Number(s.rankDecayFactor??s.decayA??3),
      repeatPenaltyPower:Number(s.repeatPenaltyPower??s.grindPower??.5)
    };

    renderPlayers();
    renderLevels();
    setView(true);
    statusEl.textContent='';
  } catch (e){
    console.error(e);
    statusEl.textContent=getNetworkErrorMessage(e);
  }
});
</script>
</body>
</html>
