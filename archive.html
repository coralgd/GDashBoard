<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>SpinList — Архив</title>
<link rel="stylesheet" href="hud.css">
<style>
  .toolbar{display:grid;grid-template-columns:minmax(220px,1fr) 180px;gap:10px;margin-bottom:10px}
  .pill{font-size:11px;opacity:.9;padding:2px 8px;border:1px solid rgba(0,180,255,.35);border-radius:999px}
  @media (max-width: 760px){.toolbar{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="brand-hero"><img src="spinlist-logo.svg" alt="SpinList logo"><div class="brand-title">SPINLIST</div></div>
<div class="hud" style="max-width:1200px;margin:40px auto;">
  <div class="page-header"><h1>Архив</h1><button id="back" class="btn-ghost">На главную</button></div>
  <div class="top-actions"><button id="openModeratorLog" class="btn-ghost">Журнал действий модеров</button></div>
  <p id="status" style="color:#00ffff;">Загрузка...</p>

  <div class="toolbar card">
    <div>
      <label>Поиск</label>
      <input id="search" placeholder="Игрок, уровень, текст, статус">
    </div>
    <div>
      <label>Группа</label>
      <select id="viewType"><option value="byLevel">По уровням</option><option value="byPlayer">По игрокам</option></select>
    </div>
  </div>
  <div id="archive"></div>
</div>

<div id="moderatorLogModal" class="dialog-backdrop"><div class="dialog" style="width:min(980px,96vw);max-height:92vh;overflow:auto;"><div class="page-header"><h2 style="margin:0;">Журнал действий модеров</h2><button id="closeModeratorLog" class="btn-ghost">Закрыть</button></div><div id="moderatorLogList"></div></div></div>

<script type="module">
import { auth, db, getNetworkErrorMessage } from './firebase.js';
import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.14.0/firebase-auth.js";
import { collection, getDocs, doc, getDoc, limit, orderBy, query } from "https://www.gstatic.com/firebasejs/10.14.0/firebase-firestore.js";

document.getElementById('back').onclick = ()=> location.href='main.html';
const statusEl = document.getElementById('status');
const dataState = { rows: [] };

function fmt(ts){ return ts?.seconds ? new Date(ts.seconds * 1000).toLocaleString('ru-RU') : '—'; }
function norm(v, fallback='—'){ const x=String(v ?? '').trim(); return x || fallback; }

function renderArchive(){
  const q = document.getElementById('search').value.trim().toLowerCase();
  const viewType = document.getElementById('viewType').value;
  const filtered = dataState.rows.filter(r=>{
    const hay = `${r.levelName} ${r.playerName} ${r.type} ${r.status} ${r.text} ${r.note}`.toLowerCase();
    return !q || hay.includes(q);
  });
  const grouped = new Map();
  filtered.forEach(r=>{
    const key = viewType==='byLevel' ? r.levelName : r.playerName;
    if(!grouped.has(key)) grouped.set(key, []);
    grouped.get(key).push(r);
  });

  const box = document.getElementById('archive');
  if(!filtered.length){ box.innerHTML = '<p>Ничего не найдено.</p>'; return; }

  const keys = Array.from(grouped.keys()).sort((a,b)=>a.localeCompare(b,'ru'));
  const folderCard = `<div class="card"><h3 style="margin-top:0">📁 Журнал действий модеров</h3><p class="small">Отдельная папка с действиями модераторов и старших модераторов.</p><button id="openModeratorLogFolder" class="btn-ghost">Открыть журнал</button></div>`;
  box.innerHTML = folderCard + keys.map(k=>{
    const rows = grouped.get(k).sort((a,b)=>(b.createdAt?.seconds ?? 0) - (a.createdAt?.seconds ?? 0));
    return `<div class="card"><h3 style="margin-top:0">${k} <span class="pill">${rows.length}</span></h3>${rows.map((x,i)=>`<div class="list-item"><b>#${i+1} · ${x.type} · ${x.status}</b><p>${x.text || '—'}</p><p class="small">игрок=${x.playerName} · уровень=${x.levelName}</p><p class="small">link=${x.link || '—'} · file=${x.fileUrl || '—'} · note=${x.note || '—'} · дата=${fmt(x.createdAt)}</p></div>`).join('')}</div>`;
  }).join('');
  const folderBtn = document.getElementById('openModeratorLogFolder');
  if(folderBtn) folderBtn.onclick = async ()=>{ await loadModeratorLog(); document.getElementById('moderatorLogModal').classList.add('open'); };
}

async function loadData(){
  const [levelsSnap, ls, cs, ap] = await Promise.all([
    getDocs(collection(db,'levels')),
    getDocs(collection(db,'level_submissions')),
    getDocs(collection(db,'completion_submissions')),
    getDocs(collection(db,'appeals')),
  ]);
  let awardsSnap = null; try { awardsSnap = await getDocs(collection(db,'point_awards')); } catch {}
  let messagesSnap = null; try { messagesSnap = await getDocs(collection(db,'messages')); } catch {}
  let moderatorMessagesSnap = null; try { moderatorMessagesSnap = await getDocs(collection(db,'moderator_messages')); } catch {}

  const levelById = new Map(); const levelByRank = new Map();
  levelsSnap.forEach(d=>{ const l=d.data(); levelById.set(d.id, norm(l.text,`Уровень ${d.id}`)); if(l.rank!=null) levelByRank.set(Number(l.rank), norm(l.text,`Уровень #${l.rank}`)); });

  const rows = [];
  ls.forEach(d=>{ const x=d.data(); if(!x.status || x.status==='pending') return; rows.push({ type:'placement', status:x.status, text:x.text??'', note:x.note??'', link:x.link??'', fileUrl:x.fileUrl??'', playerName:norm(x.nick,'Без ника'), levelName:x.finalRank!=null?(levelByRank.get(Number(x.finalRank)) ?? `Уровень #${x.finalRank}`):'Без уровня', createdAt:x.createdAt ?? x.reviewedAt ?? null }); });
  cs.forEach(d=>{ const x=d.data(); if(!x.status || x.status==='pending') return; rows.push({ type:'completion', status:x.status, text:x.text??'', note:x.note??'', link:x.link??'', fileUrl:x.fileUrl??'', playerName:norm(x.nick,'Без ника'), levelName:x.levelId?(levelById.get(x.levelId) ?? `Уровень ${x.levelId}`):(x.listRank!=null?(levelByRank.get(Number(x.listRank)) ?? `Уровень #${x.listRank}`):'Без уровня'), createdAt:x.createdAt ?? x.reviewedAt ?? null }); });
  ap.forEach(d=>{ const x=d.data(); if(!x.status || x.status==='pending') return; rows.push({ type:'appeal', status:x.status, text:x.text??'', note:x.note??'', link:x.link??'', fileUrl:x.fileUrl??'', playerName:norm(x.nick,'Без ника'), levelName:x.levelId?(levelById.get(x.levelId) ?? `Уровень ${x.levelId}`):(x.listRank!=null?(levelByRank.get(Number(x.listRank)) ?? `Уровень #${x.listRank}`):'Без уровня'), createdAt:x.createdAt ?? x.reviewedAt ?? null }); });
  if(awardsSnap) awardsSnap.forEach(d=>{ const x=d.data(); rows.push({ type:'award', status:'done', text:`${Number(x.amount ?? 0)} очков`, note:x.reason ?? '', link:'', fileUrl:'', playerName:norm(x.playerNick,'Без ника'), levelName:'Начисления', createdAt:x.createdAt ?? null }); });
  if(messagesSnap) messagesSnap.forEach(d=>{ const x=d.data(); rows.push({ type:'message', status:x.readAt?'read':'unread', text:x.text ?? '', note:`от ${norm(x.fromNick,'—')} → ${norm(x.toNick,'—')}`, link:'', fileUrl:'', playerName:norm(x.toNick,'Без ника'), levelName:'Сообщения', createdAt:x.createdAt ?? null }); });
  if(moderatorMessagesSnap) moderatorMessagesSnap.forEach(d=>{ const x=d.data(); rows.push({ type:'message', status:x.readAt?'read':'unread', text:x.text ?? '', note:`[mod] ${norm(x.fromNick,'—')} → ${norm(x.toNick,'—')}`, link:'', fileUrl:'', playerName:norm(x.toNick,'Без ника'), levelName:'Сообщения', createdAt:x.createdAt ?? null }); });

  dataState.rows = rows;
}

function renderModeratorLogRows(rows){
  const list = document.getElementById('moderatorLogList');
  if(!rows.length){ list.innerHTML = '<p>Журнал пока пуст.</p>'; return; }
  rows.sort((a,b)=>(b.createdAt?.seconds ?? 0) - (a.createdAt?.seconds ?? 0));
  list.innerHTML = rows.slice(0,200).map((x, i)=>`<div class="card"><b>#${i+1} · ${x.action ?? 'action'}</b><p class="small">${fmt(x.createdAt)} · ${x.actorNick ?? '—'} (${x.actorRole ?? 'moderator'})</p><pre class="small" style="white-space:pre-wrap;margin:0;">${JSON.stringify(x.details ?? {}, null, 2)}</pre></div>`).join('');
}

async function buildModeratorLogFallback(){
  const [levelSnap, compSnap, appealSnap, awardsSnap] = await Promise.all([
    getDocs(collection(db,'level_submissions')),
    getDocs(collection(db,'completion_submissions')),
    getDocs(collection(db,'appeals')),
    getDocs(collection(db,'point_awards'))
  ]);
  const rows = [];
  levelSnap.forEach(d=>{ const x=d.data(); if(!x.reviewedBy || !x.reviewedAt || !x.status || x.status==='pending') return; rows.push({ action:'review_level_submission', actorNick:x.reviewedByNick ?? x.reviewedBy ?? '—', actorRole:'moderator', createdAt:x.reviewedAt, details:{ submissionId:d.id, verdict:x.status, finalRank:x.finalRank ?? null, note:x.note ?? '' } }); });
  compSnap.forEach(d=>{ const x=d.data(); if(!x.reviewedBy || !x.reviewedAt || !x.status || x.status==='pending') return; rows.push({ action:'review_completion_submission', actorNick:x.reviewedByNick ?? x.reviewedBy ?? '—', actorRole:'moderator', createdAt:x.reviewedAt, details:{ submissionId:d.id, verdict:x.status, levelId:x.levelId ?? null, note:x.note ?? '' } }); });
  appealSnap.forEach(d=>{ const x=d.data(); if(!x.reviewedBy || !x.reviewedAt || !x.status || x.status==='pending') return; rows.push({ action:'review_appeal', actorNick:x.reviewedByNick ?? x.reviewedBy ?? '—', actorRole:'moderator', createdAt:x.reviewedAt, details:{ appealId:d.id, verdict:x.status, note:x.note ?? '' } }); });
  awardsSnap.forEach(d=>{ const x=d.data(); if(!x.grantedBy || !x.createdAt) return; rows.push({ action:'manual_points_award', actorNick:x.grantedByNick ?? x.grantedBy ?? '—', actorRole:'moderator', createdAt:x.createdAt, details:{ playerNick:x.playerNick ?? '—', amount:Number(x.amount ?? 0), reason:x.reason ?? '' } }); });
  return rows;
}

async function loadModeratorLog(){
  const list = document.getElementById('moderatorLogList');
  list.innerHTML = '<p>Загрузка журнала…</p>';
  try {
    const snap = await getDocs(query(collection(db,'moderator_actions'), orderBy('createdAt','desc'), limit(200)));
    const rows = [];
    snap.forEach(d=>rows.push(d.data()));
    renderModeratorLogRows(rows);
  } catch (e) {
    try {
      const rows = await buildModeratorLogFallback();
      renderModeratorLogRows(rows);
      list.insertAdjacentHTML('afterbegin', `<p class="small">Основной журнал недоступен (${getNetworkErrorMessage(e)}). Показана восстановленная версия по данным заявок.</p>`);
    } catch (fallbackError) {
      list.innerHTML = `<p>${getNetworkErrorMessage(fallbackError)}</p>`;
    }
  }
}

onAuthStateChanged(auth, async user=>{
  if(!user) return location.href='index.html';
  try {
    const meSnap = await getDoc(doc(db,'users',user.uid));
    const me = meSnap.exists() ? meSnap.data() : null;
    if(!me || me.situation!=='verified') return location.href='nick.html';
    await loadData();
    renderArchive();
    statusEl.textContent='';
  } catch(e){ statusEl.textContent = getNetworkErrorMessage(e); }
});

document.getElementById('search').oninput = renderArchive;
document.getElementById('viewType').onchange = renderArchive;
document.getElementById('openModeratorLog').onclick = async ()=>{ await loadModeratorLog(); document.getElementById('moderatorLogModal').classList.add('open'); };
document.getElementById('closeModeratorLog').onclick = ()=> document.getElementById('moderatorLogModal').classList.remove('open');
</script>
</body>
</html>
