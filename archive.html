<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Архив</title>
<link rel="stylesheet" href="hud.css">
<style>
  .folder{cursor:pointer}
  .path{margin:8px 0}
  .tag{font-size:11px;opacity:.8;padding:2px 6px;border:1px solid rgba(0,180,255,.35);border-radius:999px;margin-left:8px}
</style>
</head>
<body>
<div class="hud" style="max-width:1200px;margin:40px auto;">
  <div class="page-header"><h1>Архив</h1><button id="back" class="btn-ghost">На главную</button></div>
  <p id="status" style="color:#00ffff;">Загрузка...</p>
  <div id="archive"></div>
</div>

<script type="module">
import { auth, db, getNetworkErrorMessage } from './firebase.js';
import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.14.0/firebase-auth.js";
import { collection, getDocs, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.14.0/firebase-firestore.js";

document.getElementById('back').onclick = ()=> location.href='main.html';
const statusEl = document.getElementById('status');

const state = {
  search: '',
  levels: new Map(), // level -> Map(player -> types)
  players: new Map(), // player -> Map(level -> types)
  view: 'root',
  rootType: '', // level|player
  rootName: '',
  secondName: '',
  itemType: ''
};

const TYPE_LABELS = {
  completion: 'заявки на прохождение',
  appeal: 'апелляции',
  comments: 'комментарии модера',
  placement: 'заявки на постановку'
};

function ensurePair(levelName, playerName){
  if(!state.levels.has(levelName)) state.levels.set(levelName, new Map());
  const byPlayer = state.levels.get(levelName);
  if(!byPlayer.has(playerName)) byPlayer.set(playerName, { completion:[], appeal:[], comments:[], placement:[] });

  if(!state.players.has(playerName)) state.players.set(playerName, new Map());
  const byLevel = state.players.get(playerName);
  if(!byLevel.has(levelName)) byLevel.set(levelName, { completion:[], appeal:[], comments:[], placement:[] });

  return { byPlayer: byPlayer.get(playerName), byLevel: byLevel.get(levelName) };
}

function addToPair(levelName, playerName, type, item){
  const p = ensurePair(levelName, playerName);
  p.byPlayer[type].push(item);
  p.byLevel[type].push(item);
}

function addCommentIfNeeded(levelName, playerName, item){
  if(!item.note && !item.reviewedBy && !item.reviewedAt) return;
  addToPair(levelName, playerName, 'comments', item);
}

function normalizeName(v, fallback){
  const x = String(v ?? '').trim();
  return x || fallback;
}

function matchName(name, q){
  const n = name.toLowerCase();
  return n.startsWith(q) || n.includes(q);
}

function breadcrumb(){
  if(state.view==='root') return 'Корень';
  if(state.view==='levelPlayers') return `Уровень: ${state.rootName}`;
  if(state.view==='playerLevels') return `Игрок: ${state.rootName}`;
  if(state.view==='pairTypes') return `${state.rootType==='level'?'Уровень':'Игрок'}: ${state.rootName} → ${state.secondName}`;
  return `${state.rootType==='level'?'Уровень':'Игрок'}: ${state.rootName} → ${state.secondName} → ${TYPE_LABELS[state.itemType]}`;
}

function pairTypesForCurrent(){
  if(state.rootType==='level') return state.levels.get(state.rootName)?.get(state.secondName);
  return state.players.get(state.rootName)?.get(state.secondName);
}

function render(){
  const box = document.getElementById('archive');
  const q = state.search.trim().toLowerCase();
  box.innerHTML = `
    <div class="path top-actions">
      <button id="goRoot" class="btn-ghost">Корень</button>
      <span class="small">${breadcrumb()}</span>
    </div>
    <label>Поиск (в корне ищет только папки типа «уровень» и «игрок»)</label>
    <input id="search" placeholder="Введите имя игрока или название уровня" value="${state.search.replace(/"/g,'&quot;')}" />
    <div id="content" style="margin-top:10px"></div>
  `;

  document.getElementById('goRoot').onclick = ()=>{ state.view='root'; state.rootType=''; state.rootName=''; state.secondName=''; state.itemType=''; render(); };
  document.getElementById('search').oninput = (e)=>{ state.search = e.target.value; render(); };

  const content = document.getElementById('content');

  if(state.view==='root'){
    if(!q){
      content.innerHTML = '<p>Введите поиск, чтобы открыть папки архива.</p>';
      return;
    }

    const levelHits = Array.from(state.levels.keys()).filter(x=>matchName(x,q)).sort((a,b)=>a.localeCompare(b,'ru'));
    const playerHits = Array.from(state.players.keys()).filter(x=>matchName(x,q)).sort((a,b)=>a.localeCompare(b,'ru'));

    if(!levelHits.length && !playerHits.length){
      content.innerHTML = '<p>Совпадений нет.</p>';
      return;
    }

    let html='';
    levelHits.forEach(name=> html += `<div class="row folder" data-type="level" data-name="${name}">📁 <b>${name}</b> <span class="tag">уровень</span></div>`);
    playerHits.forEach(name=> html += `<div class="row folder" data-type="player" data-name="${name}">📁 <b>${name}</b> <span class="tag">игрок</span></div>`);
    content.innerHTML = html;

    content.querySelectorAll('.folder').forEach(el=>el.onclick=()=>{
      state.rootType = el.dataset.type;
      state.rootName = el.dataset.name;
      state.secondName = '';
      state.itemType = '';
      state.view = state.rootType === 'level' ? 'levelPlayers' : 'playerLevels';
      render();
    });
    return;
  }

  if(state.view==='levelPlayers'){
    const players = Array.from((state.levels.get(state.rootName) ?? new Map()).keys()).filter(x=>!q||matchName(x,q)).sort((a,b)=>a.localeCompare(b,'ru'));
    if(!players.length){ content.innerHTML='<p>Игроков не найдено.</p>'; return; }
    content.innerHTML = players.map(p=>`<div class="row folder" data-name="${p}">📁 <b>${p}</b> <span class="tag">игрок</span></div>`).join('');
    content.querySelectorAll('.folder').forEach(el=>el.onclick=()=>{ state.secondName=el.dataset.name; state.view='pairTypes'; render(); });
    return;
  }

  if(state.view==='playerLevels'){
    const levels = Array.from((state.players.get(state.rootName) ?? new Map()).keys()).filter(x=>!q||matchName(x,q)).sort((a,b)=>a.localeCompare(b,'ru'));
    if(!levels.length){ content.innerHTML='<p>Уровней не найдено.</p>'; return; }
    content.innerHTML = levels.map(l=>`<div class="row folder" data-name="${l}">📁 <b>${l}</b> <span class="tag">уровень</span></div>`).join('');
    content.querySelectorAll('.folder').forEach(el=>el.onclick=()=>{ state.secondName=el.dataset.name; state.view='pairTypes'; render(); });
    return;
  }

  if(state.view==='pairTypes'){
    const types = pairTypesForCurrent();
    if(!types){ content.innerHTML='<p>Нет данных.</p>'; return; }
    const keys = Object.keys(TYPE_LABELS).filter(k=>types[k]?.length);
    if(!keys.length){ content.innerHTML='<p>Папки пусты.</p>'; return; }
    content.innerHTML = keys.map(k=>`<div class="row folder" data-type="${k}">📁 <b>${TYPE_LABELS[k]}</b> <span class="small">(${types[k].length})</span></div>`).join('');
    content.querySelectorAll('.folder').forEach(el=>el.onclick=()=>{ state.itemType=el.dataset.type; state.view='items'; render(); });
    return;
  }

  const types = pairTypesForCurrent();
  const items = (types?.[state.itemType] ?? [])
    .filter(x=>!q || `${x.text ?? ''} ${x.link ?? ''} ${x.note ?? ''} ${x.status ?? ''} ${x.referenceSubmissionId ?? ''}`.toLowerCase().includes(q))
    .sort((a,b)=>(b.reviewedAt?.seconds ?? 0)-(a.reviewedAt?.seconds ?? 0));

  if(!items.length){ content.innerHTML='<p>Отправки не найдены.</p>'; return; }
  content.innerHTML = items.map((x,i)=>{
    const when = x.reviewedAt?.seconds ? new Date(x.reviewedAt.seconds*1000).toLocaleString('ru-RU') : '—';
    return `<div class="card"><b>#${i+1} · ${x.status ?? '—'}</b><p>${x.text ?? ''}</p><p class="small">link=${x.link ?? '—'} · file=${x.fileUrl ?? '—'} · ref=${x.referenceSubmissionId ?? '—'}</p><p class="small">note=${x.note ?? '—'} · reviewedBy=${x.reviewedBy ?? '—'} · reviewedAt=${when}</p></div>`;
  }).join('');
}

async function loadData(){
  const [levelListSnap, ls, cs, ap] = await Promise.all([
    getDocs(collection(db,'levels')),
    getDocs(collection(db,'level_submissions')),
    getDocs(collection(db,'completion_submissions')),
    getDocs(collection(db,'appeals'))
  ]);

  const levelNameById = new Map();
  const levelNameByRank = new Map();
  levelListSnap.forEach(d=>{
    const l = d.data();
    levelNameById.set(d.id, normalizeName(l.text, `Уровень ${d.id}`));
    if(l.rank!=null) levelNameByRank.set(Number(l.rank), normalizeName(l.text, `Уровень #${l.rank}`));
  });

  state.levels = new Map();
  state.players = new Map();

  ls.forEach(d=>{
    const x = d.data();
    if(!x.status || x.status==='pending') return;
    const levelName = x.finalRank!=null ? (levelNameByRank.get(Number(x.finalRank)) ?? `Уровень #${x.finalRank}`) : 'Без уровня';
    const player = normalizeName(x.nick, 'Без ника');
    addToPair(levelName, player, 'placement', x);
    addCommentIfNeeded(levelName, player, x);
  });

  cs.forEach(d=>{
    const x = d.data();
    if(!x.status || x.status==='pending') return;
    let levelName = 'Без уровня';
    if(x.levelId) levelName = levelNameById.get(x.levelId) ?? `Уровень ${x.levelId}`;
    else if(x.listRank!=null) levelName = levelNameByRank.get(Number(x.listRank)) ?? `Уровень #${x.listRank}`;
    const player = normalizeName(x.nick, 'Без ника');
    addToPair(levelName, player, 'completion', x);
    addCommentIfNeeded(levelName, player, x);
  });

  ap.forEach(d=>{
    const x = d.data();
    if(!x.status || x.status==='pending') return;
    let levelName = 'Без уровня';
    if(x.levelId) levelName = levelNameById.get(x.levelId) ?? `Уровень ${x.levelId}`;
    else if(x.listRank!=null) levelName = levelNameByRank.get(Number(x.listRank)) ?? `Уровень #${x.listRank}`;
    const player = normalizeName(x.nick, 'Без ника');
    addToPair(levelName, player, 'appeal', x);
    addCommentIfNeeded(levelName, player, x);
  });
}

onAuthStateChanged(auth, async user=>{
  if(!user) return location.href='index.html';
  try {
    const meSnap = await getDoc(doc(db,'users',user.uid));
    const me = meSnap.exists() ? meSnap.data() : null;
    if(!me || me.situation!=='verified') return location.href='nick.html';

    await loadData();
    statusEl.textContent='';
    render();
  } catch(e){
    statusEl.textContent = getNetworkErrorMessage(e);
  }
});
</script>
</body>
</html>
