<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Меню уровней модератора</title>
<link rel="stylesheet" href="hud.css">
<style>
  .panel{display:none;margin-top:14px}
  .panel.active{display:block}
  .row{border:1px solid #2d8cff55;background:rgba(0,20,50,.35);padding:12px;border-radius:10px;margin-bottom:12px}
  .row input{width:100%;margin:6px 0}
</style>
</head>
<body>
<div class="hud" style="max-width:1080px;margin:40px auto;">
  <div class="page-header">
    <h1 style="margin:0;">Меню уровней модератора</h1>
    <button id="back" class="btn-ghost">Назад</button>
  </div>
  <p id="status" style="color:#00ffff;">Загрузка...</p>

  <div class="tabs">
    <button data-tab="levels">Заявки уровней</button>
    <button data-tab="completions">Заявки прохождений</button>
  </div>

  <div id="levels" class="panel active"></div>
  <div id="completions" class="panel"></div>
</div>

<script type="module">
import { auth, db } from './firebase.js';
import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.14.0/firebase-auth.js";
import { collection, query, where, getDocs, doc, getDoc, updateDoc, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.14.0/firebase-firestore.js";

const statusEl = document.getElementById('status');

document.getElementById('back').onclick = ()=> location.href='moderator.html';
function setTab(id){
  document.querySelectorAll('.panel').forEach(x=>x.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  document.querySelectorAll('.tabs button').forEach(btn=>btn.classList.toggle('active', btn.dataset.tab===id));
}
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>setTab(b.dataset.tab));

async function getScoring(){
  const snap = await getDoc(doc(db,'settings','scoring'));
  const s = snap.exists() ? snap.data() : {};
  return {
    maximumPoints: Number(s.maximumPoints ?? s.maxPoints ?? 100),
    rankDecayFactor: Number(s.rankDecayFactor ?? s.decayA ?? 3),
    repeatPenaltyPower: Number(s.repeatPenaltyPower ?? s.grindPower ?? 0.5)
  };
}

function calculateCompletionPoints(listRank, listSize, approvedCompletionsCount, scoringSettings){
  const normalizedListSize = Math.max(2, Number(listSize || 2));
  const normalizedRank = Math.max(1, Math.min(Number(listRank || 1), normalizedListSize));
  const x = (normalizedRank - 1) / (normalizedListSize - 1);
  const base = scoringSettings.maximumPoints * Math.exp(-scoringSettings.rankDecayFactor * x);
  const antiGrind = 1 / Math.pow(Math.max(1, approvedCompletionsCount), scoringSettings.repeatPenaltyPower);
  return Math.round(base * antiGrind * 100) / 100;
}

async function loadPendingLevels(me){
  const box = document.getElementById('levels');
  box.innerHTML = 'Загрузка заявок уровней...';
  const snap = await getDocs(query(collection(db,'level_submissions'), where('status','==','pending')));
  if(snap.empty){ box.innerHTML = '<p>Нет заявок.</p>'; return; }
  box.innerHTML = '';

  snap.forEach(d=>{
    const s = d.data();
    const row = document.createElement('div');
    row.className='row';
    row.innerHTML = `
      <b>${s.nick ?? 'Без ника'}</b><br>
      <a href="${s.link}" target="_blank">Ссылка</a>
      <p>${s.text ?? ''}</p>
      <p class="small">Файл: ${s.fileUrl || '—'}</p>
      <input placeholder="Комментарий модератора" class="note">
      <input type="number" min="1" placeholder="Место в листе" class="rank">
      <div class="top-actions">
        <button class="approve">Одобрить и поставить в лист</button>
        <button class="reject btn-danger">Отклонить</button>
      </div>
    `;
    box.appendChild(row);

    row.querySelector('.approve').onclick = async ()=>{
      const note = row.querySelector('.note').value.trim();
      const rank = Number(row.querySelector('.rank').value);
      if(!rank){ alert('Укажи место'); return; }
      await addDoc(collection(db,'levels'), {
        link:s.link, text:s.text ?? '', fileUrl:s.fileUrl ?? '', rank,
        addedBy:me.uid, addedByNick:me.nick ?? 'moderator', createdAt:serverTimestamp(),
        sourceSubmissionId:d.id, status:'active'
      });
      await updateDoc(doc(db,'level_submissions',d.id), {
        status:'approved', note, reviewedBy:me.uid, reviewedAt:serverTimestamp(), finalRank:rank
      });
      row.remove();
    };

    row.querySelector('.reject').onclick = async ()=>{
      const note = row.querySelector('.note').value.trim() || 'Отклонено модератором';
      await updateDoc(doc(db,'level_submissions',d.id), {
        status:'rejected', note, reviewedBy:me.uid, reviewedAt:serverTimestamp()
      });
      row.remove();
    };
  });
}

async function loadPendingCompletions(me){
  const box = document.getElementById('completions');
  box.innerHTML = 'Загрузка заявок прохождений...';
  const snap = await getDocs(query(collection(db,'completion_submissions'), where('status','==','pending')));
  if(snap.empty){ box.innerHTML = '<p>Нет заявок.</p>'; return; }

  const levelsSnap = await getDocs(collection(db,'levels'));
  const levels = [];
  levelsSnap.forEach(d=>levels.push({id:d.id, ...d.data()}));
  const quantity = Math.max(levels.length, 2);
  const scoreCfg = await getScoring();

  box.innerHTML = '';
  snap.forEach(d=>{
    const s = d.data();
    const row = document.createElement('div');
    row.className='row';
    row.innerHTML = `
      <b>${s.nick ?? 'Без ника'}</b><br>
      <a href="${s.link}" target="_blank">Доказательство</a>
      <p>${s.text ?? ''}</p>
      <p class="small">Файл: ${s.fileUrl || '—'}</p>
      <input type="number" min="1" max="${quantity}" placeholder="Место уровня в листе" class="rank">
      <input placeholder="Комментарий модератора" class="note">
      <div class="top-actions">
        <button class="approve">Подтвердить прохождение</button>
        <button class="reject btn-danger">Отклонить</button>
      </div>
    `;
    box.appendChild(row);

    row.querySelector('.approve').onclick = async ()=>{
      const note = row.querySelector('.note').value.trim();
      const rank = Number(row.querySelector('.rank').value);
      if(!rank){ alert('Укажи место уровня'); return; }

      const userRef = doc(db,'users',s.playerId);
      const userSnap = await getDoc(userRef);
      const u = userSnap.exists() ? userSnap.data() : null;
      if(!u){ alert('Игрок не найден'); return; }

      const userComps = await getDocs(query(collection(db,'completion_submissions'), where('playerId','==',s.playerId)));
      let approvedCount = 0;
      userComps.forEach(x=>{ if(x.data().status==='approved') approvedCount++; });
      const k = approvedCount + 1;

      const earned = calculateCompletionPoints(rank, quantity, k, scoreCfg);
      await updateDoc(userRef, { points:Number(u.points ?? 0) + earned });
      await updateDoc(doc(db,'completion_submissions',d.id), {
        status:'approved', note, reviewedBy:me.uid, reviewedAt:serverTimestamp(),
        awardedPoints:earned, listRank:rank, listQuantity:quantity, scoreK:k
      });
      row.remove();
    };

    row.querySelector('.reject').onclick = async ()=>{
      const note = row.querySelector('.note').value.trim() || 'Отклонено модератором';
      await updateDoc(doc(db,'completion_submissions',d.id), {
        status:'rejected', note, reviewedBy:me.uid, reviewedAt:serverTimestamp()
      });
      row.remove();
    };
  });
}

onAuthStateChanged(auth, async user => {
  if(!user) return location.href='index.html';
  try {
    const meSnap = await getDoc(doc(db,'users',user.uid));
    const me = meSnap.exists() ? meSnap.data() : null;
    if(!me || me.situation!=='verified') return location.href='nick.html';
    if(me.role!=='moderator' && me.role!=='elder') return location.href='main.html';

    await loadPendingLevels({uid:user.uid, nick:me.nick});
    await loadPendingCompletions({uid:user.uid, nick:me.nick});
    statusEl.textContent = '';
  } catch (e) {
    console.error(e);
    statusEl.textContent = 'Не удалось загрузить меню уровней модератора.';
  }
});
</script>
</body>
</html>
