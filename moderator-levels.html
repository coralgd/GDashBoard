<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Меню уровней модератора</title>
<link rel="stylesheet" href="hud.css">
<style>.panel{display:none}.panel.active{display:block}</style>
</head>
<body>
<div class="hud" style="max-width:1100px;margin:36px auto;">
  <div class="page-header">
    <h1 style="margin:0;">Меню уровней модератора</h1>
    <button id="back" class="btn-ghost">Назад</button>
  </div>
  <p id="status" style="color:#00ffff;">Загрузка...</p>

  <div class="tabs" style="grid-template-columns:1fr 1fr;">
    <button data-tab="level" class="active">Заявки уровней</button>
    <button data-tab="completion">Заявки прохождений</button>
  </div>

  <div id="levelPanel" class="panel active"></div>
  <div id="completionPanel" class="panel"></div>
</div>

<div id="modal" class="dialog-backdrop">
  <div class="dialog">
    <div class="page-header">
      <h2 id="modalTitle" style="margin:0;">Заявка</h2>
      <button id="closeModal" class="btn-ghost">Закрыть</button>
    </div>
    <div id="modalBody"></div>
  </div>
</div>

<script type="module">
import { auth, db } from './firebase.js';
import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.14.0/firebase-auth.js";
import { addDoc, collection, doc, getDoc, getDocs, query, serverTimestamp, updateDoc, where } from "https://www.gstatic.com/firebasejs/10.14.0/firebase-firestore.js";

const statusEl = document.getElementById('status');
const modal = document.getElementById('modal');
const modalTitle = document.getElementById('modalTitle');
const modalBody = document.getElementById('modalBody');
const levelPanel = document.getElementById('levelPanel');
const completionPanel = document.getElementById('completionPanel');

let scoreCfg = { maximumPoints:100, rankDecayFactor:3, repeatPenaltyPower:0.5 };
let levels = [];

document.getElementById('back').onclick = ()=> location.href='moderator.html';
document.getElementById('closeModal').onclick = ()=> modal.classList.remove('open');

function setTab(tab){
  levelPanel.classList.toggle('active', tab === 'level');
  completionPanel.classList.toggle('active', tab === 'completion');
  document.querySelectorAll('[data-tab]').forEach(x => x.classList.toggle('active', x.dataset.tab === tab));
}
document.querySelectorAll('[data-tab]').forEach(btn => btn.onclick = ()=> setTab(btn.dataset.tab));

function calc(rank, size, k){
  const n = Math.max(2, Number(size || 2));
  const r = Math.max(1, Math.min(Number(rank || 1), n));
  const x = (r - 1) / (n - 1);
  const v = scoreCfg.maximumPoints * Math.exp(-scoreCfg.rankDecayFactor * x) / Math.pow(Math.max(1, k), scoreCfg.repeatPenaltyPower);
  return Math.round(v * 100) / 100;
}

async function loadScore(){
  const snap = await getDoc(doc(db,'settings','scoring'));
  const s = snap.exists() ? snap.data() : {};
  scoreCfg = {
    maximumPoints: Number(s.maximumPoints ?? s.maxPoints ?? 100),
    rankDecayFactor: Number(s.rankDecayFactor ?? s.decayA ?? 3),
    repeatPenaltyPower: Number(s.repeatPenaltyPower ?? s.grindPower ?? 0.5)
  };
}

async function loadLevels(){
  const snap = await getDocs(collection(db,'levels'));
  levels = [];
  snap.forEach(d => { const l = d.data(); if(l.status !== 'archived') levels.push({ id:d.id, ...l }); });
  levels.sort((a,b) => Number(a.rank ?? 99999) - Number(b.rank ?? 99999));
}

async function renderLevelSubmissions(me){
  levelPanel.innerHTML = 'Загрузка заявок уровней...';
  const snap = await getDocs(query(collection(db,'level_submissions'), where('status','==','pending')));
  if(snap.empty){ levelPanel.innerHTML = '<p>Нет заявок.</p>'; return; }
  levelPanel.innerHTML = '';

  snap.forEach(d => {
    const s = d.data();
    const row = document.createElement('div');
    row.className = 'list-item clickable';
    row.innerHTML = `<b>${s.nick ?? 'Без ника'}</b><p class="small">${s.text ?? 'Без текста'}</p>`;
    row.onclick = ()=> openLevelSubmission(me, d.id, s);
    levelPanel.appendChild(row);
  });
}

function openLevelSubmission(me, id, s){
  modalTitle.textContent = `Заявка уровня: ${s.nick ?? 'Без ника'}`;
  modalBody.innerHTML = `
    <p><b>Текст:</b> ${s.text ?? '—'}</p>
    <p><b>Ссылка:</b> ${s.link ? `<a href="${s.link}" target="_blank">Открыть</a>` : '—'}</p>
    <p class="small">Файл: ${s.fileUrl ?? '—'}</p>
    <input id="note" placeholder="Комментарий модератора">
    <input id="rank" type="number" min="1" placeholder="Место в листе">
    <div class="top-actions">
      <button id="approve">Одобрить</button>
      <button id="reject" class="btn-danger">Отклонить</button>
    </div>
  `;

  document.getElementById('approve').onclick = async ()=>{
    const rank = Number(document.getElementById('rank').value);
    if(!rank){ alert('Укажи место'); return; }
    await addDoc(collection(db,'levels'), {
      link:s.link ?? '', text:s.text ?? '', fileUrl:s.fileUrl ?? '', rank,
      addedBy:me.uid, addedByNick:me.nick ?? 'moderator', createdAt:serverTimestamp(),
      sourceSubmissionId:id, status:'active'
    });
    await updateDoc(doc(db,'level_submissions',id), {
      status:'approved', note:document.getElementById('note').value.trim(), reviewedBy:me.uid, reviewedAt:serverTimestamp(), finalRank:rank
    });
    modal.classList.remove('open');
    await loadLevels();
    await renderLevelSubmissions(me);
  };

  document.getElementById('reject').onclick = async ()=>{
    await updateDoc(doc(db,'level_submissions',id), {
      status:'rejected', note:document.getElementById('note').value.trim() || 'Отклонено модератором', reviewedBy:me.uid, reviewedAt:serverTimestamp()
    });
    modal.classList.remove('open');
    await renderLevelSubmissions(me);
  };

  modal.classList.add('open');
}

async function renderCompletionSubmissions(me){
  completionPanel.innerHTML = 'Загрузка заявок прохождений...';
  const snap = await getDocs(query(collection(db,'completion_submissions'), where('status','==','pending')));
  if(snap.empty){ completionPanel.innerHTML = '<p>Нет заявок.</p>'; return; }

  completionPanel.innerHTML = '';
  const size = Math.max(2, levels.length);

  snap.forEach(d => {
    const s = d.data();
    const row = document.createElement('div');
    row.className = 'list-item clickable';
    row.innerHTML = `<b>${s.nick ?? 'Без ника'}</b><p class="small">${s.text ?? 'Без текста'}</p>`;
    row.onclick = ()=> openCompletionSubmission(me, d.id, s, size);
    completionPanel.appendChild(row);
  });
}

function openCompletionSubmission(me, id, s, size){
  const options = levels.map(l => `<option value="${l.id}">#${l.rank} · ${String(l.text ?? '').slice(0, 70)}</option>`).join('');
  modalTitle.textContent = `Заявка прохождения: ${s.nick ?? 'Без ника'}`;
  modalBody.innerHTML = `
    <p><b>Текст:</b> ${s.text ?? '—'}</p>
    <p><b>Ссылка:</b> ${s.link ? `<a href="${s.link}" target="_blank">Открыть</a>` : '—'}</p>
    <select id="levelId"><option value="">Выбери уровень</option>${options}</select>
    <p class="small" id="preview">Очки: —</p>
    <input id="note" placeholder="Комментарий модератора">
    <div class="top-actions">
      <button id="approve">Подтвердить прохождение</button>
      <button id="reject" class="btn-danger">Отклонить</button>
    </div>
  `;

  const levelSelect = document.getElementById('levelId');
  levelSelect.onchange = async ()=>{
    const level = levels.find(l => l.id === levelSelect.value);
    if(!level){ document.getElementById('preview').textContent = 'Очки: —'; return; }
    const userComps = await getDocs(query(collection(db,'completion_submissions'), where('playerId','==',s.playerId)));
    let approved = 0;
    userComps.forEach(x => { if(x.data().status === 'approved') approved++; });
    document.getElementById('preview').textContent = `Очки: ${calc(level.rank, size, approved + 1)}`;
  };

  document.getElementById('approve').onclick = async ()=>{
    const level = levels.find(l => l.id === levelSelect.value);
    if(!level){ alert('Выбери уровень'); return; }

    const userRef = doc(db,'users',s.playerId);
    const userSnap = await getDoc(userRef);
    const userData = userSnap.exists() ? userSnap.data() : null;
    if(!userData){ alert('Игрок не найден'); return; }

    const userComps = await getDocs(query(collection(db,'completion_submissions'), where('playerId','==',s.playerId)));
    let approved = 0;
    userComps.forEach(x => { if(x.data().status === 'approved') approved++; });
    const k = approved + 1;
    const earned = calc(level.rank, size, k);

    await updateDoc(userRef, { points: Number(userData.points ?? 0) + earned });
    await updateDoc(doc(db,'completion_submissions',id), {
      status:'approved', note:document.getElementById('note').value.trim(), reviewedBy:me.uid, reviewedAt:serverTimestamp(),
      awardedPoints:earned, listRank:Number(level.rank ?? 1), listQuantity:size, scoreK:k, levelId:level.id
    });

    modal.classList.remove('open');
    await renderCompletionSubmissions(me);
  };

  document.getElementById('reject').onclick = async ()=>{
    await updateDoc(doc(db,'completion_submissions',id), {
      status:'rejected', note:document.getElementById('note').value.trim() || 'Отклонено модератором', reviewedBy:me.uid, reviewedAt:serverTimestamp()
    });
    modal.classList.remove('open');
    await renderCompletionSubmissions(me);
  };

  modal.classList.add('open');
}

onAuthStateChanged(auth, async user => {
  if(!user) return location.href='index.html';
  const meSnap = await getDoc(doc(db,'users',user.uid));
  const me = meSnap.exists() ? meSnap.data() : null;
  if(!me || me.situation !== 'verified') return location.href='nick.html';
  if(me.role !== 'moderator' && me.role !== 'elder') return location.href='main.html';

  await loadScore();
  await loadLevels();
  await renderLevelSubmissions({ uid:user.uid, nick:me.nick });
  await renderCompletionSubmissions({ uid:user.uid, nick:me.nick });
  statusEl.textContent = '';
});
</script>
</body>
</html>
