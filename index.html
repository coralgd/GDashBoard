<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Login</title>
<link rel="stylesheet" href="hud.css">
</head>
<body>

<div class="hud" style="max-width:400px;margin:80px auto;">
<h1>Вход</h1>
<input id="email" placeholder="Email"><br><br>
<input id="password" type="password" placeholder="Password"><br><br>
<button id="login">Войти</button>
<button id="register">Регистрация</button>
<p id="error" style="color:red;"></p>
</div>

<script type="module">
import { auth, db } from './firebase.js';
import { signInWithEmailAndPassword, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.14.0/firebase-auth.js";
import { doc, setDoc } from "https://www.gstatic.com/firebasejs/10.14.0/firebase-firestore.js";

const errorEl = document.getElementById('error');
const emailEl = document.getElementById('email');
const passwordEl = document.getElementById('password');
const loginBtn = document.getElementById('login');
const registerBtn = document.getElementById('register');

loginBtn.onclick=()=>{
  errorEl.textContent = '';
  signInWithEmailAndPassword(auth, emailEl.value, passwordEl.value)
    .then(()=>location.href='nick.html')
    .catch((e)=>{
      console.error(e);
      errorEl.textContent = 'Ошибка входа. Проверьте email и пароль.';
    });
};

registerBtn.onclick=()=>{
  errorEl.textContent = '';
  createUserWithEmailAndPassword(auth, emailEl.value, passwordEl.value)
    .then(u=>setDoc(doc(db,'users',u.user.uid),{
      role:'player',
      points:0,
      situation:'not requested'
    }))
    .then(()=>location.href='nick.html')
    .catch((e)=>{
      console.error(e);
      errorEl.textContent = 'Ошибка регистрации. Попробуйте позже.';
    });
};
</script>
</body>
</html>
