<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>SpinList — Login</title>
<link rel="stylesheet" href="hud.css">
</head>
<body>
<div class="brand-hero">
  <img src="spinlist-logo.svg" alt="SpinList logo">
  <div class="brand-title">SPINLIST</div>
</div>

<div class="hud" style="max-width:400px;margin:80px auto;">
<h1>Вход</h1>
<input id="email" placeholder="Email"><br><br>
<input id="password" type="password" placeholder="Password"><br><br>
<button id="login">Войти</button>
<button id="register">Регистрация</button>
<p id="error" style="color:red;"></p>
</div>

<script type="module">
import { auth, db } from './firebase.js';
import { signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/10.14.0/firebase-auth.js";
import { doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.14.0/firebase-firestore.js";
const emailEl=document.getElementById('email');const passEl=document.getElementById('password');const err=document.getElementById('error');
document.getElementById('login').onclick=async()=>{err.textContent='';try{const cred=await signInWithEmailAndPassword(auth,emailEl.value.trim(),passEl.value);const profileSnap=await getDoc(doc(db,'users',cred.user.uid));const profile=profileSnap.exists()?profileSnap.data():null;if(profile?.situation==='frozen'||profile?.accountFrozen){await signOut(auth);err.textContent='Аккаунт заморожен: вход временно недоступен';return;}location.href='nick.html';}catch{err.textContent='Ошибка входа';}};
document.getElementById('register').onclick=async()=>{err.textContent='';if(!emailEl.value.trim()||!passEl.value){err.textContent='сначала введи данные';return;}try{const u=await createUserWithEmailAndPassword(auth,emailEl.value.trim(),passEl.value);await setDoc(doc(db,'users',u.user.uid),{role:'player',points:0,situation:'not requested',accountFrozen:false});location.href='nick.html';}catch{err.textContent='Ошибка регистрации';}};
</script></body></html>
