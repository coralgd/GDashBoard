<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Апелляция</title>
<link rel="stylesheet" href="hud.css">
</head>
<body>
<div class="hud" style="max-width:700px;margin:50px auto;">
  <h1>Отправить апелляцию старшим модераторам</h1>
  <div class="card">
    <input id="link" placeholder="Ссылка (опционально)" style="width:100%"><br><br>
    <textarea id="text" placeholder="Текст апелляции" style="width:100%;min-height:120px"></textarea><br><br>
    <input id="fileUrl" placeholder="Ссылка на файл (опционально)" style="width:100%"><br><br>
    <div class="top-actions">
      <button id="send">Отправить</button>
      <button id="back">Назад</button>
    </div>
  </div>
  <p id="msg" style="color:#00ffff"></p>
</div>

<script type="module">
import { auth, db, getNetworkErrorMessage } from './firebase.js';
import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.14.0/firebase-auth.js";
import { doc, getDoc, addDoc, collection, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.14.0/firebase-firestore.js";

let user = null;
let profile = null;
const sendBtn = document.getElementById('send');
const backBtn = document.getElementById('back');

onAuthStateChanged(auth, async u=>{
  if(!u) return location.href='index.html';
  try {
    user = u;
    const snap = await getDoc(doc(db,'users',u.uid));
    profile = snap.exists() ? snap.data() : null;
    if(!profile || profile.situation!=='verified') return location.href='nick.html';
  } catch (e) {
    console.error(e);
    document.getElementById('msg').textContent = getNetworkErrorMessage(e);
  }
});

sendBtn.onclick = async ()=>{
  const link = document.getElementById('link').value.trim();
  const text = document.getElementById('text').value.trim();
  const fileUrl = document.getElementById('fileUrl').value.trim();
  const msg = document.getElementById('msg');
  if(!text){ msg.textContent='Нужен текст апелляции'; return; }

  await addDoc(collection(db,'appeals'), {
    playerId:user.uid, nick:profile.nick ?? 'Без ника', link, text, fileUrl,
    status:'pending', note:'', createdAt:serverTimestamp()
  });
  msg.textContent='Апелляция отправлена.';
};

backBtn.onclick = ()=> location.href='main.html';
</script>
</body>
</html>
