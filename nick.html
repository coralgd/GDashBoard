<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>SpinList — Выбор ника</title>
<link rel="stylesheet" href="hud.css">
</head>
<body>
<div class="brand-hero">
  <img src="spinlist-logo.svg" alt="SpinList logo">
  <div class="brand-title">SPINLIST</div>
</div>

<div class="hud" style="max-width:500px;margin:80px auto;text-align:center;">
  <h1>Выбери ник</h1>
  <input id="nickInput" type="text" placeholder="Введи ник">
  <button id="submitBtn">Отправить</button>
  <p id="error" style="color:red"></p>
</div>

<script type="module">
import { auth, db } from './firebase.js';
import { onAuthStateChanged, signOut } from
  "https://www.gstatic.com/firebasejs/10.14.0/firebase-auth.js";
import {
  doc, getDoc, setDoc,
  collection, query, where, getDocs
} from
  "https://www.gstatic.com/firebasejs/10.14.0/firebase-firestore.js";

const input = document.getElementById('nickInput');
const btn = document.getElementById('submitBtn');
const error = document.getElementById('error');

onAuthStateChanged(auth, async (user) => {
  if (!user) {
    location.href = 'index.html';
    return;
  }

  try {
    const userRef = doc(db, 'users', user.uid);
    const snap = await getDoc(userRef);

    if (snap.exists()) {
      const data = snap.data();
      if (data.accountFrozen || data.situation === 'freezed') {
        await signOut(auth);
        error.textContent = 'Аккаунт заморожен. Вход запрещен.';
        return;
      }
      if (data.situation === 'verified' && data.nick) {
        location.href = 'main.html';
        return;
      }
    }
  } catch (e) {
    console.error(e);
    error.textContent = 'Не удалось проверить профиль. Попробуйте позже.';
  }
});

btn.onclick = async () => {
  const nickValue = input.value.trim();

  if (nickValue.length < 3) {
    error.textContent = 'Ник слишком короткий';
    return;
  }

  // Проверка уникальности
  const q = query(collection(db,'users'), where('nick','==',nickValue));
  const snap = await getDocs(q);
  if (!snap.empty) {
    error.textContent = 'Ник уже занят';
    return;
  }

  try {
    await setDoc(doc(db,'users',auth.currentUser.uid), {
      nick: nickValue,
      email: auth.currentUser.email,
      situation: 'not requested'
    }, { merge: true });

    error.style.color = 'cyan';
    error.textContent = 'Ник отправлен. Ожидайте проверки.';
  } catch (e) {
    console.error(e);
    error.textContent = 'Ошибка отправки ника';
  }
};
</script>

</body>
</html>
