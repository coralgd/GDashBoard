<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Отправка прохождения</title>
<link rel="stylesheet" href="hud.css">
</head>
<body>
<div class="hud" style="max-width:760px;margin:50px auto;">
  <h1>Отправить прохождение</h1>
  <div class="card">
    <label>Уровень из листа (обязательно)</label>
    <div class="top-actions">
      <button id="pickLevel" class="btn-ghost">Выбрать уровень из листа</button>
      <span id="pickedLevel" class="small">Не выбран</span>
    </div>

    <input id="link" placeholder="Ссылка на доказательство"><br><br>
    <textarea id="text" placeholder="Комментарий" style="min-height:120px"></textarea><br><br>
    <input id="fileUrl" placeholder="Ссылка на файл (опционально)"><br><br>

    <label class="small">Сослаться на прошлую отправку (опц.)</label>
    <select id="ref"><option value="">Без ссылки</option></select><br><br>

    <div class="top-actions"><button id="send">Отправить</button><button id="back">Назад</button></div>
  </div>
  <p id="msg" style="color:#00ffff"></p>
</div>

<div id="modal" class="dialog-backdrop"><div class="dialog"><div class="page-header"><h2>Выберите уровень</h2><button id="closeModal" class="btn-ghost">Закрыть</button></div><input id="levelSearch" placeholder="Поиск уровня"><div id="levelList"></div></div></div>

<script type="module">
import { auth, db, getNetworkErrorMessage } from './firebase.js';
import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.14.0/firebase-auth.js";
import { doc, getDoc, addDoc, collection, serverTimestamp, getDocs, query, where, orderBy } from "https://www.gstatic.com/firebasejs/10.14.0/firebase-firestore.js";

let user=null, profile=null, levels=[], selectedLevel=null;

async function loadRefs(uid){
  const sel = document.getElementById('ref');
  const snap = await getDocs(query(collection(db,'completion_submissions'), where('playerId','==',uid)));
  const items=[]; snap.forEach(d=>items.push({id:d.id,...d.data()}));
  items.sort((a,b)=>(b.createdAt?.seconds||0)-(a.createdAt?.seconds||0));
  items.slice(0,50).forEach(x=>{const o=document.createElement('option');o.value=x.id;o.textContent=`[${x.status ?? 'pending'}] ${String(x.text ?? '').slice(0,80)||'Без текста'}`;sel.appendChild(o);});
}

function renderLevels(){
  const q = document.getElementById('levelSearch').value.trim().toLowerCase();
  const box = document.getElementById('levelList');
  box.innerHTML = '';
  const filtered = levels.filter(l=>`${l.rank ?? ''} ${l.text ?? ''} ${l.link ?? ''}`.toLowerCase().includes(q));
  if(!filtered.length){ box.innerHTML='<p>Уровни не найдены.</p>'; return; }
  filtered.forEach(l=>{
    const row = document.createElement('div');
    row.className='row list-item clickable';
    row.innerHTML=`<div>${l.rank ?? '—'}</div><div>${l.text ?? 'Без названия'}</div><div>Выбрать</div>`;
    row.onclick=()=>{ selectedLevel=l; document.getElementById('pickedLevel').textContent=`#${l.rank ?? '—'} · ${l.text ?? 'Без названия'}`; document.getElementById('modal').classList.remove('open'); };
    box.appendChild(row);
  });
}

async function loadRefs(uid){
  const sel = document.getElementById('ref');
  const snap = await getDocs(query(collection(db,'completion_submissions'), where('playerId','==',uid)));
  const items = [];
  snap.forEach(d=>items.push({id:d.id,...d.data()}));
  items.sort((a,b)=>(b.createdAt?.seconds||0)-(a.createdAt?.seconds||0));
  items.slice(0,50).forEach(x=>{
    const o = document.createElement('option');
    o.value = x.id;
    o.textContent = `[${x.status ?? 'pending'}] ${String(x.text ?? '').slice(0,80) || 'Без текста'}`;
    sel.appendChild(o);
  });
}

onAuthStateChanged(auth, async u=>{
  if(!u) return location.href='index.html';
  try {
    user=u;
    const snap=await getDoc(doc(db,'users',u.uid));
    profile=snap.exists()?snap.data():null;
    if(!profile||profile.situation!=='verified') return location.href='nick.html';
    await loadRefs(u.uid);
    const ls=await getDocs(query(collection(db,'levels'), orderBy('rank','asc')));
    levels=[]; ls.forEach(d=>{const l=d.data(); if(l.status!=='archived') levels.push({id:d.id,...l});});
  } catch(e){ document.getElementById('msg').textContent=getNetworkErrorMessage(e); }
});

document.getElementById('pickLevel').onclick=()=>{ document.getElementById('modal').classList.add('open'); renderLevels(); };
document.getElementById('closeModal').onclick=()=>document.getElementById('modal').classList.remove('open');
document.getElementById('levelSearch').oninput=renderLevels;

document.getElementById('send').onclick=async()=>{
  const link=document.getElementById('link').value.trim();
  const text=document.getElementById('text').value.trim();
  const fileUrl=document.getElementById('fileUrl').value.trim();
  const referenceSubmissionId=document.getElementById('ref').value||'';
  const msg=document.getElementById('msg');
  if(!selectedLevel){ msg.textContent='Сначала выбери уровень из листа.'; return; }
  if(!link||!text){ msg.textContent='Нужны ссылка и текст'; return; }

  try{
    await addDoc(collection(db,'completion_submissions'),{
      playerId:user.uid,nick:profile.nick ?? 'Без ника',link,text,fileUrl,referenceSubmissionId,
      levelId:selectedLevel.id,listRank:Number(selectedLevel.rank ?? 0) || null,levelText:selectedLevel.text ?? '',
      status:'pending',note:'',awardedPoints:0,createdAt:serverTimestamp()
    });
    msg.textContent='Прохождение отправлено модераторам.';
  }catch(e){ msg.textContent=getNetworkErrorMessage(e); }
};

document.getElementById('back').onclick=()=>location.href='main.html';
</script>
</body>
</html>
