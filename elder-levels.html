<!doctype html>
<html lang="ru">
<head><meta charset="UTF-8"><title>Меню листа старшего модератора</title><link rel="stylesheet" href="hud.css"></head>
<body>
<div class="hud">
  <div class="page-header"><h1>Меню листа старшего модератора</h1><button id="back" class="btn-ghost">Назад</button></div>
  <p id="status" style="color:#00e5ff">Загрузка...</p>

  <div class="top-actions">
    <button id="openSettings">Параметры формулы</button>
    <button id="openSubs">Все отправки</button>
    <button id="recalc" class="btn-success">Пересчитать очки</button>
  </div>

  <div id="levels"></div>
</div>

<div id="levelModal" class="dialog-backdrop"><div class="dialog"><div class="page-header"><h2 id="lTitle">Уровень</h2><button id="lClose" class="btn-ghost">Закрыть</button></div><div id="lBody"></div></div></div>
<div id="setModal" class="dialog-backdrop"><div class="dialog"><div class="page-header"><h2>Параметры формулы</h2><button id="sClose" class="btn-ghost">Закрыть</button></div><label class='small'>maximumPoints</label><input id='maxPoints' type='number'><label class='small'>rankDecayFactor</label><input id='decayA' type='number' step='0.1'><label class='small'>repeatPenaltyPower</label><input id='grindPower' type='number' step='0.01'><button id='saveSet'>Сохранить</button><p id='setMsg' class='small'></p></div></div>
<div id="subModal" class="dialog-backdrop"><div class="dialog"><div class="page-header"><h2>Все отправки</h2><button id="subClose" class="btn-ghost">Закрыть</button></div><div class="toolbar"><input id="q" placeholder="Поиск"><select id="t"><option value="all">Все</option><option value="level">Уровни</option><option value="completion">Прохождения</option><option value="appeal">Апелляции</option></select><select id="st"><option value="all">Любой статус</option><option value="pending">Ожидают</option><option value="approved">Одобрены</option><option value="rejected">Отклонены</option></select></div><div id="subList"></div><div id="subDetail"></div></div></div>

<script type="module">
import { auth, db, getNetworkErrorMessage } from './firebase.js';
import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.14.0/firebase-auth.js";
import { addDoc, collection, deleteDoc, doc, getDoc, getDocs, orderBy, query, serverTimestamp, setDoc, updateDoc, where } from "https://www.gstatic.com/firebasejs/10.14.0/firebase-firestore.js";

let me=null, levels=[], subs=[], score={maximumPoints:100,rankDecayFactor:3,repeatPenaltyPower:.5};
const statusEl=document.getElementById('status');
const levelsEl=document.getElementById('levels');

document.getElementById('back').onclick=()=>location.href='elder.html';
document.getElementById('lClose').onclick=()=>document.getElementById('levelModal').classList.remove('open');
document.getElementById('sClose').onclick=()=>document.getElementById('setModal').classList.remove('open');
document.getElementById('subClose').onclick=()=>document.getElementById('subModal').classList.remove('open');
document.getElementById('openSettings').onclick=()=>document.getElementById('setModal').classList.add('open');
document.getElementById('openSubs').onclick=()=>document.getElementById('subModal').classList.add('open');
document.getElementById('q').oninput=()=>renderSubs();
document.getElementById('t').onchange=()=>renderSubs();
document.getElementById('st').onchange=()=>renderSubs();

document.getElementById('saveSet').onclick=async()=>{
  const maximumPoints=Number(document.getElementById('maxPoints').value);
  const rankDecayFactor=Number(document.getElementById('decayA').value);
  const repeatPenaltyPower=Number(document.getElementById('grindPower').value);
  await setDoc(doc(db,'settings','scoring'),{maximumPoints,rankDecayFactor,repeatPenaltyPower,maxPoints:maximumPoints,decayA:rankDecayFactor,grindPower:repeatPenaltyPower,updatedBy:me.uid,updatedAt:serverTimestamp()},{merge:true});
  score={maximumPoints,rankDecayFactor,repeatPenaltyPower};
  document.getElementById('setMsg').textContent='Сохранено';
  await recalc();
  await loadLevels();
};

function calc(rank,size,k){const n=Math.max(2,Number(size||2));const r=Math.max(1,Math.min(Number(rank||1),n));const x=(r-1)/(n-1);return Math.round((score.maximumPoints*Math.exp(-score.rankDecayFactor*x)/Math.pow(Math.max(1,k),score.repeatPenaltyPower))*100)/100;}

async function loadScore(){const s=await getDoc(doc(db,'settings','scoring'));const v=s.exists()?s.data():{};score={maximumPoints:Number(v.maximumPoints??v.maxPoints??100),rankDecayFactor:Number(v.rankDecayFactor??v.decayA??3),repeatPenaltyPower:Number(v.repeatPenaltyPower??v.grindPower??.5)};document.getElementById('maxPoints').value=score.maximumPoints;document.getElementById('decayA').value=score.rankDecayFactor;document.getElementById('grindPower').value=score.repeatPenaltyPower;}

async function loadLevels(){
  const snap=await getDocs(query(collection(db,'levels'),orderBy('rank','asc')));
  levels=[]; snap.forEach(d=>{const l=d.data();if(l.status!=='archived')levels.push({id:d.id,...l});});
  levelsEl.innerHTML='';
  if(!levels.length){levelsEl.innerHTML='<p>Лист пуст.</p>';return;}
  const size=Math.max(2,levels.length);
  levels.forEach(l=>{const row=document.createElement('div');row.className='row list-item clickable';row.innerHTML=`<div>#${l.rank??'—'}</div><div>${l.text??'Без названия'}</div><div>${calc(l.rank,size,1)}</div>`;row.onclick=()=>openLevel(l);levelsEl.appendChild(row);});
}

async function placeLevelAtRank(levelId,target){
  const snap=await getDocs(query(collection(db,'levels'),orderBy('rank','asc')));
  const arr=[];snap.forEach(d=>{const l=d.data();if(l.status!=='archived')arr.push({id:d.id,...l});});
  const moving=arr.find(x=>x.id===levelId); if(!moving)return;
  const without=arr.filter(x=>x.id!==levelId); let idx=Number(target)-1; if(idx<0)idx=0; if(idx>without.length)idx=without.length; without.splice(idx,0,moving);
  for(let i=0;i<without.length;i++){const r=i+1;if(Number(without[i].rank??0)!==r) await updateDoc(doc(db,'levels',without[i].id),{rank:r});}
}

async function recalc(){
  const [lvSnap,cSnap]=await Promise.all([
    getDocs(query(collection(db,'levels'),orderBy('rank','asc'))),
    getDocs(query(collection(db,'completion_submissions'),where('status','==','approved')))
  ]);
  const rankById=new Map(); let size=0;
  lvSnap.forEach(d=>{const l=d.data();if(l.status!=='archived'){rankById.set(d.id,Number(l.rank??1));size++;}}); size=Math.max(size,2);
  const byUser=new Map(); cSnap.forEach(d=>{const c={id:d.id,...d.data()};if(!byUser.has(c.playerId))byUser.set(c.playerId,[]);byUser.get(c.playerId).push(c);});
  for(const [uid,items] of byUser){items.sort((a,b)=>(a.reviewedAt?.seconds??0)-(b.reviewedAt?.seconds??0));let sum=0;for(let i=0;i<items.length;i++){const it=items[i];const rank=rankById.get(it.levelId)??Number(it.listRank??1);const earned=calc(rank,size,i+1);sum+=earned;await updateDoc(doc(db,'completion_submissions',it.id),{awardedPoints:earned,listRank:rank,listQuantity:size,scoreK:i+1});}await updateDoc(doc(db,'users',uid),{points:Math.round(sum*100)/100});}
}
document.getElementById('recalc').onclick=async()=>{const b=document.getElementById('recalc');b.disabled=true;b.textContent='Пересчет...';await recalc();await loadLevels();b.disabled=false;b.textContent='Пересчитать очки';};

function openLevel(l){
  document.getElementById('lTitle').textContent=`Уровень #${l.rank??'—'}`;
  document.getElementById('lBody').innerHTML=`<label class='small'>Текст</label><textarea id='txt'>${l.text??''}</textarea><label class='small'>Ссылка</label><input id='lnk' value='${l.link??''}'><label class='small'>Файл</label><input id='file' value='${l.fileUrl??''}'><label class='small'>Место</label><input id='rank' type='number' min='1' value='${Number(l.rank??1)}'><div class='top-actions'><button id='save'>Сохранить</button><button id='del' class='btn-danger'>Удалить</button></div>`;
  document.getElementById('save').onclick=async()=>{const rank=Number(document.getElementById('rank').value);await updateDoc(doc(db,'levels',l.id),{text:document.getElementById('txt').value.trim(),link:document.getElementById('lnk').value.trim(),fileUrl:document.getElementById('file').value.trim(),rank,updatedBy:me.uid,updatedAt:serverTimestamp()});await placeLevelAtRank(l.id,rank);await recalc();document.getElementById('levelModal').classList.remove('open');await loadLevels();};
  document.getElementById('del').onclick=async()=>{if(!confirm('Удалить уровень?'))return;await deleteDoc(doc(db,'levels',l.id));await recalc();document.getElementById('levelModal').classList.remove('open');await loadLevels();};
  document.getElementById('levelModal').classList.add('open');
}

async function loadSubs(){
  const [a,b,c]=await Promise.all([getDocs(collection(db,'level_submissions')),getDocs(collection(db,'completion_submissions')),getDocs(collection(db,'appeals'))]);
  subs=[];a.forEach(d=>subs.push({id:d.id,type:'level',data:d.data()}));b.forEach(d=>subs.push({id:d.id,type:'completion',data:d.data()}));c.forEach(d=>subs.push({id:d.id,type:'appeal',data:d.data()}));
  renderSubs();
}
function renderSubs(){
  const q=document.getElementById('q').value.trim().toLowerCase(),t=document.getElementById('t').value,st=document.getElementById('st').value,box=document.getElementById('subList');
  box.innerHTML='';
  const filtered=subs.filter(x=>{if(t!=='all'&&x.type!==t)return false;if(st!=='all'&&x.data.status!==st)return false;const hay=`${x.data.nick??''} ${x.data.text??''} ${x.data.status??''}`.toLowerCase();return !q||hay.includes(q);});
  if(!filtered.length){box.innerHTML='<p>Ничего не найдено.</p>';return;}
  filtered.forEach(item=>{const row=document.createElement('div');row.className='list-item clickable';row.innerHTML=`<b>[${item.type}]</b> ${item.data.nick??'Без ника'} · ${item.data.status??'—'}<p class='small'>${item.data.text??''}</p>`;row.onclick=()=>openSub(item);box.appendChild(row);});
}

function openSub(item){
  const d=item.data; const detail=document.getElementById('subDetail');
  detail.innerHTML=`<div class='list-item'><h3>Заявка [${item.type}]</h3><p><b>Ник:</b> ${d.nick??'—'}</p><p><b>Статус:</b> ${d.status??'—'}</p><p>${d.text??''}</p><input id='note' placeholder='Комментарий'><div id='act' class='top-actions'></div></div>`;
  const act=document.getElementById('act');
  if(item.type==='level'&&d.status==='pending'){
    act.innerHTML=`<input id='rank' type='number' min='1' placeholder='Место'><button id='ok'>Одобрить</button><button id='no' class='btn-danger'>Отклонить</button>`;
    document.getElementById('ok').onclick=async()=>{const rank=Number(document.getElementById('rank').value);if(!rank)return alert('Укажи место');const ref=await addDoc(collection(db,'levels'),{link:d.link??'',text:d.text??'',fileUrl:d.fileUrl??'',rank,status:'active',addedBy:me.uid,addedByNick:me.nick,createdAt:serverTimestamp(),sourceSubmissionId:item.id});await placeLevelAtRank(ref.id,rank);await updateDoc(doc(db,'level_submissions',item.id),{status:'approved',note:document.getElementById('note').value.trim(),reviewedBy:me.uid,reviewedAt:serverTimestamp(),finalRank:rank});await recalc();await loadLevels();await loadSubs();detail.innerHTML='';};
    document.getElementById('no').onclick=async()=>{await updateDoc(doc(db,'level_submissions',item.id),{status:'rejected',note:document.getElementById('note').value.trim()||'Отклонено',reviewedBy:me.uid,reviewedAt:serverTimestamp()});await loadSubs();detail.innerHTML='';};
  } else if(item.type==='completion'&&d.status==='pending'){
    const options=levels.map(l=>`<option value='${l.id}'>#${l.rank} · ${String(l.text??'').slice(0,70)}</option>`).join('');
    act.innerHTML=`<select id='lvl'><option value=''>Выбери уровень</option>${options}</select><button id='ok'>Одобрить</button><button id='no' class='btn-danger'>Отклонить</button>`;
    document.getElementById('ok').onclick=async()=>{const lvl=document.getElementById('lvl').value;const l=levels.find(x=>x.id===lvl);if(!l)return alert('Выбери уровень');const userRef=doc(db,'users',d.playerId);const us=await getDoc(userRef);const u=us.exists()?us.data():null;if(!u)return alert('Игрок не найден');const cs=await getDocs(query(collection(db,'completion_submissions'),where('playerId','==',d.playerId)));let c=0;cs.forEach(x=>{if(x.data().status==='approved')c++;});const k=c+1,size=Math.max(2,levels.length),earned=calc(l.rank,size,k);await updateDoc(userRef,{points:Number(u.points??0)+earned});await updateDoc(doc(db,'completion_submissions',item.id),{status:'approved',note:document.getElementById('note').value.trim(),reviewedBy:me.uid,reviewedAt:serverTimestamp(),awardedPoints:earned,listRank:Number(l.rank??1),listQuantity:size,scoreK:k,levelId:l.id});await recalc();await loadSubs();detail.innerHTML='';};
    document.getElementById('no').onclick=async()=>{await updateDoc(doc(db,'completion_submissions',item.id),{status:'rejected',note:document.getElementById('note').value.trim()||'Отклонено',reviewedBy:me.uid,reviewedAt:serverTimestamp()});await loadSubs();detail.innerHTML='';};
  } else if(item.type==='appeal'&&d.status==='pending'){
    act.innerHTML=`<button id='ok'>Удовлетворить</button><button id='no' class='btn-danger'>Отклонить</button>`;
    document.getElementById('ok').onclick=async()=>{await updateDoc(doc(db,'appeals',item.id),{status:'approved',note:document.getElementById('note').value.trim()||'Апелляция удовлетворена',reviewedBy:me.uid,reviewedAt:serverTimestamp()});await loadSubs();detail.innerHTML='';};
    document.getElementById('no').onclick=async()=>{await updateDoc(doc(db,'appeals',item.id),{status:'rejected',note:document.getElementById('note').value.trim()||'Апелляция отклонена',reviewedBy:me.uid,reviewedAt:serverTimestamp()});await loadSubs();detail.innerHTML='';};
  } else {
    act.innerHTML=`<p class='small'>Заявка уже обработана.</p>`;
  }
}

onAuthStateChanged(auth, async user=>{
  if(!user) return location.href='index.html';
  try {
    const meSnap=await getDoc(doc(db,'users',user.uid));
    const data=meSnap.exists()?meSnap.data():null;
    if(!data||data.situation!=='verified') return location.href='nick.html';
    if(data.role!=='elder') return location.href='main.html';
    me={uid:user.uid,nick:data.nick??'elder'};
    await loadScore(); await loadLevels(); await loadSubs();
    statusEl.textContent='';
  } catch(e){console.error(e);statusEl.textContent=getNetworkErrorMessage(e);}
});
</script>
</body>
</html>
