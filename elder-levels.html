<!DOCTYPE html><html lang="ru"><head><meta charset="UTF-8"><title>Меню листа старшего модератора</title><link rel="stylesheet" href="hud.css"></head><body><div class="hud"><div class="page-header"><h1>Меню листа старшего модератора</h1><button id="back" class="btn-ghost">Назад</button></div><p id="status" style="color:#00ffff">Загрузка...</p><div class="top-actions"><button id="openSettings">Параметры формулы</button><button id="openSubs">Все отправки</button></div><div id="levels"></div></div>
<div id="settingsModal" class="dialog-backdrop"><div class="dialog"><div class="page-header"><h2>Параметры</h2><button id="closeSettings" class="btn-ghost">Закрыть</button></div><label class='small'>a (alpha)</label><input id='alphaA' type='number' step='0.1'><p class='small'>Формула: score = 190 * (1 - e^(-Σe^(-a*x_i))). По умолчанию a=4.</p><button id='save'>Сохранить</button><p id='setMsg' class='small'></p></div></div>
<div id="levelModal" class="dialog-backdrop"><div class="dialog"><div class="page-header"><h2 id="lTitle">Уровень</h2><button id="closeLevel" class="btn-ghost">Закрыть</button></div><div id="lBody"></div></div></div>
<div id="subsModal" class="dialog-backdrop"><div class="dialog"><div class="page-header"><h2>Отправки</h2><button id="closeSubs" class="btn-ghost">Закрыть</button></div><div class="toolbar"><input id="q" placeholder="Поиск"><select id="t"><option value="all">Все</option><option value="level">Уровни</option><option value="completion">Прохождения</option><option value="appeal">Апелляции</option></select><select id="s"><option value="all">Все статусы</option><option value="pending">Ожидают</option><option value="approved">Одобрены</option><option value="rejected">Отклонены</option></select></div><div id="subs"></div><div id="detail"></div></div></div>
<script type="module">
import { auth, db, getNetworkErrorMessage } from './firebase.js';
import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.14.0/firebase-auth.js";
import { addDoc, collection, deleteDoc, doc, getDoc, getDocs, orderBy, query, serverTimestamp, setDoc, updateDoc, where } from "https://www.gstatic.com/firebasejs/10.14.0/firebase-firestore.js";
let me=null,levels=[],subs=[],sc={alphaA:4};const status=document.getElementById('status');
function term(rank,size){const n=Math.max(2,Number(size||2));const r=Math.max(1,Math.min(Number(rank||1),n));const x=(r-1)/(n-1);return Math.exp(-Number(sc.alphaA??4)*x);}
function totalByRanks(ranks,size){const sum=ranks.reduce((a,rank)=>a+term(rank,size),0);return Math.round((190*(1-Math.exp(-sum)))*100)/100;}
function calc(rank,size,existing=[]){const before=totalByRanks(existing,size);const after=totalByRanks([...existing,Number(rank||1)],size);return Math.round((after-before)*100)/100;}
document.getElementById('back').onclick=()=>location.href='elder.html';document.getElementById('openSettings').onclick=()=>document.getElementById('settingsModal').classList.add('open');document.getElementById('closeSettings').onclick=()=>document.getElementById('settingsModal').classList.remove('open');document.getElementById('openSubs').onclick=()=>document.getElementById('subsModal').classList.add('open');document.getElementById('closeSubs').onclick=()=>document.getElementById('subsModal').classList.remove('open');document.getElementById('closeLevel').onclick=()=>document.getElementById('levelModal').classList.remove('open');document.getElementById('q').oninput=()=>renderSubs();document.getElementById('t').onchange=()=>renderSubs();document.getElementById('s').onchange=()=>renderSubs();
async function loadCfg(){const s=await getDoc(doc(db,'settings','scoring'));const v=s.exists()?s.data():{};sc={alphaA:Number(v.alphaA??4)};document.getElementById('alphaA').value=sc.alphaA;}
async function place(id,target){const snap=await getDocs(query(collection(db,'levels'),orderBy('rank','asc')));const arr=[];snap.forEach(d=>{const l=d.data();if(l.status!=='archived')arr.push({id:d.id,...l});});const moving=arr.find(x=>x.id===id);if(!moving)return;const without=arr.filter(x=>x.id!==id);let i=Number(target)-1;if(i<0)i=0;if(i>without.length)i=without.length;without.splice(i,0,moving);for(let k=0;k<without.length;k++){const rank=k+1;if(Number(without[k].rank??0)!==rank) await updateDoc(doc(db,'levels',without[k].id),{rank});}}
async function recalc(){const [lSnap,cSnap]=await Promise.all([getDocs(query(collection(db,'levels'),orderBy('rank','asc'))),getDocs(query(collection(db,'completion_submissions'),where('status','==','approved')))]);const rankById=new Map();let size=0;lSnap.forEach(d=>{const l=d.data();if(l.status!=='archived'){rankById.set(d.id,Number(l.rank??1));size++;}});size=Math.max(size,2);const byUser=new Map();cSnap.forEach(d=>{const c={id:d.id,...d.data()};if(!byUser.has(c.playerId))byUser.set(c.playerId,[]);byUser.get(c.playerId).push(c);});for(const [uid,arr] of byUser){arr.sort((a,b)=>(a.reviewedAt?.seconds??0)-(b.reviewedAt?.seconds??0));const ranks=[];for(let i=0;i<arr.length;i++){const rank=rankById.get(arr[i].levelId)??Number(arr[i].listRank??1);const earned=calc(rank,size,ranks);ranks.push(rank);await updateDoc(doc(db,'completion_submissions',arr[i].id),{awardedPoints:earned,listRank:rank,listQuantity:size,scoreK:i+1});}await updateDoc(doc(db,'users',uid),{points:totalByRanks(ranks,size)});}}
document.getElementById('save').onclick=async()=>{const alphaA=Number(document.getElementById('alphaA').value||4);const msg=document.getElementById('setMsg');try{try{await setDoc(doc(db,'settings','scoring'),{alphaA,updatedBy:me.uid,updatedAt:serverTimestamp()},{merge:true});}catch{await updateDoc(doc(db,'settings','scoring'),{alphaA,updatedBy:me.uid,updatedAt:serverTimestamp()});}await loadCfg();await recalc();await loadLevels();msg.textContent='Сохранено';}catch(e){msg.textContent=getNetworkErrorMessage(e);}};
async function loadLevels(){const box=document.getElementById('levels');box.innerHTML='Загрузка...';const snap=await getDocs(query(collection(db,'levels'),orderBy('rank','asc')));levels=[];snap.forEach(d=>{const l=d.data();if(l.status!=='archived')levels.push({id:d.id,...l});});box.innerHTML='';if(!levels.length){box.innerHTML='<p>Лист пуст.</p>';return;}const size=Math.max(2,levels.length);levels.forEach(l=>{const row=document.createElement('div');row.className='row list-item clickable';row.innerHTML=`<div>#${l.rank??'—'}</div><div>${l.text??'Без названия'}</div><div>${calc(l.rank,size,[])}</div>`;row.onclick=()=>openLevel(l);box.appendChild(row);});}
function openLevel(l){document.getElementById('lTitle').textContent=`Уровень #${l.rank??'—'}`;document.getElementById('lBody').innerHTML=`<textarea id='txt'>${l.text??''}</textarea><input id='lnk' value='${l.link??''}'><input id='file' value='${l.fileUrl??''}'><input id='rank' type='number' min='1' value='${Number(l.rank??1)}'><div class='top-actions'><button id='saveL'>Сохранить</button><button id='delL' class='btn-danger'>Удалить</button></div>`;document.getElementById('saveL').onclick=async()=>{const r=Number(document.getElementById('rank').value);await updateDoc(doc(db,'levels',l.id),{text:document.getElementById('txt').value.trim(),link:document.getElementById('lnk').value.trim(),fileUrl:document.getElementById('file').value.trim(),rank:r,updatedBy:me.uid,updatedAt:serverTimestamp()});await place(l.id,r);await recalc();document.getElementById('levelModal').classList.remove('open');await loadLevels();};document.getElementById('delL').onclick=async()=>{if(!confirm('Удалить уровень?'))return;await deleteDoc(doc(db,'levels',l.id));await recalc();document.getElementById('levelModal').classList.remove('open');await loadLevels();};document.getElementById('levelModal').classList.add('open');}
async function loadSubs(){const [a,b,c]=await Promise.all([getDocs(collection(db,'level_submissions')),getDocs(collection(db,'completion_submissions')),getDocs(collection(db,'appeals'))]);subs=[];a.forEach(d=>subs.push({id:d.id,type:'level',data:d.data()}));b.forEach(d=>subs.push({id:d.id,type:'completion',data:d.data()}));c.forEach(d=>subs.push({id:d.id,type:'appeal',data:d.data()}));renderSubs();}
function renderSubs(){const box=document.getElementById('subs');const q=document.getElementById('q').value.trim().toLowerCase(),t=document.getElementById('t').value,s=document.getElementById('s').value;box.innerHTML='';const filtered=subs.filter(x=>{if(t!=='all'&&x.type!==t)return false;if(s!=='all'&&x.data.status!==s)return false;const hay=`${x.data.nick??''} ${x.data.text??''} ${x.data.status??''}`.toLowerCase();return !q||hay.includes(q);});if(!filtered.length){box.innerHTML='<p>Ничего не найдено.</p>';return;}filtered.forEach(item=>{const row=document.createElement('div');row.className='list-item clickable';row.innerHTML=`<b>[${item.type}]</b> ${item.data.nick??'Без ника'} · ${item.data.status??'—'}<p class='small'>${item.data.text??''}</p>`;row.onclick=()=>openSub(item);box.appendChild(row);});}
function openSub(item){const d=item.data;const detail=document.getElementById('detail');detail.innerHTML=`<div class='list-item'><h3>Заявка [${item.type}]</h3><p>${d.text??''}</p><input id='note' placeholder='Комментарий'><div id='act' class='top-actions'></div></div>`;const act=document.getElementById('act');if(item.type==='level'&&d.status==='pending'){act.innerHTML=`<input id='rank' type='number' min='1' placeholder='Место'><button id='ok'>Одобрить</button><button id='no' class='btn-danger'>Отклонить</button>`;document.getElementById('ok').onclick=async()=>{const r=Number(document.getElementById('rank').value);if(!r)return alert('Укажи место');const ref=await addDoc(collection(db,'levels'),{link:d.link??'',text:d.text??'',fileUrl:d.fileUrl??'',rank:r,status:'active',addedBy:me.uid,addedByNick:me.nick,createdAt:serverTimestamp(),sourceSubmissionId:item.id});await place(ref.id,r);await updateDoc(doc(db,'level_submissions',item.id),{status:'approved',note:document.getElementById('note').value.trim(),reviewedBy:me.uid,reviewedAt:serverTimestamp(),finalRank:r});await recalc();await loadLevels();await loadSubs();detail.innerHTML='';};document.getElementById('no').onclick=async()=>{await updateDoc(doc(db,'level_submissions',item.id),{status:'rejected',note:document.getElementById('note').value.trim()||'Отклонено',reviewedBy:me.uid,reviewedAt:serverTimestamp()});await loadSubs();detail.innerHTML='';};} else if(item.type==='completion'&&d.status==='pending'){const opts=levels.map(l=>`<option value='${l.id}'>#${l.rank} · ${String(l.text??'').slice(0,60)}</option>`).join('');act.innerHTML=`<select id='lvl'><option value=''>Выбери уровень</option>${opts}</select><button id='ok'>Одобрить</button><button id='no' class='btn-danger'>Отклонить</button>`;document.getElementById('ok').onclick=async()=>{const lvl=document.getElementById('lvl').value;const l=levels.find(x=>x.id===lvl);if(!l)return alert('Выбери уровень');const userRef=doc(db,'users',d.playerId);const us=await getDoc(userRef);const u=us.exists()?us.data():null;if(!u)return alert('Игрок не найден');const cs=await getDocs(query(collection(db,'completion_submissions'),where('playerId','==',d.playerId)));const ranks=[];cs.forEach(x=>{const d=x.data();if(d.status==='approved')ranks.push(Number(d.listRank??1));});const size=Math.max(2,levels.length),earned=calc(l.rank,size,ranks);await updateDoc(userRef,{points:Number(u.points??0)+earned});await updateDoc(doc(db,'completion_submissions',item.id),{status:'approved',note:document.getElementById('note').value.trim(),reviewedBy:me.uid,reviewedAt:serverTimestamp(),awardedPoints:earned,listRank:Number(l.rank??1),listQuantity:size,scoreK:ranks.length+1,levelId:l.id});await recalc();await loadSubs();detail.innerHTML='';};document.getElementById('no').onclick=async()=>{await updateDoc(doc(db,'completion_submissions',item.id),{status:'rejected',note:document.getElementById('note').value.trim()||'Отклонено',reviewedBy:me.uid,reviewedAt:serverTimestamp()});await loadSubs();detail.innerHTML='';};} else if(item.type==='appeal'&&d.status==='pending'){act.innerHTML=`<button id='ok'>Удовлетворить</button><button id='no' class='btn-danger'>Отклонить</button>`;document.getElementById('ok').onclick=async()=>{await updateDoc(doc(db,'appeals',item.id),{status:'approved',note:document.getElementById('note').value.trim()||'Апелляция удовлетворена',reviewedBy:me.uid,reviewedAt:serverTimestamp()});await loadSubs();detail.innerHTML='';};document.getElementById('no').onclick=async()=>{await updateDoc(doc(db,'appeals',item.id),{status:'rejected',note:document.getElementById('note').value.trim()||'Апелляция отклонена',reviewedBy:me.uid,reviewedAt:serverTimestamp()});await loadSubs();detail.innerHTML='';};} else {act.innerHTML=`<p class='small'>Заявка уже обработана.</p>`;}}
onAuthStateChanged(auth, async u=>{if(!u)return location.href='index.html';try{const meSnap=await getDoc(doc(db,'users',u.uid));const m=meSnap.exists()?meSnap.data():null;if(!m||m.situation!=='verified') return location.href='nick.html';if(m.role!=='elder') return location.href='main.html';me={uid:u.uid,nick:m.nick??'elder'};await loadCfg();await loadLevels();await loadSubs();status.textContent='';}catch(e){status.textContent=getNetworkErrorMessage(e);}});
</script></body></html>
