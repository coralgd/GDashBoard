<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Главная</title>
<link rel="stylesheet" href="hud.css">
</head>
<body>
<div class="hud" style="max-width:860px;margin:48px auto;text-align:center;">
  <div class="page-header" style="justify-content:center;">
    <h1 style="margin:0;">Главная панель</h1>
  </div>
  <p id="status" style="color:#00ffff;">Загрузка профиля...</p>

  <div class="stats-grid" style="margin:14px 0;">
    <div class="stat"><div class="small">Ник</div><div id="nick">—</div></div>
    <div class="stat"><div class="small">Очки</div><div id="points">0</div></div>
    <div class="stat"><div class="small">Место</div><div id="place">—</div></div>
    <div class="stat"><div class="small">Роль</div><div id="role">player</div></div>
  </div>

  <div class="top-actions" style="justify-content:center;">
    <button id="goBoard" class="btn-hero">Лидерборд и лист</button>
    <button id="goLevels" class="btn-hero">Меню уровней</button>
    <button id="goModeration" class="btn-hero">Панель модерации</button>
  </div>

  <p id="warn" style="color:#ff8fa8;"></p>
  <p class="small" id="version" style="margin-top:18px;"></p>
</div>

<script type="module">
import { auth, db, getNetworkErrorMessage } from './firebase.js';
import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.14.0/firebase-auth.js";
import { collection, doc, getDoc, getDocs, orderBy, query } from "https://www.gstatic.com/firebasejs/10.14.0/firebase-firestore.js";

const APP_VERSION = 'V3 UI rebuild · 2026-04-05';
document.getElementById('version').textContent = `Версия: ${APP_VERSION}`;

const statusEl = document.getElementById('status');
const nickEl = document.getElementById('nick');
const pointsEl = document.getElementById('points');
const placeEl = document.getElementById('place');
const roleEl = document.getElementById('role');
const warnEl = document.getElementById('warn');

function routeByRole(role){
  if(role === 'elder') return 'elder.html';
  if(role === 'moderator') return 'moderator.html';
  return '';
}

onAuthStateChanged(auth, async user => {
  if(!user) return location.href = 'index.html';
  try {
    const meSnap = await getDoc(doc(db, 'users', user.uid));
    const me = meSnap.exists() ? meSnap.data() : null;
    if(!me || me.situation !== 'verified') return location.href = 'nick.html';

    nickEl.textContent = me.nick ?? 'Без ника';
    pointsEl.textContent = String(Number(me.points ?? 0));
    roleEl.textContent = me.role ?? 'player';

    const usersSnap = await getDocs(query(collection(db,'users'), orderBy('points','desc')));
    let i = 0;
    let rank = 0;
    let place = '—';
    let last = null;
    usersSnap.forEach(d => {
      const u = d.data();
      if(u.situation !== 'verified') return;
      i++;
      if(u.points !== last){ rank = i; last = u.points; }
      if(d.id === user.uid) place = String(rank);
    });
    placeEl.textContent = place;

    document.getElementById('goBoard').onclick = () => location.href = 'leaderboard.html';
    document.getElementById('goLevels').onclick = () => location.href = 'levels-menu.html';
    document.getElementById('goModeration').onclick = () => {
      const to = routeByRole(me.role);
      if(!to){ warnEl.textContent = 'У тебя нет роли модератора.'; return; }
      location.href = to;
    };

    statusEl.textContent = '';
  } catch (error) {
    console.error(error);
    statusEl.textContent = getNetworkErrorMessage(error);
  }
});
</script>
</body>
</html>
