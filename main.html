<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>SpinList — Main</title>
<link rel="stylesheet" href="hud.css">
</head>
<body>
<div class="brand-hero">
  <img src="spinlist-logo.svg" alt="SpinList logo">
  <div class="brand-title">SPINLIST</div>
</div>
<div class="hud" style="max-width:800px;margin:50px auto;text-align:center;">
  <h1>Главная страница</h1>
  <p id="status" style="color:#00ffff;">Загрузка профиля...</p>
  <p id="userInfo"></p>
  <p id="userPoints"></p>
  <p id="userPlace"></p>

  <div class="top-actions" style="justify-content:center;">
    <button id="leaderboardBtn" class="btn-hero">Лидерборд</button>
    <button id="openLevelsMenu" class="btn-hero">Меню уровней</button>
    <button id="check" class="btn-hero">Проверить</button>
  </div>

  <p id="err" style="color:#ff98b3;margin-top:12px;"></p>
</div>

<script type="module">
import { auth, db, getNetworkErrorMessage } from './firebase.js';
import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.14.0/firebase-auth.js";
import { doc, getDoc, collection, getDocs, query, orderBy, serverTimestamp, updateDoc, where } from "https://www.gstatic.com/firebasejs/10.14.0/firebase-firestore.js";

const statusEl = document.getElementById('status');
const info = document.getElementById('userInfo');
const pointsEl = document.getElementById('userPoints');
const placeEl = document.getElementById('userPlace');
const err = document.getElementById('err');

async function renderMessages(userId){
  const exists = document.getElementById('messagesCard');
  if(exists) exists.remove();
  const container = document.querySelector('.hud');
  const card = document.createElement('div');
  card.className = 'card';
  card.id = 'messagesCard';
  card.innerHTML = '<h3 style="margin-top:0">Сообщения модераторов</h3><div id="messagesBody">Загрузка…</div>';
  container.appendChild(card);
  const body = document.getElementById('messagesBody');
  const snap = await getDocs(query(collection(db,'moderator_messages'), where('toUid','==',userId), orderBy('createdAt','desc')));
  if(snap.empty){body.innerHTML='<p class="small">Сообщений пока нет.</p>';return;}
  let html = '';
  const unread = [];
  snap.forEach(d=>{
    const m = { id:d.id, ...d.data() };
    if(!m.readAt) unread.push(d.id);
    const when = m.createdAt?.seconds ? new Date(m.createdAt.seconds*1000).toLocaleString('ru-RU') : '—';
    html += `<div class="list-item"><b>${m.fromNick ?? 'Модератор'}</b><p>${m.text ?? ''}</p><p class="small">${when}${m.readAt ? '' : ' · новое'}</p></div>`;
  });
  body.innerHTML = html;
  await Promise.all(unread.map(id=>updateDoc(doc(db,'moderator_messages',id), { readAt: serverTimestamp() })));
}

onAuthStateChanged(auth, async user => {
  if(!user) return location.href='index.html';
  try {
    const userSnap = await getDoc(doc(db,'users',user.uid));
    const profile = userSnap.exists() ? userSnap.data() : null;
    if(!profile || profile.situation !== 'verified') return location.href='nick.html';
    if(profile.accountFrozen){
      err.textContent = profile.frozenReason ? `Аккаунт заморожен: ${profile.frozenReason}` : 'Аккаунт заморожен. Вход запрещен.';
      setTimeout(()=>location.href='index.html', 1200);
      return;
    }
    info.textContent = `Ник: ${profile.nick ?? '—'}`;
    pointsEl.textContent = `Баллы: ${Number(profile.points ?? 0)}`;

    const usersSnap = await getDocs(query(collection(db,'users'), orderBy('points','desc')));
    let rank = 0, place = '—', last = null, seen = 0;
    usersSnap.forEach(d=>{
      const u = d.data();
      if(u.situation!=='verified') return;
      seen++;
      if(u.points !== last){ rank = seen; last = u.points; }
      if(d.id===user.uid) place = String(rank);
    });
    placeEl.textContent = `Место: ${place}`;

    document.getElementById('leaderboardBtn').onclick = ()=> location.href='leaderboard.html';
    document.getElementById('openLevelsMenu').onclick = ()=> location.href='levels-menu.html';
    document.getElementById('check').onclick = ()=>{
      if(profile.role==='elder') location.href='elder.html';
      else if(profile.role==='moderator') location.href='moderator.html';
      else err.textContent='Доступно только модераторам';
    };
    statusEl.textContent = '';
    await renderMessages(user.uid);
  } catch (e) {
    statusEl.textContent = getNetworkErrorMessage(e);
  }
});
</script>
</body>
</html>
