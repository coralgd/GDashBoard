<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Главная</title>
<link rel="stylesheet" href="hud.css">
</head>
<body>
<div class="hud" style="max-width:860px;text-align:center;">
  <h1>GDashBoard V3</h1>
  <p id="status" style="color:#00e5ff">Загрузка...</p>

  <div class="list-item">
    <p id="nick">Ник: —</p>
    <p id="points">Очки: 0</p>
    <p id="place">Место: —</p>
    <p id="role">Роль: player</p>
  </div>

  <div class="top-actions" style="justify-content:center">
    <button id="goBoard" class="btn-hero">Лидерборд и лист</button>
    <button id="goLevels" class="btn-hero">Меню уровней</button>
    <button id="goMod" class="btn-hero">Модерация</button>
  </div>

  <p id="err" style="color:#ff8ba8"></p>
  <p id="version" class="small"></p>
</div>

<script type="module">
import { auth, db, getNetworkErrorMessage } from './firebase.js';
import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.14.0/firebase-auth.js";
import { collection, doc, getDoc, getDocs, orderBy, query } from "https://www.gstatic.com/firebasejs/10.14.0/firebase-firestore.js";

const APP_VERSION = 'V3 FINAL · 2026-04-05';
document.getElementById('version').textContent = `Версия: ${APP_VERSION}`;

onAuthStateChanged(auth, async user => {
  if(!user) return location.href='index.html';
  try {
    const meSnap = await getDoc(doc(db,'users',user.uid));
    const me = meSnap.exists() ? meSnap.data() : null;
    if(!me || me.situation !== 'verified') return location.href='nick.html';

    document.getElementById('nick').textContent = `Ник: ${me.nick ?? '—'}`;
    document.getElementById('points').textContent = `Очки: ${Number(me.points ?? 0)}`;
    document.getElementById('role').textContent = `Роль: ${me.role ?? 'player'}`;

    const all = await getDocs(query(collection(db,'users'), orderBy('points','desc')));
    let i=0, rank=0, prev=null, place='—';
    all.forEach(d=>{
      const u=d.data();
      if(u.situation!=='verified') return;
      i++;
      if(u.points!==prev){rank=i;prev=u.points;}
      if(d.id===user.uid) place=String(rank);
    });
    document.getElementById('place').textContent = `Место: ${place}`;

    document.getElementById('goBoard').onclick = ()=>location.href='leaderboard.html';
    document.getElementById('goLevels').onclick = ()=>location.href='levels-menu.html';
    document.getElementById('goMod').onclick = ()=>{
      if(me.role==='elder') return location.href='elder.html';
      if(me.role==='moderator') return location.href='moderator.html';
      document.getElementById('err').textContent = 'У тебя нет модераторской роли.';
    };

    document.getElementById('status').textContent='';
  } catch (e) {
    console.error(e);
    document.getElementById('status').textContent = getNetworkErrorMessage(e);
  }
});
</script>
</body>
</html>
