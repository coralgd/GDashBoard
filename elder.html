<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Панель старшего модератора</title>
<link rel="stylesheet" href="hud.css">
<style>
  .modal-section{display:none}
  .modal-section.active{display:block}
</style>
</head>
<body>
<div class="hud" style="max-width:1120px;margin:36px auto;">
  <div class="page-header">
    <h1 style="margin:0;">Панель старшего модератора</h1>
    <button id="backMain" class="btn-ghost">На главную</button>
  </div>
  <p id="status" style="color:#00ffff;">Загрузка...</p>

  <div class="top-actions">
    <button id="goElderLevels" class="btn-hero">Меню листа</button>
  </div>

  <h2>Игроки</h2>
  <div class="row small"><div>#</div><div>Ник</div><div>Очки</div></div>
  <div id="users"></div>
</div>

<div id="playerModal" class="dialog-backdrop">
  <div class="dialog" style="width:min(980px,95vw)">
    <div class="page-header">
      <h2 id="playerTitle" style="margin:0;">Игрок</h2>
      <button id="closeModal" class="btn-ghost">Закрыть</button>
    </div>

    <div id="profileSection" class="modal-section active"></div>
    <div id="submissionsSection" class="modal-section"></div>
  </div>
</div>

<script type="module">
import { auth, db } from './firebase.js';
import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.14.0/firebase-auth.js";
import { collection, deleteDoc, doc, getDoc, getDocs, orderBy, query, updateDoc, where } from "https://www.gstatic.com/firebasejs/10.14.0/firebase-firestore.js";

const statusEl = document.getElementById('status');
const usersEl = document.getElementById('users');
const modal = document.getElementById('playerModal');
const profileSection = document.getElementById('profileSection');
const submissionsSection = document.getElementById('submissionsSection');

let current = null;
let submissions = [];

document.getElementById('backMain').onclick = ()=> location.href='main.html';
document.getElementById('goElderLevels').onclick = ()=> location.href='elder-levels.html';
document.getElementById('closeModal').onclick = ()=> modal.classList.remove('open');

function section(name){
  profileSection.classList.toggle('active', name === 'profile');
  submissionsSection.classList.toggle('active', name === 'submissions');
}

async function clearHistory(userId){
  const [a,b,c] = await Promise.all([
    getDocs(query(collection(db,'level_submissions'), where('authorId','==',userId))),
    getDocs(query(collection(db,'completion_submissions'), where('playerId','==',userId))),
    getDocs(query(collection(db,'appeals'), where('playerId','==',userId)))
  ]);
  for(const d of a.docs) await deleteDoc(doc(db,'level_submissions',d.id));
  for(const d of b.docs) await deleteDoc(doc(db,'completion_submissions',d.id));
  for(const d of c.docs) await deleteDoc(doc(db,'appeals',d.id));
}

async function loadSubmissions(userId){
  const [a,b,c] = await Promise.all([
    getDocs(query(collection(db,'level_submissions'), where('authorId','==',userId))),
    getDocs(query(collection(db,'completion_submissions'), where('playerId','==',userId))),
    getDocs(query(collection(db,'appeals'), where('playerId','==',userId)))
  ]);
  const all = [];
  a.forEach(d => all.push({ type:'level', ...d.data() }));
  b.forEach(d => all.push({ type:'completion', ...d.data() }));
  c.forEach(d => all.push({ type:'appeal', ...d.data() }));
  return all;
}

function input(label, type = 'text'){
  const l = document.createElement('label');
  l.className = 'small';
  l.textContent = label;
  const i = document.createElement('input');
  i.type = type;
  return { label:l, input:i };
}

function renderSubmissions(){
  const q = document.getElementById('sSearch').value.trim().toLowerCase();
  const type = document.getElementById('sType').value;
  const state = document.getElementById('sState').value;
  const box = document.getElementById('sList');
  box.innerHTML = '';

  const filtered = submissions.filter(s => {
    if(type !== 'all' && s.type !== type) return false;
    if(state !== 'all' && s.status !== state) return false;
    const hay = `${s.nick ?? ''} ${s.text ?? ''} ${s.status ?? ''} ${s.levelName ?? ''}`.toLowerCase();
    return !q || hay.includes(q);
  });

  if(!filtered.length){ box.innerHTML = '<p>Отправки не найдены.</p>'; return; }

  filtered.forEach((s, idx) => {
    const row = document.createElement('div');
    row.className = 'row list-item';
    row.append(
      Object.assign(document.createElement('div'), { textContent:String(idx + 1) }),
      Object.assign(document.createElement('div'), { textContent:`[${s.type}] ${s.levelName ?? s.text ?? 'Без текста'}` }),
      Object.assign(document.createElement('div'), { textContent:s.status ?? '—' })
    );
    box.appendChild(row);
  });
}

async function openPlayer(user){
  current = { ...user };
  document.getElementById('playerTitle').textContent = current.nick ?? 'Игрок';
  profileSection.innerHTML = '';
  submissionsSection.innerHTML = '';

  const nick = input('Ник');
  nick.input.value = current.nick ?? '';
  const email = input('Почта');
  email.input.value = current.email ?? '';
  email.input.readOnly = true;
  const points = input('Очки', 'number');
  points.input.value = String(Number(current.points ?? 0));

  const roleLabel = document.createElement('label');
  roleLabel.className = 'small';
  roleLabel.textContent = 'Роль';
  const role = document.createElement('select');
  ['player','moderator','elder'].forEach(r => {
    const option = document.createElement('option');
    option.value = r;
    option.textContent = r;
    if((current.role ?? 'player') === r) option.selected = true;
    role.appendChild(option);
  });

  const actions = document.createElement('div');
  actions.className = 'top-actions';
  const verify = document.createElement('button');
  verify.textContent = current.situation === 'verified' ? 'Снять верификацию' : 'Верифицировать';
  const openSub = document.createElement('button');
  openSub.textContent = 'Отправки';
  const clear = document.createElement('button');
  clear.className = 'btn-danger';
  clear.textContent = 'Очистить историю';
  actions.append(verify, openSub, clear);

  profileSection.append(nick.label, nick.input, email.label, email.input, points.label, points.input, roleLabel, role, actions);

  nick.input.onchange = async ()=>{
    const value = nick.input.value.trim();
    await updateDoc(doc(db,'users',current.id), { nick:value });
    current.nick = value;
    document.getElementById('playerTitle').textContent = value || 'Игрок';
    await renderUsers();
  };
  points.input.onchange = async ()=>{
    const value = Number(points.input.value || 0);
    await updateDoc(doc(db,'users',current.id), { points:value });
    current.points = value;
    await renderUsers();
  };
  role.onchange = async ()=>{
    await updateDoc(doc(db,'users',current.id), { role:role.value });
    current.role = role.value;
    await renderUsers();
  };
  verify.onclick = async ()=>{
    const next = current.situation === 'verified' ? 'not requested' : 'verified';
    await updateDoc(doc(db,'users',current.id), { situation:next });
    current.situation = next;
    verify.textContent = next === 'verified' ? 'Снять верификацию' : 'Верифицировать';
    await renderUsers();
  };
  clear.onclick = async ()=>{
    if(!confirm('Удалить все отправки игрока?')) return;
    await clearHistory(current.id);
    submissions = [];
    alert('История очищена.');
  };

  submissionsSection.innerHTML = `
    <div class="top-actions"><button id="backProfile" class="btn-ghost">Назад к профилю</button></div>
    <div class="toolbar">
      <input id="sSearch" placeholder="Поиск отправок">
      <select id="sType">
        <option value="all">Все типы</option>
        <option value="level">Уровни</option>
        <option value="completion">Прохождения</option>
        <option value="appeal">Апелляции</option>
      </select>
      <select id="sState">
        <option value="all">Все статусы</option>
        <option value="approved">Только успешные</option>
        <option value="pending">Ожидают</option>
        <option value="rejected">Отклонённые</option>
      </select>
    </div>
    <div id="sList"></div>
  `;
  document.getElementById('backProfile').onclick = ()=> section('profile');
  document.getElementById('sSearch').oninput = renderSubmissions;
  document.getElementById('sType').onchange = renderSubmissions;
  document.getElementById('sState').onchange = renderSubmissions;

  openSub.onclick = async ()=>{
    openSub.disabled = true;
    submissions = await loadSubmissions(current.id);
    renderSubmissions();
    section('submissions');
    openSub.disabled = false;
  };

  section('profile');
  modal.classList.add('open');
}

async function renderUsers(){
  usersEl.innerHTML = 'Загрузка игроков...';
  const snap = await getDocs(query(collection(db,'users'), orderBy('points','desc')));
  usersEl.innerHTML = '';

  let i = 1;
  snap.forEach(d => {
    const u = d.data();
    const row = document.createElement('div');
    row.className = 'row list-item clickable';
    if(u.role === 'moderator') row.classList.add('moderator');
    if(u.role === 'elder') row.classList.add('elder');
    if(u.situation !== 'verified') row.classList.add('unverified');

    row.append(
      Object.assign(document.createElement('div'), { textContent:String(i++) }),
      Object.assign(document.createElement('div'), { textContent:u.nick ?? 'Без ника' }),
      Object.assign(document.createElement('div'), { textContent:String(Number(u.points ?? 0)) })
    );

    row.onclick = ()=> openPlayer({ id:d.id, ...u });
    usersEl.appendChild(row);
  });
}

onAuthStateChanged(auth, async user => {
  if(!user) return location.href='index.html';
  const meSnap = await getDoc(doc(db,'users',user.uid));
  const me = meSnap.exists() ? meSnap.data() : null;
  if(!me || me.situation !== 'verified') return location.href='nick.html';
  if(me.role !== 'elder') return location.href='main.html';

  await renderUsers();
  statusEl.textContent = '';
});
</script>
</body>
</html>
