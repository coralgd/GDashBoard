<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Старший модератор</title>
<link rel="stylesheet" href="hud.css">
<style>
  .user-card{cursor:pointer}
  .user-card:hover{outline:1px solid rgba(32,245,204,.7)}
  .unverified{color:#8c97a8;opacity:.65}
  .modal-section{display:none}
  .modal-section.active{display:block}
</style>
</head>
<body>
<div class="hud" style="max-width:1100px;margin:40px auto;">
  <div class="page-header">
    <h1 style="margin:0;">Панель старшего модератора</h1>
    <button id="backMain" class="btn-ghost">На главную</button>
  </div>
  <p id="status" style="color:#00ffff;">Загрузка...</p>

  <div class="top-actions">
    <button id="goElderLevels" class="btn-hero">Меню листа</button>
  </div>

  <h2>Игроки</h2>
  <div id="users"></div>
</div>

<div id="playerModal" class="dialog-backdrop">
  <div class="dialog" style="width:min(980px,95vw)">
    <div class="page-header">
      <h2 id="playerModalTitle" style="margin:0;">Игрок</h2>
      <button id="closePlayerModal" class="btn-ghost">Закрыть</button>
    </div>

    <div id="profileSection" class="modal-section active"></div>
    <div id="submissionsSection" class="modal-section"></div>
  </div>
</div>

<script type="module">
import { auth, db } from './firebase.js';
import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.14.0/firebase-auth.js";
import { collection, query, orderBy, where, getDocs, doc, updateDoc, getDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.14.0/firebase-firestore.js";

const statusEl = document.getElementById('status');
const usersEl = document.getElementById('users');
const modal = document.getElementById('playerModal');

document.getElementById('backMain').onclick = ()=> location.href='main.html';
document.getElementById('goElderLevels').onclick = ()=> location.href='elder-levels.html';
document.getElementById('closePlayerModal').onclick = ()=> modal.classList.remove('open');

function switchModalSection(name){
  document.getElementById('profileSection').classList.toggle('active', name==='profile');
  document.getElementById('submissionsSection').classList.toggle('active', name==='submissions');
}

async function clearUserHistory(userId){
  const [levelSubs, compSubs, appeals] = await Promise.all([
    getDocs(query(collection(db,'level_submissions'), where('authorId','==',userId))),
    getDocs(query(collection(db,'completion_submissions'), where('playerId','==',userId))),
    getDocs(query(collection(db,'appeals'), where('playerId','==',userId)))
  ]);

  for (const d of levelSubs.docs) await deleteDoc(doc(db,'level_submissions',d.id));
  for (const d of compSubs.docs) await deleteDoc(doc(db,'completion_submissions',d.id));
  for (const d of appeals.docs) await deleteDoc(doc(db,'appeals',d.id));
}

async function openPlayerModal(userDoc){
  const { id, data } = userDoc;
  document.getElementById('playerModalTitle').textContent = data.nick ?? 'Игрок';

  const profile = document.getElementById('profileSection');
  const submissions = document.getElementById('submissionsSection');

  profile.innerHTML = `
    <label class="small">Ник</label>
    <input id="modalNick" value="${data.nick ?? ''}" placeholder="Ник">
    <label class="small">Почта</label>
    <input id="modalEmail" value="${data.email ?? ''}" placeholder="Почта" readonly>
    <label class="small">Очки</label>
    <input id="modalPoints" type="number" value="${Number(data.points ?? 0)}" placeholder="Очки">
    <label class="small">Роль</label>
    <select id="modalRole">
      <option value="player" ${data.role==='player' || !data.role ? 'selected' : ''}>player</option>
      <option value="moderator" ${data.role==='moderator' ? 'selected' : ''}>moderator</option>
      <option value="elder" ${data.role==='elder' ? 'selected' : ''}>elder</option>
    </select>
    <div class="top-actions">
      <button id="toggleVer">${data.situation==='verified' ? 'Снять верифку' : 'Верифицировать'}</button>
      <button id="openSubs">Отправки</button>
      <button id="clearHistory" class="btn-danger">Очистить историю отправок</button>
    </div>
  `;

  const nickInput = document.getElementById('modalNick');
  const pointsInput = document.getElementById('modalPoints');
  const roleSelect = document.getElementById('modalRole');

  nickInput.onchange = async ()=>{
    await updateDoc(doc(db,'users',id), { nick:nickInput.value.trim() });
    document.getElementById('playerModalTitle').textContent = nickInput.value.trim() || 'Игрок';
  };
  pointsInput.onchange = async ()=>{
    await updateDoc(doc(db,'users',id), { points:Number(pointsInput.value) });
  };
  roleSelect.onchange = async ()=>{
    await updateDoc(doc(db,'users',id), { role:roleSelect.value });
  };

  document.getElementById('toggleVer').onclick = async ()=>{
    const newSit = data.situation==='verified' ? 'not requested' : 'verified';
    await updateDoc(doc(db,'users',id), { situation:newSit });
    data.situation = newSit;
    document.getElementById('toggleVer').textContent = data.situation==='verified' ? 'Снять верифку' : 'Верифицировать';
  };

  document.getElementById('clearHistory').onclick = async ()=>{
    if(!confirm('Удалить всю историю отправок этого игрока?')) return;
    await clearUserHistory(id);
    alert('История очищена');
  };

  document.getElementById('openSubs').onclick = ()=>switchModalSection('submissions');

  const [levelSubs, compSubs, appealSubs] = await Promise.all([
    getDocs(query(collection(db,'level_submissions'), where('authorId','==',id))),
    getDocs(query(collection(db,'completion_submissions'), where('playerId','==',id))),
    getDocs(query(collection(db,'appeals'), where('playerId','==',id)))
  ]);

  const allSubs = [];
  levelSubs.forEach(d=>allSubs.push({type:'level', ...d.data()}));
  compSubs.forEach(d=>allSubs.push({type:'completion', ...d.data()}));
  appealSubs.forEach(d=>allSubs.push({type:'appeal', ...d.data()}));

  submissions.innerHTML = `
    <div class="top-actions">
      <button id="backToProfile" class="btn-ghost">Назад к профилю</button>
    </div>
    <div class="toolbar">
      <input id="subSearch" placeholder="Поиск отправок">
      <select id="subType">
        <option value="all">Все типы</option>
        <option value="level">Уровни</option>
        <option value="completion">Прохождения</option>
        <option value="appeal">Апелляции</option>
      </select>
      <select id="subStatus">
        <option value="all">Все статусы</option>
        <option value="approved">Только успешные</option>
      </select>
    </div>
    <div id="subList"></div>
  `;

  document.getElementById('backToProfile').onclick = ()=>switchModalSection('profile');

  function renderSubs(){
    const q = document.getElementById('subSearch').value.trim().toLowerCase();
    const t = document.getElementById('subType').value;
    const s = document.getElementById('subStatus').value;
    const box = document.getElementById('subList');
    box.innerHTML = '';

    const filtered = allSubs.filter(x=>{
      if(t !== 'all' && x.type !== t) return false;
      if(s !== 'all' && x.status !== s) return false;
      const hay = `${x.text ?? ''} ${x.status ?? ''} ${x.nick ?? ''}`.toLowerCase();
      return !q || hay.includes(q);
    });

    if(!filtered.length){ box.innerHTML = '<p>Отправки не найдены.</p>'; return; }
    filtered.forEach(x=>{
      const row = document.createElement('div');
      row.className='row';
      row.innerHTML = `<b>[${x.type}]</b> ${x.status ?? '—'}<br>${x.text ?? ''}`;
      box.appendChild(row);
    });
  }

  document.getElementById('subSearch').oninput = renderSubs;
  document.getElementById('subType').onchange = renderSubs;
  document.getElementById('subStatus').onchange = renderSubs;
  renderSubs();

  switchModalSection('profile');
  modal.classList.add('open');
}

async function loadUsers(){
  usersEl.innerHTML = 'Загрузка...';
  const snap = await getDocs(query(collection(db,'users'), orderBy('points','desc')));
  if(snap.empty){ usersEl.innerHTML = '<p>Нет пользователей.</p>'; return; }

  usersEl.innerHTML = '';
  snap.forEach(d=>{
    const u = d.data();
    const row = document.createElement('div');
    row.className = 'row user-card';
    if(u.role==='moderator') row.classList.add('moderator');
    if(u.role==='elder') row.classList.add('elder');
    if(u.situation!=='verified') row.classList.add('unverified');
    row.innerHTML = `<div>${u.nick ?? 'Без ника'}</div><div></div><div>${Number(u.points ?? 0)}</div>`;
    row.onclick = ()=>openPlayerModal({id:d.id, data:u});
    usersEl.appendChild(row);
  });
}

onAuthStateChanged(auth, async user=>{
  if(!user) return location.href='index.html';
  try {
    const meSnap = await getDoc(doc(db,'users',user.uid));
    const me = meSnap.exists() ? meSnap.data() : null;
    if(!me || me.situation!=='verified') return location.href='nick.html';
    if(me.role!=='elder') return location.href='main.html';
    meUid = user.uid;

    await loadUsers();
    statusEl.textContent = '';
  } catch (e) {
    console.error(e);
    statusEl.textContent = 'Не удалось загрузить панель старшего модератора.';
  }
});
</script>
</body>
</html>
