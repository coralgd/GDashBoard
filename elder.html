<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>SpinList — Старший модератор</title>
<link rel="stylesheet" href="hud.css">
<style>
  .layout{display:grid;grid-template-columns:minmax(0,1fr) 250px;gap:16px;align-items:start}
  .side-tools{position:sticky;top:16px}
  .side-tools .card{display:flex;flex-direction:column;gap:10px}
  .toolbar-btn{width:100%}
  #listContainer .row{cursor:default}
  #submissionsModal .dialog{width:min(1200px,96vw);max-height:90vh;overflow:auto}
  @media (max-width: 900px){
    .layout{grid-template-columns:1fr}
    .side-tools{position:static}
  }
</style>
</head>
<body>
<div class="brand-hero">
  <img src="spinlist-logo.svg" alt="SpinList logo">
  <div class="brand-title">SPINLIST</div>
</div>

<div class="hud" style="max-width:1200px;margin:40px auto;">
  <div class="page-header">
    <h1 style="margin:0;">Панель старшего модератора</h1>
    <button id="backMain" class="btn-ghost">На главную</button>
  </div>
  <p id="status" style="color:#00ffff;">Загрузка...</p>

  <div class="layout">
    <div>
      <h2 id="listTitle" style="margin-top:0;">Список игроков</h2>
      <div class="row small"><div>#</div><div>Ник / Название</div><div>Параметр</div></div>
      <div id="listContainer"></div>
    </div>

    <aside class="side-tools">
      <div class="card">
        <button id="toggleList" class="toolbar-btn btn-hero">Показать уровни</button>
        <button id="openSubmissions" class="toolbar-btn btn-success">Отправки</button>
        <p class="small">Кнопка «Отправки» открывает окно со всеми заявками, где есть фильтр по типу и сортировка по дате подачи.</p>
      </div>
    </aside>
  </div>
</div>

<div id="submissionsModal" class="dialog-backdrop">
  <div class="dialog">
    <div class="page-header">
      <h2 style="margin:0;">Все отправки</h2>
      <button id="closeSubmissions" class="btn-ghost">Закрыть</button>
    </div>

    <div class="top-actions">
      <div>
        <label for="typeFilter">Тип</label>
        <select id="typeFilter">
          <option value="all">Все</option>
          <option value="completion">Прохождения</option>
          <option value="placement">Постановка уровней</option>
          <option value="appeal">Апелляции</option>
        </select>
      </div>
      <div>
        <label for="dateSort">Сортировка по дате подачи</label>
        <select id="dateSort">
          <option value="desc">Сначала новые</option>
          <option value="asc">Сначала старые</option>
        </select>
      </div>
    </div>

    <div class="row small"><div>Дата</div><div>Описание</div><div>Тип/Статус</div></div>
    <div id="submissionList"></div>
  </div>
</div>

<script type="module">
import { auth, db, getNetworkErrorMessage } from './firebase.js';
import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.14.0/firebase-auth.js";
import { collection, getDocs, query, orderBy, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.14.0/firebase-firestore.js";

const statusEl = document.getElementById('status');
const listTitle = document.getElementById('listTitle');
const listContainer = document.getElementById('listContainer');
const toggleListBtn = document.getElementById('toggleList');
const submissionsModal = document.getElementById('submissionsModal');
const submissionList = document.getElementById('submissionList');
const typeFilter = document.getElementById('typeFilter');
const dateSort = document.getElementById('dateSort');

let showPlayers = true;
let players = [];
let levels = [];
let submissions = [];

function formatDate(ts){
  if(!ts?.seconds) return '—';
  return new Date(ts.seconds * 1000).toLocaleString('ru-RU');
}

function renderMainList(){
  listTitle.textContent = showPlayers ? 'Список игроков' : 'Список уровней';
  toggleListBtn.textContent = showPlayers ? 'Показать уровни' : 'Показать игроков';

  listContainer.innerHTML = '';
  const items = showPlayers ? players : levels;
  if(!items.length){
    listContainer.innerHTML = `<p>${showPlayers ? 'Игроков нет.' : 'Уровней нет.'}</p>`;
    return;
  }

  items.forEach(item => {
    const row = document.createElement('div');
    row.className = 'row list-item';
    if(showPlayers){
      row.innerHTML = `<div>${item.rank}</div><div>${item.nick ?? 'Без ника'}</div><div>${Number(item.points ?? 0)}</div>`;
    } else {
      row.innerHTML = `<div>${Number(item.rank ?? 0) || '—'}</div><div>${item.text ?? 'Без названия'}</div><div>${item.status ?? 'active'}</div>`;
    }
    listContainer.appendChild(row);
  });
}

function filteredSubmissions(){
  const type = typeFilter.value;
  const sorted = [...submissions].sort((a,b)=>{
    const av = a.createdAt?.seconds ?? 0;
    const bv = b.createdAt?.seconds ?? 0;
    return dateSort.value === 'asc' ? av - bv : bv - av;
  });
  return type === 'all' ? sorted : sorted.filter(x=>x.type===type);
}

function renderSubmissions(){
  const rows = filteredSubmissions();
  submissionList.innerHTML = '';
  if(!rows.length){
    submissionList.innerHTML = '<p>Отправок не найдено.</p>';
    return;
  }

  rows.forEach(x=>{
    const row = document.createElement('div');
    row.className = 'row list-item';
    const who = x.nick ?? x.playerNick ?? 'Без ника';
    const label = x.type==='completion' ? 'Прохождение' : x.type==='placement' ? 'Постановка' : 'Апелляция';
    row.innerHTML = `
      <div>${formatDate(x.createdAt)}</div>
      <div><b>${who}</b><div class="small">${x.text ?? '—'} ${x.link ? ` · ${x.link}` : ''}</div></div>
      <div>${label}<div class="small">${x.status ?? 'pending'}</div></div>
    `;
    submissionList.appendChild(row);
  });
}

async function loadData(){
  const [usersSnap, levelsSnap, levelSubmissionsSnap, completionSnap, appealsSnap] = await Promise.all([
    getDocs(query(collection(db,'users'), orderBy('points','desc'))),
    getDocs(query(collection(db,'levels'), orderBy('rank','asc'))),
    getDocs(collection(db,'level_submissions')),
    getDocs(collection(db,'completion_submissions')),
    getDocs(collection(db,'appeals'))
  ]);

  players = [];
  let seen = 0;
  let rank = 0;
  let lastPoints = null;
  usersSnap.forEach(d=>{
    const u = d.data();
    if(u.situation!=='verified') return;
    const points = Number(u.points ?? 0);
    seen += 1;
    if(lastPoints !== points){ rank = seen; lastPoints = points; }
    players.push({ id:d.id, ...u, points, rank });
  });

  levels = [];
  levelsSnap.forEach(d=>{
    const l = d.data();
    if(l.status==='archived') return;
    levels.push({ id:d.id, ...l });
  });

  submissions = [];
  levelSubmissionsSnap.forEach(d=> submissions.push({ id:d.id, ...d.data(), type:'placement' }));
  completionSnap.forEach(d=> submissions.push({ id:d.id, ...d.data(), type:'completion' }));
  appealsSnap.forEach(d=> submissions.push({ id:d.id, ...d.data(), type:'appeal' }));

  renderMainList();
  renderSubmissions();
}

onAuthStateChanged(auth, async user => {
  if(!user) return location.href='index.html';
  try {
    const meSnap = await getDoc(doc(db,'users',user.uid));
    const me = meSnap.exists() ? meSnap.data() : null;
    if(!me || me.situation!=='verified') return location.href='nick.html';
    if(me.role!=='elder') return location.href='main.html';

    await loadData();
    statusEl.textContent = '';
  } catch (e) {
    statusEl.textContent = getNetworkErrorMessage(e);
  }
});

document.getElementById('backMain').onclick = ()=> location.href='main.html';
document.getElementById('openSubmissions').onclick = ()=> {
  renderSubmissions();
  submissionsModal.classList.add('open');
};
document.getElementById('closeSubmissions').onclick = ()=> submissionsModal.classList.remove('open');


toggleListBtn.onclick = ()=>{
  showPlayers = !showPlayers;
  renderMainList();
};

typeFilter.onchange = renderSubmissions;
dateSort.onchange = renderSubmissions;
</script>
</body>
</html>
