<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Отправка уровня</title>
<link rel="stylesheet" href="hud.css">
</head>
<body>
<div class="hud" style="max-width:700px;margin:50px auto;">
  <h1>Отправить уровень в лист</h1>
  <div class="card">
    <input id="link" placeholder="Ссылка на уровень" style="width:100%"><br><br>
    <textarea id="text" placeholder="Описание" style="width:100%;min-height:120px"></textarea><br><br>
    <input id="fileUrl" placeholder="Ссылка на файл (опционально)" style="width:100%"><br><br>

    <label class="small">Сослаться на прошлую отправку (опц.)</label>
    <select id="ref" style="width:100%"><option value="">Без ссылки</option></select><br><br>

    <div class="top-actions">
      <button id="send">Отправить</button>
      <button id="back">Назад</button>
    </div>
  </div>
  <p id="msg" style="color:#00ffff"></p>
</div>

<script type="module">
import { auth, db, getNetworkErrorMessage } from './firebase.js';
import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.14.0/firebase-auth.js";
import { doc, getDoc, addDoc, collection, serverTimestamp, getDocs, query, where } from "https://www.gstatic.com/firebasejs/10.14.0/firebase-firestore.js";

let user = null;
let profile = null;

async function loadRefs(uid){
  const sel = document.getElementById('ref');
  const snap = await getDocs(query(collection(db,'level_submissions'), where('authorId','==',uid)));
  const items = [];
  snap.forEach(d=>items.push({id:d.id,...d.data()}));
  items.sort((a,b)=>(b.createdAt?.seconds||0)-(a.createdAt?.seconds||0));
  items.slice(0,50).forEach(x=>{
    const o = document.createElement('option');
    o.value = x.id;
    o.textContent = `[${x.status ?? 'pending'}] ${String(x.text ?? '').slice(0,80) || 'Без текста'}`;
    sel.appendChild(o);
  });
}

onAuthStateChanged(auth, async u=>{
  if(!u) return location.href='index.html';
  try {
    user = u;
    const snap = await getDoc(doc(db,'users',u.uid));
    profile = snap.exists() ? snap.data() : null;
    if(!profile || profile.situation!=='verified') return location.href='nick.html';
    await loadRefs(u.uid);
  } catch (e) {
    document.getElementById('msg').textContent = getNetworkErrorMessage(e);
  }
});

send.onclick = async ()=>{
  const link = document.getElementById('link').value.trim();
  const text = document.getElementById('text').value.trim();
  const fileUrl = document.getElementById('fileUrl').value.trim();
  const referenceSubmissionId = document.getElementById('ref').value || '';
  const msg = document.getElementById('msg');
  if(!link || !text){ msg.textContent='Нужны ссылка и текст'; return; }

  try {
    await addDoc(collection(db,'level_submissions'), {
      authorId:user.uid, nick:profile.nick ?? 'Без ника', link, text, fileUrl,
      referenceSubmissionId,
      status:'pending', note:'', createdAt:serverTimestamp()
    });
    msg.textContent='Заявка отправлена модераторам.';
  } catch (e) {
    msg.textContent = getNetworkErrorMessage(e);
  }
};

back.onclick = ()=> location.href='main.html';
</script>
</body>
</html>
