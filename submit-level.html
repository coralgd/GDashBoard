<!DOCTYPE html><html lang="ru"><head><meta charset="UTF-8"><title>Отправка уровня</title><link rel="stylesheet" href="hud.css"></head><body><div class="hud" style="max-width:700px"><h1>Отправить уровень</h1><input id="link" placeholder="Ссылка"><br><br><textarea id="text" placeholder="Описание"></textarea><br><br><input id="fileUrl" placeholder="Файл (опц.)"><div class="top-actions"><button id="send">Отправить</button><button id="back">Назад</button></div><p id="msg"></p></div>
<script type="module">
import { auth, db, getNetworkErrorMessage } from './firebase.js';
import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.14.0/firebase-auth.js";
import { doc, getDoc, addDoc, collection, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.14.0/firebase-firestore.js";
let user=null,profile=null;const msg=document.getElementById('msg');onAuthStateChanged(auth,async u=>{if(!u)return location.href='index.html';try{user=u;const s=await getDoc(doc(db,'users',u.uid));profile=s.exists()?s.data():null;if(!profile||profile.situation!=='verified') return location.href='nick.html';}catch(e){msg.textContent=getNetworkErrorMessage(e);}});
document.getElementById('send').onclick=async()=>{const link=document.getElementById('link').value.trim();const text=document.getElementById('text').value.trim();const fileUrl=document.getElementById('fileUrl').value.trim();if(!link||!text){msg.textContent='Нужны ссылка и текст';return;}await addDoc(collection(db,'level_submissions'),{authorId:user.uid,nick:profile.nick??'Без ника',link,text,fileUrl,status:'pending',note:'',createdAt:serverTimestamp()});msg.textContent='Отправлено';};
document.getElementById('back').onclick=()=>location.href='main.html';
</script></body></html>
