<!doctype html>
<html lang="ru">
<head><meta charset="UTF-8"><title>Панель модератора</title><link rel="stylesheet" href="hud.css"></head>
<body>
<div class="hud" style="max-width:1020px">
  <div class="page-header"><h1>Панель модератора</h1><button id="back" class="btn-ghost">На главную</button></div>
  <p id="status" style="color:#00e5ff">Загрузка...</p>
  <div class="top-actions"><button id="goLevels" class="btn-hero">Меню уровней модератора</button></div>
  <div id="users"></div>
</div>
<script type="module">
import { auth, db, getNetworkErrorMessage } from './firebase.js';
import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.14.0/firebase-auth.js";
import { collection, doc, getDoc, getDocs, query, updateDoc, where } from "https://www.gstatic.com/firebasejs/10.14.0/firebase-firestore.js";

const statusEl=document.getElementById('status');
const usersEl=document.getElementById('users');
document.getElementById('back').onclick=()=>location.href='main.html';
document.getElementById('goLevels').onclick=()=>location.href='moderator-levels.html';

async function loadUsers(){
  usersEl.innerHTML='Загрузка игроков...';
  const snap=await getDocs(query(collection(db,'users'),where('situation','==','verified')));
  const items=[]; snap.forEach(d=>{const u=d.data(); if(u.role==='moderator'||u.role==='elder') return; items.push({id:d.id,...u});});
  items.sort((a,b)=>String(a.nick??'').localeCompare(String(b.nick??''),'ru'));
  usersEl.innerHTML='';
  if(!items.length){usersEl.innerHTML='<p>Игроков нет.</p>';return;}
  items.forEach(u=>{
    const row=document.createElement('div'); row.className='list-item';
    row.innerHTML=`<b>${u.nick??'Без ника'}</b><p class='small'>${u.email??'—'}</p><input type='number' value='${Number(u.points??0)}'><button>Сохранить очки</button>`;
    row.querySelector('button').onclick=async()=>{
      const points=Number(row.querySelector('input').value);
      if(Number.isNaN(points)) return alert('Некорректное число');
      await updateDoc(doc(db,'users',u.id),{points});
      row.querySelector('button').textContent='Сохранено';
      setTimeout(()=>row.querySelector('button').textContent='Сохранить очки',600);
    };
    usersEl.appendChild(row);
  });
}

onAuthStateChanged(auth, async user=>{
  if(!user) return location.href='index.html';
  try {
    const me=await getDoc(doc(db,'users',user.uid));
    const my=me.exists()?me.data():null;
    if(!my||my.situation!=='verified') return location.href='nick.html';
    if(my.role!=='moderator'&&my.role!=='elder') return location.href='main.html';
    await loadUsers();
    statusEl.textContent='';
  } catch(e){
    console.error(e);
    statusEl.textContent=getNetworkErrorMessage(e);
  }
});
</script>
</body>
</html>
