<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Панель модератора</title>
<link rel="stylesheet" href="hud.css">
<style>.panel{display:none;margin-top:14px}.panel.active{display:block}</style>
</head>
<body>
<div class="hud" style="max-width:1100px;margin:40px auto;">
  <h1>Панель модератора</h1>
  <p id="status" style="color:#00ffff;">Загрузка...</p>

  <div class="menu-grid">
    <button data-tab="levels">Заявки уровней</button>
    <button data-tab="completions">Заявки прохождений</button>
    <button data-tab="users">Аккаунты</button>
  </div>

  <div id="levels" class="panel active"></div>
  <div id="completions" class="panel"></div>
  <div id="users" class="panel"></div>
</div>

<script type="module">
import { auth, db, getNetworkErrorMessage } from './firebase.js';
import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.14.0/firebase-auth.js";
import { collection, query, where, getDocs, doc, updateDoc, getDoc, addDoc, serverTimestamp, deleteDoc } from "https://www.gstatic.com/firebasejs/10.14.0/firebase-firestore.js";

const statusEl = document.getElementById('status');
let me = null;

function setTab(id){
  document.querySelectorAll('.panel').forEach(x=>x.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>setTab(b.dataset.tab));

async function clearUserHistory(uid){
  const [levelSub, completionSub, appealSub] = await Promise.all([
    getDocs(query(collection(db,'level_submissions'), where('authorId','==',uid))),
    getDocs(query(collection(db,'completion_submissions'), where('playerId','==',uid))),
    getDocs(query(collection(db,'appeals'), where('playerId','==',uid)))
  ]);
  await Promise.all(levelSub.docs.map(d=>deleteDoc(doc(db,'level_submissions',d.id))));
  await Promise.all(completionSub.docs.map(d=>deleteDoc(doc(db,'completion_submissions',d.id))));
  await Promise.all(appealSub.docs.map(d=>deleteDoc(doc(db,'appeals',d.id))));
}

async function loadUsersTab(){
  const box = document.getElementById('users');
  const snap = await getDocs(collection(db,'users'));
  const rows = [];
  snap.forEach(d=>rows.push({id:d.id, ...d.data()}));
  rows.sort((a,b)=>String(a.nick ?? '').localeCompare(String(b.nick ?? ''), 'ru'));

  box.innerHTML = `
    <label>Поиск игрока / роли / почты</label>
    <input id="userSearch" placeholder="Например: player, ivan, @mail">
    <div id="userList"></div>
  `;

  const list = document.getElementById('userList');
  const render = ()=>{
    const q = document.getElementById('userSearch').value.trim().toLowerCase();
    list.innerHTML = '';
    const filtered = rows.filter(u=>`${u.nick ?? ''} ${u.role ?? ''} ${u.email ?? ''}`.toLowerCase().includes(q));
    if(!filtered.length){ list.innerHTML='<p>Пусто.</p>'; return; }

    filtered.forEach(u=>{
      const row = document.createElement('div');
      row.className='card';
      const locked = u.id===me.uid || u.role==='moderator' || u.role==='elder';
      row.innerHTML = `
        <b>${u.nick ?? 'Без ника'}</b>
        <p class="small">Почта: ${u.email ?? '—'}</p>
        <p class="small">Роль: ${u.role ?? 'player'} · Очки: ${Number(u.points ?? 0)}</p>
        <p class="small">Кнопка удаляет профиль и все отправки игрока.</p>
        <button class="btn-danger del" ${locked ? 'disabled' : ''}>Удалить аккаунт</button>
      `;
      row.querySelector('.del').onclick = async ()=>{
        if(!confirm(`Удалить аккаунт ${u.nick ?? 'Без ника'}?`)) return;
        try {
          await clearUserHistory(u.id);
          await deleteDoc(doc(db,'users',u.id));
          row.remove();
        } catch (e) {
          alert(getNetworkErrorMessage(e));
        }
      };
      list.appendChild(row);
    });
  };

  document.getElementById('userSearch').oninput = render;
  render();
}

async function loadPendingLevels(){
  const snap = await getDocs(query(collection(db,'level_submissions'), where('status','==','pending')));
  const rows = [];
  snap.forEach(d=>rows.push({id:d.id,...d.data()}));

  const box = document.getElementById('levels');
  box.innerHTML = `
    <label>Поиск по нику / тексту / ссылке</label>
    <input id="levelSearch" placeholder="Например: demon, memory, youtube">
    <div id="levelList"></div>
  `;

  const list = document.getElementById('levelList');
  const render = ()=>{
    const q = document.getElementById('levelSearch').value.trim().toLowerCase();
    list.innerHTML = '';
    const filtered = rows.filter(s=>`${s.nick ?? ''} ${s.text ?? ''} ${s.link ?? ''} ${s.referenceSubmissionId ?? ''}`.toLowerCase().includes(q));
    if(!filtered.length){ list.innerHTML='<p>Нет заявок.</p>'; return; }

    filtered.forEach(s=>{
      const row=document.createElement('div');
      row.className='card';
      row.innerHTML=`
        <b>${s.nick ?? 'Без ника'}</b>
        <p><a href="${s.link ?? '#'}" target="_blank">Открыть ссылку</a></p>
        <p>${s.text ?? ''}</p>
        <p class="small">ref: ${s.referenceSubmissionId ?? '—'} · Что меняет место: поле «Место» ниже.</p>
        <label>Комментарий модератора (что меняет: note)</label>
        <input class="note" placeholder="Причина решения">
        <label>Место в листе (что меняет: rank/finalRank)</label>
        <input class="rank" type="number" min="1" placeholder="Например: 12">
        <div class="top-actions"><button class="ok">Одобрить</button><button class="no btn-danger">Отклонить</button></div>
      `;
      row.querySelector('.ok').onclick = async ()=>{
        const rank=Number(row.querySelector('.rank').value);
        if(!rank) return alert('Укажи место');
        await addDoc(collection(db,'levels'),{link:s.link ?? '',text:s.text ?? '',fileUrl:s.fileUrl ?? '',rank,status:'active',addedBy:me.uid,addedByNick:me.nick ?? 'moderator',createdAt:serverTimestamp(),sourceSubmissionId:s.id});
        await updateDoc(doc(db,'level_submissions',s.id),{status:'approved',note:row.querySelector('.note').value.trim(),reviewedBy:me.uid,reviewedAt:serverTimestamp(),finalRank:rank});
        row.remove();
      };
      row.querySelector('.no').onclick = async ()=>{
        await updateDoc(doc(db,'level_submissions',s.id),{status:'rejected',note:row.querySelector('.note').value.trim() || 'Отклонено',reviewedBy:me.uid,reviewedAt:serverTimestamp()});
        row.remove();
      };
      list.appendChild(row);
    });
  };

  document.getElementById('levelSearch').oninput = render;
  render();
}

async function loadPendingCompletions(){
  const snap = await getDocs(query(collection(db,'completion_submissions'), where('status','==','pending')));
  const rows = [];
  snap.forEach(d=>rows.push({id:d.id,...d.data()}));

  const box = document.getElementById('completions');
  box.innerHTML = `
    <label>Поиск по нику / тексту / ссылке</label>
    <input id="compSearch" placeholder="Например: player, level name, link">
    <div id="compList"></div>
  `;

  const list = document.getElementById('compList');
  const render = ()=>{
    const q = document.getElementById('compSearch').value.trim().toLowerCase();
    list.innerHTML = '';
    const filtered = rows.filter(s=>`${s.nick ?? ''} ${s.text ?? ''} ${s.link ?? ''} ${s.referenceSubmissionId ?? ''}`.toLowerCase().includes(q));
    if(!filtered.length){ list.innerHTML='<p>Нет заявок.</p>'; return; }

    filtered.forEach(s=>{
      const row=document.createElement('div');
      row.className='card';
      row.innerHTML=`
        <b>${s.nick ?? 'Без ника'}</b>
        <p><a href="${s.link ?? '#'}" target="_blank">Открыть доказательство</a></p>
        <p>${s.text ?? ''}</p>
        <p class="small">ref: ${s.referenceSubmissionId ?? '—'} · Что меняет комментарий: поле «Комментарий» ниже.</p>
        <label>Комментарий модератора (что меняет: note)</label>
        <input class="note" placeholder="Комментарий к решению">
        <div class="top-actions"><button class="ok">Одобрить</button><button class="no btn-danger">Отклонить</button></div>
      `;
      row.querySelector('.ok').onclick = async ()=>{
        await updateDoc(doc(db,'completion_submissions',s.id),{status:'approved',note:row.querySelector('.note').value.trim(),reviewedBy:me.uid,reviewedAt:serverTimestamp()});
        row.remove();
      };
      row.querySelector('.no').onclick = async ()=>{
        await updateDoc(doc(db,'completion_submissions',s.id),{status:'rejected',note:row.querySelector('.note').value.trim() || 'Отклонено',reviewedBy:me.uid,reviewedAt:serverTimestamp()});
        row.remove();
      };
      list.appendChild(row);
    });
  };

  document.getElementById('compSearch').oninput = render;
  render();
}

function renderArchiveSection(title, items){
  let html = `<h3>${title}</h3>`;
  if(!items.length) return html + '<p class="small">Пусто.</p>';
  items
    .sort((a,b)=>(b.reviewedAt?.seconds ?? 0)-(a.reviewedAt?.seconds ?? 0))
    .forEach(x=>{
      html += `<div class="row"><b>${x.nick ?? 'Без ника'}</b><p>${x.text ?? ''}</p><p class="small">status=${x.status ?? '—'} · note=${x.note ?? '—'} · ref=${x.referenceSubmissionId ?? '—'}</p></div>`;
    });
  return html;
}

async function loadArchive(){
  const box = document.getElementById('archive');
  box.innerHTML = 'Загрузка архива...';

  const [ls, cs, ap] = await Promise.all([
    getDocs(collection(db,'level_submissions')),
    getDocs(collection(db,'completion_submissions')),
    getDocs(collection(db,'appeals'))
  ]);

  const levels = []; const completions = []; const appeals = [];
  ls.forEach(d=>{ const x=d.data(); if(x.status && x.status!=='pending') levels.push(x); });
  cs.forEach(d=>{ const x=d.data(); if(x.status && x.status!=='pending') completions.push(x); });
  ap.forEach(d=>{ const x=d.data(); if(x.status && x.status!=='pending') appeals.push(x); });

  box.innerHTML =
    renderArchiveSection('Архив уровней', levels) +
    renderArchiveSection('Архив прохождений', completions) +
    renderArchiveSection('Архив апелляций', appeals);
}

onAuthStateChanged(auth, async user => {
  if(!user) return location.href='index.html';
  try {
    const meSnap = await getDoc(doc(db,'users',user.uid));
    const data = meSnap.exists() ? meSnap.data() : null;
    if(!data || data.situation!=='verified') return location.href='nick.html';
    if(data.role!=='moderator' && data.role!=='elder') return location.href='main.html';

    me = { uid:user.uid, nick:data.nick ?? 'moderator' };
    await Promise.all([loadPendingLevels(), loadPendingCompletions(), loadUsersTab()]);
    statusEl.textContent='';
  } catch (e) {
    statusEl.textContent = getNetworkErrorMessage(e);
  }
});
</script>
</body>
</html>
