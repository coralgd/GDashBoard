<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>SpinList — Панель модератора</title>
<link rel="stylesheet" href="hud.css">
<style>
  .panel{display:none;margin-top:14px}
  .panel.active{display:block}
  .layout{display:grid;grid-template-columns:minmax(0,1fr) 260px;gap:16px;align-items:start}
  .side-tools{position:sticky;top:16px}
  .side-tools .card{display:flex;flex-direction:column;gap:10px}
  .toolbar-btn{width:100%}
  @media (max-width: 900px){
    .layout{grid-template-columns:1fr}
    .side-tools{position:static}
  }
  .danger-backdrop{background:rgba(0,0,0,.92)!important;animation:pulseDanger 2.4s ease-in-out infinite}
  @keyframes pulseDanger{0%{background:rgba(0,0,0,.92)}50%{background:rgba(110,0,0,.95)}100%{background:rgba(0,0,0,.92)}}
</style>
</head>
<body>
<div class="brand-hero">
  <img src="spinlist-logo.svg" alt="SpinList logo">
  <div class="brand-title">SPINLIST</div>
</div>
<div class="hud" style="max-width:1150px;margin:40px auto;">
  <div class="page-header">
    <h1>Панель модератора</h1>
    <button id="backMain" class="btn-ghost">На главную</button>
  </div>
  <p id="status" style="color:#00ffff;">Загрузка...</p>

  <div class="layout">
    <div>
      <div id="playersPanel" class="panel active"></div>
      <div id="listMenuPanel" class="panel"></div>
    </div>
    <aside class="side-tools">
      <div class="card">
        <button id="toggleView" class="toolbar-btn btn-hero">Меню листа</button>
        <button id="openSubmissions" class="toolbar-btn btn-success">Отправки</button>
        <button id="openAddLevel" class="toolbar-btn">Добавить</button>
      </div>
    </aside>
  </div>
</div>

<div id="modal" class="dialog-backdrop">
  <div class="dialog">
    <div class="page-header">
      <h2 id="mTitle" style="margin:0">Уровень</h2>
      <button id="mClose" class="btn-ghost">Закрыть</button>
    </div>
    <div id="mBody"></div>
  </div>
</div>

<div id="playerModal" class="dialog-backdrop">
  <div class="dialog" style="width:min(1100px,96vw);max-height:92vh;overflow:auto;">
    <div class="page-header">
      <h2 id="playerTitle" style="margin:0">Игрок</h2>
      <button id="closePlayerModal" class="btn-ghost">Закрыть</button>
    </div>
    <div id="playerBody"></div>
  </div>
</div>

<div id="siteModal" class="dialog-backdrop">
  <div class="dialog" style="max-width:560px;">
    <h3 id="siteModalTitle">Сообщение</h3>
    <p id="siteModalText"></p>
    <p id="siteModalHint" class="small"></p>
    <div class="top-actions">
      <button id="siteModalCancel" class="btn-ghost">Отмена</button>
      <button id="siteModalOk">Ок</button>
    </div>
  </div>
</div>

<div id="submissionsModal" class="dialog-backdrop">
  <div class="dialog" style="width:min(1200px,96vw);max-height:92vh;overflow:auto;">
    <div class="page-header">
      <h2 style="margin:0">Ожидающие отправки (без апелляций)</h2>
      <button id="closeSubmissions" class="btn-ghost">Закрыть</button>
    </div>
    <div class="row small"><div>Тип</div><div>Тема / Игрок</div><div>Дата</div></div>
    <div id="submissionsList"></div>
    <div id="submissionDetail" class="card" style="margin-top:10px;"><p class="small">Выбери отправку, чтобы открыть детали.</p></div>
  </div>
</div>

<div id="addLevelModal" class="dialog-backdrop">
  <div class="dialog" style="width:min(760px,96vw);">
    <div class="page-header">
      <h2 style="margin:0">Добавить уровень</h2>
      <button id="closeAddLevel" class="btn-ghost">Закрыть</button>
    </div>
    <div class="card">
      <label>Название уровня</label>
      <textarea id="addLevelText" placeholder="Название"></textarea>
      <label>Ссылка</label>
      <input id="addLevelLink" placeholder="https://...">
      <label>Файл (необязательно)</label>
      <input id="addLevelFile" placeholder="URL файла">
      <label>Строитель</label>
      <input id="addLevelBuilder" placeholder="Ник строителя">
      <label>Верифер</label>
      <input id="addLevelVerifier" placeholder="Ник верифера">
      <label>Место в листе</label>
      <input id="addLevelRank" type="number" min="1" placeholder="Например 15">
      <div class="top-actions">
        <button id="submitAddLevel" class="btn-success">Добавить</button>
      </div>
      <p id="addLevelMsg" class="small"></p>
    </div>
  </div>
</div>

<script type="module">
import { auth, db, getNetworkErrorMessage } from './firebase.js';
import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.14.0/firebase-auth.js";
import { collection, getDocs, query, where, doc, getDoc, updateDoc, addDoc, orderBy, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.14.0/firebase-firestore.js";

const statusEl = document.getElementById('status');
const playersPanel = document.getElementById('playersPanel');
const listMenuPanel = document.getElementById('listMenuPanel');
const modal = document.getElementById('modal');
const playerModal = document.getElementById('playerModal');
const submissionsModal = document.getElementById('submissionsModal');
const addLevelModal = document.getElementById('addLevelModal');
const toggleViewBtn = document.getElementById('toggleView');
let me = null;
let currentPanel = 'players';
let levelsCache = [];
let scoring = { maximumPoints:100, rankDecayFactor:3, repeatPenaltyPower:0.5 };
let pendingSubmissions = [];
let usersCache = [];
const siteModal = document.getElementById('siteModal');

function closeSiteModal(){ siteModal.classList.remove('open'); siteModal.classList.remove('danger-backdrop'); }
function showModalMessage(text, title='Сообщение'){
  document.getElementById('siteModalTitle').textContent = title;
  document.getElementById('siteModalText').textContent = text;
  document.getElementById('siteModalHint').textContent = '';
  const cancel = document.getElementById('siteModalCancel');
  const ok = document.getElementById('siteModalOk');
  cancel.style.display = 'none';
  ok.disabled = false;
  ok.textContent = 'Понятно';
  ok.onclick = ()=> closeSiteModal();
  siteModal.classList.add('open');
}
function askDanger(text, title='Подтверждение'){
  return new Promise(resolve=>{
    document.getElementById('siteModalTitle').textContent = title;
    document.getElementById('siteModalText').textContent = text;
    const hint = document.getElementById('siteModalHint');
    const cancel = document.getElementById('siteModalCancel');
    const ok = document.getElementById('siteModalOk');
    let left = 3;
    hint.textContent = `Подтверждение будет доступно через ${left} сек.`;
    ok.textContent = `Подождите ${left}`;
    ok.disabled = true;
    cancel.style.display = '';
    siteModal.classList.add('open');
    siteModal.classList.add('danger-backdrop');
    const timer = setInterval(()=>{
      left -= 1;
      if(left<=0){
        clearInterval(timer);
        hint.textContent = 'Можно подтвердить действие.';
        ok.textContent = 'Подтвердить';
        ok.disabled = false;
      } else {
        hint.textContent = `Подтверждение будет доступно через ${left} сек.`;
        ok.textContent = `Подождите ${left}`;
      }
    },1000);
    cancel.onclick = ()=>{ clearInterval(timer); closeSiteModal(); resolve(false); };
    ok.onclick = ()=>{ if(ok.disabled)return; clearInterval(timer); closeSiteModal(); resolve(true); };
  });
}

function setPanel(name){
  currentPanel = name;
  playersPanel.classList.toggle('active', name==='players');
  listMenuPanel.classList.toggle('active', name==='list');
  toggleViewBtn.textContent = name === 'players' ? 'Меню листа' : 'Список игроков';
}

toggleViewBtn.onclick = ()=> setPanel(currentPanel === 'players' ? 'list' : 'players');
document.getElementById('backMain').onclick = ()=> location.href='main.html';
document.getElementById('openSubmissions').onclick = async ()=>{
  await loadPendingSubmissions();
  renderPendingSubmissions();
  submissionsModal.classList.add('open');
};
document.getElementById('openAddLevel').onclick = ()=>{
  document.getElementById('addLevelMsg').textContent = '';
  addLevelModal.classList.add('open');
};
document.getElementById('mClose').onclick = ()=> modal.classList.remove('open');
document.getElementById('closePlayerModal').onclick = ()=> playerModal.classList.remove('open');
document.getElementById('closeSubmissions').onclick = ()=> submissionsModal.classList.remove('open');
document.getElementById('closeAddLevel').onclick = ()=> addLevelModal.classList.remove('open');

function calcPoints(rank, size, k=1){
  const n = Math.max(2, Number(size || 2));
  const r = Math.max(1, Math.min(Number(rank || 1), n));
  const x = (r - 1) / (n - 1);
  return Math.round((scoring.maximumPoints * Math.exp(-scoring.rankDecayFactor * x) / Math.pow(Math.max(1,k), scoring.repeatPenaltyPower))*100)/100;
}

function formatDate(ts){
  return ts?.seconds ? new Date(ts.seconds * 1000).toLocaleString('ru-RU') : '—';
}

async function logModeratorAction(action, details = {}){
  if(!me?.uid) return;
  try {
    await addDoc(collection(db,'moderator_actions'), {
      action,
      details,
      actorUid: me.uid,
      actorNick: me.nick ?? 'moderator',
      actorRole: me.role ?? 'moderator',
      createdAt: serverTimestamp()
    });
  } catch (_) {}
}

async function loadScoring(){
  const scoreSnap = await getDoc(doc(db,'settings','scoring'));
  const s = scoreSnap.exists() ? scoreSnap.data() : {};
  scoring = {
    maximumPoints: Number(s.maximumPoints ?? s.maxPoints ?? 100),
    rankDecayFactor: Number(s.rankDecayFactor ?? s.decayA ?? 3),
    repeatPenaltyPower: Number(s.repeatPenaltyPower ?? s.grindPower ?? 0.5)
  };
}

async function placeLevel(levelId, targetRank){
  const active = [...levelsCache].filter(l=>l.status!=='archived').sort((a,b)=>Number(a.rank ?? 9999)-Number(b.rank ?? 9999));
  const moving = active.find(l=>l.id===levelId);
  if(!moving) return;
  const without = active.filter(l=>l.id!==levelId);
  let idx = Number(targetRank) - 1;
  if(idx < 0) idx = 0;
  if(idx > without.length) idx = without.length;
  without.splice(idx, 0, moving);
  for(let i=0;i<without.length;i++){
    const rank = i + 1;
    if(Number(without[i].rank ?? 0) !== rank){
      await updateDoc(doc(db,'levels',without[i].id), { rank });
      without[i].rank = rank;
    }
  }
}

function openLevelModal(level){
  const rank = Number(level.rank ?? 0) || '—';
  document.getElementById('mTitle').textContent = `Уровень #${rank}`;
  document.getElementById('mBody').innerHTML = `
    <p><b>Название:</b> ${level.text ?? 'Без названия'}</p>
    <p><b>Ссылка:</b> <a target="_blank" href="${level.link ?? '#'}">Открыть</a></p>
    <p><b>Файл:</b> ${level.fileUrl ?? '—'}</p>
    <p><b>Статус:</b> ${level.status ?? 'active'}</p>
    <p class="small">Кнопка ниже НЕ меняет уровень напрямую. Она отправляет заявку старшему модератору на проверку.</p>
    <div class="top-actions">
      <button id="sendForReview">Проверить (заявка старшему)</button>
    </div>
    <p id="modalMsg" class="small"></p>
  `;
  document.getElementById('sendForReview').onclick = async ()=>{
    const msg = document.getElementById('modalMsg');
    try {
      await addDoc(collection(db,'level_review_requests'), {
        levelId: level.id,
        levelText: level.text ?? '',
        levelLink: level.link ?? '',
        levelRank: Number(level.rank ?? 0) || null,
        requestedBy: me.uid,
        requestedByNick: me.nick ?? 'moderator',
        status: 'pending',
        createdAt: serverTimestamp()
      });
      await logModeratorAction('request_level_review', { levelId: level.id, levelRank: Number(level.rank ?? 0) || null });
      msg.textContent = 'Заявка отправлена старшему модератору.';
    } catch (e) {
      msg.textContent = getNetworkErrorMessage(e);
    }
  };
  modal.classList.add('open');
}

async function loadPlayers(){
  const [usersSnap] = await Promise.all([
    getDocs(query(collection(db,'users'), where('situation','==','verified')))
  ]);

  usersCache = [];
  usersSnap.forEach(d=> usersCache.push({id:d.id,...d.data()}));
  usersCache.sort((a,b)=>Number(b.points ?? 0)-Number(a.points ?? 0));

  playersPanel.innerHTML = `
    <div class="page-header"><h2 style="margin:0">Список игроков</h2></div>
    <label>Поиск по нику/роли</label>
    <input id="playerSearch" placeholder="Например: player, ivan">
    <div class="row small"><div>#</div><div>Ник</div><div>Очки</div></div>
    <div id="playerList"></div>
  `;

  const list = document.getElementById('playerList');
  const render = ()=>{
    const q = document.getElementById('playerSearch').value.trim().toLowerCase();
    list.innerHTML = '';
    const filtered = usersCache.filter(u=>`${u.nick ?? ''} ${u.role ?? ''}`.toLowerCase().includes(q));
    if(!filtered.length){ list.innerHTML = '<p>Игроков не найдено.</p>'; return; }

    let rank = 0;
    filtered.forEach((u, idx)=>{
      rank = idx + 1;
      const row = document.createElement('div');
      row.className = 'row list-item clickable';
      if(u.role==='moderator') row.classList.add('moderator');
      if(u.role==='elder') row.classList.add('elder');
      row.innerHTML = `<div>${rank}</div><div>${u.nick ?? 'Без ника'} <span class="small">(${u.role ?? 'player'})</span></div><div>${Number(u.points ?? 0)}</div>`;
      row.onclick = ()=> openPlayerModalForModerator(u.id);
      list.appendChild(row);
    });
  };

  document.getElementById('playerSearch').oninput = render;
  render();
}

async function loadListMenu(){
  const levelsSnap = await getDocs(query(collection(db,'levels'), orderBy('rank','asc')));
  levelsCache = [];
  levelsSnap.forEach(d=>{
    const l = d.data();
    if(l.status!=='archived') levelsCache.push({id:d.id,...l});
  });
  levelsCache.sort((a,b)=>Number(a.rank ?? 9999) - Number(b.rank ?? 9999));

  listMenuPanel.innerHTML = `
    <div class="page-header"><h2 style="margin:0">Меню листа</h2></div>
    <label>Поиск по уровню</label>
    <input id="levelSearch" placeholder="Название, ранг, ссылка">
    <div id="levelList"></div>
  `;

  const list = document.getElementById('levelList');
  const render = ()=>{
    const q = document.getElementById('levelSearch').value.trim().toLowerCase();
    list.innerHTML = '';
    const filtered = levelsCache.filter(l=>`${l.text ?? ''} ${l.rank ?? ''} ${l.link ?? ''}`.toLowerCase().includes(q));
    if(!filtered.length){ list.innerHTML='<p>Уровней не найдено.</p>'; return; }

    filtered.forEach(l=>{
      const row = document.createElement('div');
      row.className = 'row list-item clickable';
      row.innerHTML = `<div>${Number(l.rank ?? 0) || '—'}</div><div>${l.text ?? 'Без названия'}</div><div>${calcPoints(Number(l.rank ?? 1), Math.max(2, levelsCache.length), 1)} · ${l.builder ?? '—'} / ${l.verifier ?? '—'}</div>`;
      row.onclick = ()=> openLevelModal(l);
      list.appendChild(row);
    });
  };

  document.getElementById('levelSearch').oninput = render;
  render();
}

async function openPlayerModalForModerator(playerId){
  const player = usersCache.find(x=>x.id===playerId);
  if(!player) return;
  const [compSnap, appealsSnap] = await Promise.all([
    getDocs(query(collection(db,'completion_submissions'), where('playerId','==',playerId))),
    getDocs(query(collection(db,'appeals'), where('playerId','==',playerId)))
  ]);
  const allSubmissions = [];
  const approved = [];
  compSnap.forEach(d=>{
    const x = { id:d.id, ...d.data() };
    allSubmissions.push({ type:'completion', ...x });
    if(x.status==='approved') approved.push(x);
  });
  appealsSnap.forEach(d=>allSubmissions.push({ type:'appeal', id:d.id, ...d.data() }));
  document.getElementById('playerTitle').textContent = `Игрок: ${player.nick ?? 'Без ника'}`;
  document.getElementById('playerBody').innerHTML = `
    <div class="card">
      <p><b>Почта:</b> ${player.email ?? '—'}</p>
      <label>Очки</label>
      <input id="modPlayerPoints" type="number" value="${Number(player.points ?? 0)}">
      <label>Сообщение игроку</label>
      <textarea id="modMessageText" placeholder="Текст сообщения"></textarea>
      <div class="top-actions"><button id="saveModPlayerPoints">Сохранить очки</button><button id="sendModMessage">Отправить сообщение</button></div>
    </div>
    <div class="card">
      <h3 style="margin-top:0">Прохождения (нажми, чтобы увидеть все отправки и апелляции)</h3>
      ${approved.map(c=>`<div class="list-item clickable" data-open-level="${c.levelId ?? ''}" data-open-rank="${Number(c.listRank ?? 0)}"><b>#${Number(c.listRank ?? '—')} · ${c.levelText ?? levelsCache.find(l=>l.id===c.levelId)?.text ?? 'Уровень'}</b><p class="small">Очки: ${Number(c.awardedPoints ?? 0)}</p></div>`).join('') || '<p class="small">Подтвержденных прохождений нет.</p>'}
    </div>
    <div id="playerSubmissionHistory" class="card"></div>
  `;
  document.getElementById('saveModPlayerPoints').onclick = async ()=>{
    const nextPoints = Number(document.getElementById('modPlayerPoints').value || 0);
    const delta = Math.round((nextPoints - Number(player.points ?? 0))*100)/100;
    if(delta!==0){
      await addDoc(collection(db,'point_awards'), { playerId, playerNick: player.nick ?? 'Без ника', amount: delta, reason:'Ручная корректировка очков модератором', grantedBy: me.uid, grantedByNick: me.nick ?? 'moderator', createdAt: serverTimestamp() });
      await updateDoc(doc(db,'users',playerId), { points: nextPoints });
    }
    await logModeratorAction('change_player_points', { playerId: player.id, targetPoints: nextPoints, delta });
    await loadPlayers();
    playerModal.classList.remove('open');
  };
  document.getElementById('sendModMessage').onclick = async ()=>{
    const text = document.getElementById('modMessageText').value.trim();
    if(!text) return showModalMessage('Введите текст сообщения');
    await addDoc(collection(db,'messages'), { toUid: playerId, toNick: player.nick ?? 'Без ника', fromUid: me.uid, fromNick: me.nick ?? 'moderator', fromRole: me.role ?? 'moderator', text, createdAt: serverTimestamp(), readAt: null });
    await logModeratorAction('send_message_to_player', { toUid: playerId, toNick: player.nick ?? 'Без ника' });
    document.getElementById('modMessageText').value = '';
  };
  document.querySelectorAll('[data-open-level]').forEach(el=>{
    el.onclick = ()=>{
      const levelId = el.dataset.openLevel;
      const levelRank = Number(el.dataset.openRank || 0);
      const rows = allSubmissions.filter(x=> (levelId && x.levelId===levelId) || Number(x.listRank ?? -1)===levelRank)
        .sort((a,b)=>(b.createdAt?.seconds ?? 0) - (a.createdAt?.seconds ?? 0));
      document.getElementById('playerSubmissionHistory').innerHTML = `<h3 style="margin-top:0">Материалы по уровню</h3>${rows.map((r,i)=>`<div class="list-item"><b>#${i+1} · ${r.type==='appeal'?'Апелляция':'Прохождение'} · ${r.status ?? '—'}</b><p>${r.text ?? '—'}</p><p class="small">link=${r.link ?? '—'} · file=${r.fileUrl ?? '—'} · note=${r.note ?? '—'}</p></div>`).join('') || '<p class="small">Нет материалов.</p>'}`;
    };
  });
  playerModal.classList.add('open');
}

async function loadPendingSubmissions(){
  const [levelSnap, compSnap] = await Promise.all([
    getDocs(query(collection(db,'level_submissions'), where('status','==','pending'))),
    getDocs(query(collection(db,'completion_submissions'), where('status','==','pending')))
  ]);

  pendingSubmissions = [];
  levelSnap.forEach(d=>pendingSubmissions.push({ id:d.id, type:'level', ...d.data() }));
  compSnap.forEach(d=>pendingSubmissions.push({ id:d.id, type:'completion', ...d.data() }));
  pendingSubmissions.sort((a,b)=>(b.createdAt?.seconds ?? 0) - (a.createdAt?.seconds ?? 0));
}

function renderPendingSubmissions(){
  const box = document.getElementById('submissionsList');
  const detail = document.getElementById('submissionDetail');
  box.innerHTML = '';
  detail.innerHTML = '<p class="small">Выбери отправку, чтобы открыть детали.</p>';

  if(!pendingSubmissions.length){
    box.innerHTML = '<p>Нет ожидающих отправок.</p>';
    return;
  }

  pendingSubmissions.forEach(item=>{
    const row = document.createElement('div');
    row.className = 'row list-item clickable';
    row.innerHTML = `<div>${item.type==='level'?'Уровень':'Прохождение'}</div><div>${item.text ? String(item.text).slice(0,80) : 'Без темы'}<div class="small">${item.nick ?? 'Без ника'}</div></div><div>${formatDate(item.createdAt)}</div>`;
    row.onclick = ()=> renderPendingSubmissionDetail(item.id);
    box.appendChild(row);
  });
}

function renderPendingSubmissionDetail(submissionId){
  const item = pendingSubmissions.find(x=>x.id===submissionId);
  if(!item) return;
  const detail = document.getElementById('submissionDetail');
  const levelOptions = levelsCache
    .map(l=>`<option value="${l.id}" ${item.levelId===l.id?'selected':''}>#${Number(l.rank ?? 0) || '—'} · ${l.text ?? 'Без названия'}</option>`)
    .join('');

  detail.innerHTML = `
    <h3 style="margin-top:0">${item.type==='level'?'Постановка уровня':'Прохождение'} · ${item.nick ?? 'Без ника'}</h3>
    <p><b>Дата подачи:</b> ${formatDate(item.createdAt)}</p>
    <p><b>Текст:</b><br>${item.text ?? '—'}</p>
    <p class="small">Ссылка: ${item.link ?? '—'} · Файл: ${item.fileUrl ?? '—'}</p>
    ${item.type==='level' ? '<label>Место в листе</label><input id="pendingRank" type="number" min="1" placeholder="Например 15">' : ''}
    ${item.type==='completion' ? `<label>Уровень</label><select id="pendingLevel"><option value="">Выбери уровень</option>${levelOptions}</select>` : ''}
    <label>Комментарий модератора</label><textarea id="pendingNote"></textarea>
    <div class="top-actions">
      <button id="approvePending">Подтвердить</button>
      <button id="rejectPending" class="btn-danger">Отклонить</button>
    </div>
  `;

  document.getElementById('approvePending').onclick = ()=> applyPendingVerdict(item, 'approved');
  document.getElementById('rejectPending').onclick = ()=> applyPendingVerdict(item, 'rejected');
}

async function applyPendingVerdict(item, verdict){
  const note = (document.getElementById('pendingNote')?.value || '').trim();
  if(item.type==='level'){
    const payload = { status: verdict, note, reviewedBy: me.uid, reviewedAt: serverTimestamp() };
    if(verdict==='approved'){
      const rank = Number(document.getElementById('pendingRank')?.value || 0);
      if(!rank) return showModalMessage('Укажи место в листе');
      const ref = await addDoc(collection(db,'levels'), {
        rank, text:item.text ?? '', link:item.link ?? '', fileUrl:item.fileUrl ?? '',
        builder:item.builder ?? '—', verifier:item.verifier ?? '—', status:'active',
        sourceSubmissionId:item.id, addedBy:me.uid, addedByNick:me.nick ?? 'moderator', createdAt:serverTimestamp()
      });
      await loadListMenu();
      await placeLevel(ref.id, rank);
      payload.finalRank = rank;
      await logModeratorAction('review_level_submission', { submissionId: item.id, verdict, levelId: ref.id, finalRank: rank });
    } else {
      await logModeratorAction('review_level_submission', { submissionId: item.id, verdict });
    }
    await updateDoc(doc(db,'level_submissions',item.id), payload);
  } else {
    const payload = { status: verdict, note, reviewedBy: me.uid, reviewedAt: serverTimestamp() };
    if(verdict==='approved'){
      const levelId = document.getElementById('pendingLevel')?.value || '';
      const level = levelsCache.find(l=>l.id===levelId);
      if(!level) return showModalMessage('Выбери уровень');
      const approvedSnap = await getDocs(query(collection(db,'completion_submissions'), where('playerId','==',item.playerId), where('status','==','approved')));
      const k = approvedSnap.size + 1;
      const size = Math.max(2, levelsCache.length);
      const earned = calcPoints(Number(level.rank ?? 1), size, k);
      const userRef = doc(db,'users',item.playerId);
      const userSnap = await getDoc(userRef);
      const userData = userSnap.exists() ? userSnap.data() : { points:0 };
      await updateDoc(userRef, { points: Number(userData.points ?? 0) + earned });
      payload.levelId = level.id;
      payload.listRank = Number(level.rank ?? 1);
      payload.levelText = level.text ?? 'Уровень';
      payload.awardedPoints = earned;
      payload.listQuantity = size;
      payload.scoreK = k;
      await logModeratorAction('review_completion_submission', { submissionId: item.id, verdict, levelId: level.id, awardedPoints: earned });
    } else {
      await logModeratorAction('review_completion_submission', { submissionId: item.id, verdict });
    }
    await updateDoc(doc(db,'completion_submissions',item.id), payload);
  }

  await Promise.all([loadListMenu(), loadPendingSubmissions()]);
  renderPendingSubmissions();
}

document.getElementById('submitAddLevel').onclick = async ()=>{
  const msg = document.getElementById('addLevelMsg');
  msg.textContent = '';
  const text = document.getElementById('addLevelText').value.trim();
  const link = document.getElementById('addLevelLink').value.trim();
  const fileUrl = document.getElementById('addLevelFile').value.trim();
  const builder = document.getElementById('addLevelBuilder').value.trim();
  const verifier = document.getElementById('addLevelVerifier').value.trim();
  const rank = Number(document.getElementById('addLevelRank').value || 0);

  if(!text){ msg.textContent = 'Укажи название уровня.'; return; }
  if(!rank){ msg.textContent = 'Укажи место в листе.'; return; }

  try {
    const ref = await addDoc(collection(db,'levels'), {
      text, link, fileUrl, builder: builder || '—', verifier: verifier || '—',
      rank, status: 'active',
      addedBy: me.uid,
      addedByNick: me.nick ?? 'moderator',
      createdAt: serverTimestamp()
    });
    await loadListMenu();
    await placeLevel(ref.id, rank);
    await loadListMenu();
    await logModeratorAction('add_level', { levelId: ref.id, rank, text, link });
    msg.textContent = 'Уровень добавлен.';
  } catch (e) {
    msg.textContent = getNetworkErrorMessage(e);
  }
};

onAuthStateChanged(auth, async user => {
  if(!user) return location.href='index.html';
  try {
    const meSnap = await getDoc(doc(db,'users',user.uid));
    const data = meSnap.exists() ? meSnap.data() : null;
    if(!data || (data.situation!=='verified' && data.situation!=='frozen')) return location.href='nick.html';
    if(data.situation==='frozen' || data.accountFrozen) return location.href='index.html';
    if(data.role!=='moderator' && data.role!=='elder') return location.href='main.html';

    me = { uid:user.uid, nick:data.nick ?? 'moderator', role:data.role ?? 'moderator' };
    await Promise.all([loadPlayers(), loadListMenu(), loadScoring()]);
    setPanel('players');
    statusEl.textContent='';
  } catch (e) {
    statusEl.textContent = getNetworkErrorMessage(e);
  }
});
</script>
