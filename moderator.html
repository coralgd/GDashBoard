<!DOCTYPE html><html lang="ru"><head><meta charset="UTF-8"><title>Панель модератора</title><link rel="stylesheet" href="hud.css"></head><body><div class="hud"><div class="page-header"><h1>Панель модератора</h1><button id="back" class="btn-ghost">На главную</button></div><p id="status" style="color:#00ffff">Загрузка...</p><div class="top-actions"><button id="goLevels">Меню уровней модератора</button></div><div id="users"></div></div>
<script type="module">
import { auth, db, getNetworkErrorMessage } from './firebase.js';
import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.14.0/firebase-auth.js";
import { collection, doc, getDoc, getDocs, query, updateDoc, where } from "https://www.gstatic.com/firebasejs/10.14.0/firebase-firestore.js";
const status=document.getElementById('status');const users=document.getElementById('users');
document.getElementById('back').onclick=()=>location.href='main.html';document.getElementById('goLevels').onclick=()=>location.href='moderator-levels.html';
async function loadUsers(){users.innerHTML='Загрузка...';const snap=await getDocs(query(collection(db,'users'),where('situation','==','verified')));const arr=[];snap.forEach(d=>{const u=d.data();if(u.role==='moderator'||u.role==='elder')return;arr.push({id:d.id,...u});});arr.sort((a,b)=>String(a.nick??'').localeCompare(String(b.nick??''),'ru'));users.innerHTML='';if(!arr.length){users.innerHTML='<p>Игроков нет.</p>';return;}arr.forEach(u=>{const card=document.createElement('div');card.className='list-item';card.innerHTML=`<b>${u.nick??'Без ника'}</b><p class='small'>${u.email??'—'}</p><input type='number' value='${Number(u.points??0)}'><button>Сохранить очки</button>`;card.querySelector('button').onclick=async()=>{const points=Number(card.querySelector('input').value);if(Number.isNaN(points))return alert('Некорректное число');await updateDoc(doc(db,'users',u.id),{points});};users.appendChild(card);});}
onAuthStateChanged(auth, async u=>{if(!u)return location.href='index.html';try{const me=await getDoc(doc(db,'users',u.uid));const m=me.exists()?me.data():null;if(!m||m.situation!=='verified') return location.href='nick.html';if(m.role!=='moderator'&&m.role!=='elder') return location.href='main.html';await loadUsers();status.textContent='';}catch(e){status.textContent=getNetworkErrorMessage(e);}});
</script></body></html>
