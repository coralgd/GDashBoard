<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Moderator Panel</title>
<link rel="stylesheet" href="hud.css">
<style>
  .panel{display:none;margin-top:14px}
  .panel.active{display:block}
  .row{border:1px solid #2d8cff55;background:rgba(0,20,50,.35);padding:12px;border-radius:10px;margin-bottom:12px}
  .row input,.row textarea,.row select{width:100%;margin:6px 0}
  .small{font-size:12px;opacity:.85}
  .folder{cursor:pointer}
  .path{margin:8px 0}
</style>
</head>
<body>
<div class="hud" style="max-width:1200px;margin:40px auto;">
  <h1>Панель модератора</h1>
  <p id="status" style="color:#00ffff;">Загрузка...</p>

  <div class="menu-grid">
    <button data-tab="levels">Заявки уровней</button>
    <button data-tab="completions">Заявки прохождений</button>
    <button data-tab="archive">Архив обработанных</button>
    <button data-tab="users">Аккаунты</button>
  </div>

  <div id="levels" class="panel active"></div>
  <div id="completions" class="panel"></div>
  <div id="archive" class="panel"></div>
  <div id="users" class="panel"></div>
</div>

<script type="module">
import { auth, db, getNetworkErrorMessage } from './firebase.js';
import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.14.0/firebase-auth.js";
import { collection, query, where, getDocs, doc, updateDoc, getDoc, addDoc, serverTimestamp, deleteDoc } from "https://www.gstatic.com/firebasejs/10.14.0/firebase-firestore.js";

const statusEl = document.getElementById('status');
let me = null;

const archiveState = {
  levels: new Map(), // levelKey -> { key,name,players:Map }
  current: { levelKey:'', playerKey:'', typeKey:'' },
  search: ''
};

function setTab(id){
  document.querySelectorAll('.panel').forEach(x=>x.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>setTab(b.dataset.tab));

function getTypeLabel(typeKey){
  if(typeKey==='completion') return 'Прохождения';
  if(typeKey==='level') return 'Уровни';
  return 'Апелляции';
}

function putArchiveItem(levelName, playerName, typeKey, item){
  const levelKey = levelName || 'Без уровня';
  if(!archiveState.levels.has(levelKey)) archiveState.levels.set(levelKey, { key:levelKey, name:levelKey, players:new Map() });
  const levelNode = archiveState.levels.get(levelKey);

  const playerKey = playerName || 'Без ника';
  if(!levelNode.players.has(playerKey)) levelNode.players.set(playerKey, { key:playerKey, name:playerKey, types:new Map() });
  const playerNode = levelNode.players.get(playerKey);

  if(!playerNode.types.has(typeKey)) playerNode.types.set(typeKey, []);
  playerNode.types.get(typeKey).push(item);
}

function renderArchive(){
  const box = document.getElementById('archive');
  const c = archiveState.current;
  const q = archiveState.search.trim().toLowerCase();

  let html = `
    <div class="path top-actions">
      <button id="aRoot" class="btn-ghost">Корень архива</button>
      ${c.levelKey ? `<button id="aLevel" class="btn-ghost">${c.levelKey}</button>` : ''}
      ${c.playerKey ? `<button id="aPlayer" class="btn-ghost">${c.playerKey}</button>` : ''}
      ${c.typeKey ? `<button id="aType" class="btn-ghost">${getTypeLabel(c.typeKey)}</button>` : ''}
    </div>
    <input id="aSearch" placeholder="Поиск: уровень / игрок / текст / статус" value="${archiveState.search.replace(/"/g,'&quot;')}">
    <div id="aList"></div>
  `;

  box.innerHTML = html;
  document.getElementById('aSearch').oninput = (e)=>{ archiveState.search = e.target.value; renderArchive(); };
  document.getElementById('aRoot').onclick = ()=>{ archiveState.current={levelKey:'',playerKey:'',typeKey:''}; renderArchive(); };
  if(c.levelKey) document.getElementById('aLevel').onclick = ()=>{ archiveState.current={levelKey:c.levelKey,playerKey:'',typeKey:''}; renderArchive(); };
  if(c.playerKey) document.getElementById('aPlayer').onclick = ()=>{ archiveState.current={levelKey:c.levelKey,playerKey:c.playerKey,typeKey:''}; renderArchive(); };

  const list = document.getElementById('aList');

  // root
  if(!c.levelKey){
    // special search by player from root
    if(q){
      const byPlayer = new Map();
      archiveState.levels.forEach(level=>{
        level.players.forEach((player, pKey)=>{
          const hitPlayer = pKey.toLowerCase().includes(q);
          if(!hitPlayer) return;
          if(!byPlayer.has(pKey)) byPlayer.set(pKey, []);
          byPlayer.get(pKey).push(level.name);
        });
      });
      if(byPlayer.size){
        let out = '<h3>Игроки по поиску</h3>';
        byPlayer.forEach((levels, player)=>{
          out += `<div class="row"><b>${player}</b><p class="small">Уровни: ${levels.join(', ')}</p><div class="top-actions">`;
          levels.forEach(l=>{ out += `<button class="openLevelForPlayer" data-level="${l}" data-player="${player}">${l}</button>`; });
          out += '</div></div>';
        });
        list.innerHTML = out;
        list.querySelectorAll('.openLevelForPlayer').forEach(btn=>btn.onclick=()=>{
          archiveState.current = { levelKey:btn.dataset.level, playerKey:btn.dataset.player, typeKey:'' };
          renderArchive();
        });
        return;
      }
    }

    const levels = Array.from(archiveState.levels.values())
      .filter(x=>!q || x.name.toLowerCase().includes(q))
      .sort((a,b)=>a.name.localeCompare(b.name,'ru'));

    if(!levels.length){ list.innerHTML='<p>В архиве ничего не найдено.</p>'; return; }
    list.innerHTML = levels.map(l=>`<div class="row folder" data-level="${l.key}">📁 <b>${l.name}</b> <span class="small">(${l.players.size} игроков)</span></div>`).join('');
    list.querySelectorAll('[data-level]').forEach(el=>el.onclick=()=>{ archiveState.current={levelKey:el.dataset.level,playerKey:'',typeKey:''}; renderArchive(); });
    return;
  }

  const level = archiveState.levels.get(c.levelKey);
  if(!level){ list.innerHTML='<p>Уровень не найден.</p>'; return; }

  if(!c.playerKey){
    const players = Array.from(level.players.values())
      .filter(x=>!q || x.name.toLowerCase().includes(q))
      .sort((a,b)=>a.name.localeCompare(b.name,'ru'));
    if(!players.length){ list.innerHTML='<p>Игроков не найдено.</p>'; return; }
    list.innerHTML = players.map(p=>`<div class="row folder" data-player="${p.key}">📁 <b>${p.name}</b> <span class="small">(${p.types.size} типов)</span></div>`).join('');
    list.querySelectorAll('[data-player]').forEach(el=>el.onclick=()=>{ archiveState.current={levelKey:c.levelKey,playerKey:el.dataset.player,typeKey:''}; renderArchive(); });
    return;
  }

  const player = level.players.get(c.playerKey);
  if(!player){ list.innerHTML='<p>Игрок не найден.</p>'; return; }

  if(!c.typeKey){
    const types = Array.from(player.types.keys()).filter(t=>!q || getTypeLabel(t).toLowerCase().includes(q));
    if(!types.length){ list.innerHTML='<p>Типы отправок не найдены.</p>'; return; }
    list.innerHTML = types.map(t=>`<div class="row folder" data-type="${t}">📁 <b>${getTypeLabel(t)}</b> <span class="small">(${player.types.get(t).length})</span></div>`).join('');
    list.querySelectorAll('[data-type]').forEach(el=>el.onclick=()=>{ archiveState.current={levelKey:c.levelKey,playerKey:c.playerKey,typeKey:el.dataset.type}; renderArchive(); });
    return;
  }

  const items = (player.types.get(c.typeKey) || [])
    .filter(x=>{
      if(!q) return true;
      const hay = `${x.text ?? ''} ${x.link ?? ''} ${x.note ?? ''} ${x.status ?? ''} ${x.referenceSubmissionId ?? ''}`.toLowerCase();
      return hay.includes(q);
    })
    .sort((a,b)=>(b.reviewedAt?.seconds ?? 0) - (a.reviewedAt?.seconds ?? 0));

  if(!items.length){ list.innerHTML='<p>Отправки не найдены.</p>'; return; }

  list.innerHTML = items.map((x,i)=>{
    const when = x.reviewedAt?.seconds ? new Date(x.reviewedAt.seconds*1000).toLocaleString('ru-RU') : '—';
    return `<div class="row"><b>#${i+1} · ${x.status ?? '—'}</b><p>${x.text ?? ''}</p><p class="small">link=${x.link ?? '—'} · file=${x.fileUrl ?? '—'} · ref=${x.referenceSubmissionId ?? '—'}</p><p class="small">note=${x.note ?? '—'} · reviewedBy=${x.reviewedBy ?? '—'} · reviewedAt=${when}</p></div>`;
  }).join('');
}

async function loadArchive(){
  const [levelListSnap, ls, cs, ap] = await Promise.all([
    getDocs(collection(db,'levels')),
    getDocs(collection(db,'level_submissions')),
    getDocs(collection(db,'completion_submissions')),
    getDocs(collection(db,'appeals'))
  ]);

  const levelNameById = new Map();
  const levelNameByRank = new Map();
  levelListSnap.forEach(d=>{
    const l = d.data();
    levelNameById.set(d.id, l.text ?? `Уровень ${d.id}`);
    if(l.rank!=null) levelNameByRank.set(Number(l.rank), l.text ?? `Уровень #${l.rank}`);
  });

  archiveState.levels = new Map();

  ls.forEach(d=>{
    const x=d.data();
    if(!x.status || x.status==='pending') return;
    const levelName = x.finalRank!=null ? (levelNameByRank.get(Number(x.finalRank)) ?? `Уровень #${x.finalRank}`) : 'Без уровня';
    putArchiveItem(levelName, x.nick ?? 'Без ника', 'level', x);
  });
  cs.forEach(d=>{
    const x=d.data();
    if(!x.status || x.status==='pending') return;
    let levelName = 'Без уровня';
    if(x.levelId) levelName = levelNameById.get(x.levelId) ?? `Уровень ${x.levelId}`;
    else if(x.listRank!=null) levelName = levelNameByRank.get(Number(x.listRank)) ?? `Уровень #${x.listRank}`;
    putArchiveItem(levelName, x.nick ?? 'Без ника', 'completion', x);
  });
  ap.forEach(d=>{
    const x=d.data();
    if(!x.status || x.status==='pending') return;
    const levelName = x.levelId ? (levelNameById.get(x.levelId) ?? `Уровень ${x.levelId}`) : 'Без уровня';
    putArchiveItem(levelName, x.nick ?? 'Без ника', 'appeal', x);
  });

  renderArchive();
}

async function loadUsersTab(){
  const box = document.getElementById('users');
  box.innerHTML = 'Загрузка аккаунтов...';
  const snap = await getDocs(collection(db,'users'));
  box.innerHTML = '';

  const rows = [];
  snap.forEach(d=>rows.push({id:d.id, ...d.data()}));
  rows.sort((a,b)=>String(a.nick ?? '').localeCompare(String(b.nick ?? ''), 'ru'));

  if(!rows.length){ box.innerHTML='<p>Пусто.</p>'; return; }

  rows.forEach(u=>{
    const row = document.createElement('div');
    row.className = 'row';
    const locked = u.id===me.uid || u.role==='moderator' || u.role==='elder';
    row.innerHTML = `
      <b>${u.nick ?? 'Без ника'}</b>
      <p class="small">${u.email ?? '—'} · role=${u.role ?? 'player'} · points=${Number(u.points ?? 0)}</p>
      <button class="btn-danger del" ${locked ? 'disabled' : ''}>Удалить аккаунт</button>
      <p class="small">${locked ? 'Защищенный аккаунт' : 'Удаляет профиль и отправки пользователя'}</p>
    `;

    row.querySelector('.del').onclick = async ()=>{
      if(!confirm(`Удалить аккаунт ${u.nick ?? 'Без ника'}?`)) return;
      try {
        await clearUserHistory(u.id);
        await deleteDoc(doc(db,'users',u.id));
        row.remove();
        await loadArchive();
      } catch (e) {
        alert(getNetworkErrorMessage(e));
      }
    };
    box.appendChild(row);
  });
}

async function clearUserHistory(uid){
  const [levelSub, completionSub, appealSub] = await Promise.all([
    getDocs(query(collection(db,'level_submissions'), where('authorId','==',uid))),
    getDocs(query(collection(db,'completion_submissions'), where('playerId','==',uid))),
    getDocs(query(collection(db,'appeals'), where('playerId','==',uid)))
  ]);
  await Promise.all(levelSub.docs.map(d=>deleteDoc(doc(db,'level_submissions',d.id))));
  await Promise.all(completionSub.docs.map(d=>deleteDoc(doc(db,'completion_submissions',d.id))));
  await Promise.all(appealSub.docs.map(d=>deleteDoc(doc(db,'appeals',d.id))));
}

async function loadPendingLevels(){
  const box = document.getElementById('levels');
  box.innerHTML='Загрузка заявок уровней...';
  const snap = await getDocs(query(collection(db,'level_submissions'), where('status','==','pending')));
  if(snap.empty){ box.innerHTML='<p>Нет заявок.</p>'; return; }
  box.innerHTML='';

  snap.forEach(d=>{
    const s=d.data();
    const row=document.createElement('div');
    row.className='row';
    row.innerHTML=`
      <b>${s.nick ?? 'Без ника'}</b>
      <a href="${s.link ?? '#'}" target="_blank">Ссылка</a>
      <p>${s.text ?? ''}</p>
      <p class="small">ref: ${s.referenceSubmissionId ?? '—'}</p>
      <input class="note" placeholder="Комментарий">
      <input class="rank" type="number" min="1" placeholder="Место">
      <div class="top-actions"><button class="ok">Одобрить</button><button class="no btn-danger">Отклонить</button></div>
    `;

    row.querySelector('.ok').onclick = async ()=>{
      const rank=Number(row.querySelector('.rank').value);
      if(!rank) return alert('Укажи место');
      await addDoc(collection(db,'levels'),{link:s.link ?? '',text:s.text ?? '',fileUrl:s.fileUrl ?? '',rank,status:'active',addedBy:me.uid,addedByNick:me.nick ?? 'moderator',createdAt:serverTimestamp(),sourceSubmissionId:d.id});
      await updateDoc(doc(db,'level_submissions',d.id),{status:'approved',note:row.querySelector('.note').value.trim(),reviewedBy:me.uid,reviewedAt:serverTimestamp(),finalRank:rank});
      row.remove();
      await loadArchive();
    };

    row.querySelector('.no').onclick = async ()=>{
      await updateDoc(doc(db,'level_submissions',d.id),{status:'rejected',note:row.querySelector('.note').value.trim() || 'Отклонено',reviewedBy:me.uid,reviewedAt:serverTimestamp()});
      row.remove();
      await loadArchive();
    };

    box.appendChild(row);
  });
}

async function loadPendingCompletions(){
  const box = document.getElementById('completions');
  box.innerHTML='Загрузка заявок прохождений...';
  const snap = await getDocs(query(collection(db,'completion_submissions'), where('status','==','pending')));
  if(snap.empty){ box.innerHTML='<p>Нет заявок.</p>'; return; }
  box.innerHTML='';

  box.innerHTML='';
  snap.forEach(d=>{
    const s=d.data();
    const row=document.createElement('div');
    row.className='row';
    row.innerHTML=`
      <b>${s.nick ?? 'Без ника'}</b>
      <a href="${s.link ?? '#'}" target="_blank">Доказательство</a>
      <p>${s.text ?? ''}</p>
      <p class="small">ref: ${s.referenceSubmissionId ?? '—'}</p>
      <input class="note" placeholder="Комментарий">
      <div class="top-actions"><button class="ok">Одобрить</button><button class="no btn-danger">Отклонить</button></div>
    `;

    row.querySelector('.ok').onclick = async ()=>{
      await updateDoc(doc(db,'completion_submissions',d.id),{status:'approved',note:row.querySelector('.note').value.trim(),reviewedBy:me.uid,reviewedAt:serverTimestamp()});
      row.remove();
      await loadArchive();
    };

    row.querySelector('.no').onclick = async ()=>{
      await updateDoc(doc(db,'completion_submissions',d.id),{status:'rejected',note:row.querySelector('.note').value.trim() || 'Отклонено',reviewedBy:me.uid,reviewedAt:serverTimestamp()});
      row.remove();
      await loadArchive();
    };

    box.appendChild(row);
  });
}

function renderArchiveSection(title, items){
  let html = `<h3>${title}</h3>`;
  if(!items.length) return html + '<p class="small">Пусто.</p>';
  items
    .sort((a,b)=>(b.reviewedAt?.seconds ?? 0)-(a.reviewedAt?.seconds ?? 0))
    .forEach(x=>{
      html += `<div class="row"><b>${x.nick ?? 'Без ника'}</b><p>${x.text ?? ''}</p><p class="small">status=${x.status ?? '—'} · note=${x.note ?? '—'} · ref=${x.referenceSubmissionId ?? '—'}</p></div>`;
    });
  return html;
}

async function loadArchive(){
  const box = document.getElementById('archive');
  box.innerHTML = 'Загрузка архива...';

  const [ls, cs, ap] = await Promise.all([
    getDocs(collection(db,'level_submissions')),
    getDocs(collection(db,'completion_submissions')),
    getDocs(collection(db,'appeals'))
  ]);

  const levels = []; const completions = []; const appeals = [];
  ls.forEach(d=>{ const x=d.data(); if(x.status && x.status!=='pending') levels.push(x); });
  cs.forEach(d=>{ const x=d.data(); if(x.status && x.status!=='pending') completions.push(x); });
  ap.forEach(d=>{ const x=d.data(); if(x.status && x.status!=='pending') appeals.push(x); });

  box.innerHTML =
    renderArchiveSection('Архив уровней', levels) +
    renderArchiveSection('Архив прохождений', completions) +
    renderArchiveSection('Архив апелляций', appeals);
}

onAuthStateChanged(auth, async user => {
  if(!user) return location.href='index.html';
  try {
    const meSnap = await getDoc(doc(db,'users',user.uid));
    const data = meSnap.exists() ? meSnap.data() : null;
    if(!data || data.situation!=='verified') return location.href='nick.html';
    if(data.role!=='moderator' && data.role!=='elder') return location.href='main.html';

    me = { uid:user.uid, nick:data.nick ?? 'moderator' };
    await Promise.all([loadPendingLevels(), loadPendingCompletions(), loadArchive(), loadUsersTab()]);
    statusEl.textContent='';
  } catch (e) {
    statusEl.textContent = getNetworkErrorMessage(e);
  }
});
</script>
</body>
</html>
