<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Меню уровней</title>
<link rel="stylesheet" href="hud.css">
</head>
<body>
<div class="hud" style="max-width:760px;margin:50px auto;">
  <div class="page-header">
    <h1 style="margin:0;">Меню уровней</h1>
    <button id="back" class="btn-ghost">Назад</button>
  </div>
  <p id="status" style="color:#00ffff;">Выбери действие.</p>
  <div class="top-actions">
    <button id="goSubmitLevel" class="btn-hero">Отправить уровень</button>
    <button id="goSubmitCompletion" class="btn-hero">Отправить прохождение</button>
    <button id="goSubmitAppeal" class="btn-hero">Отправить апелляцию</button>
    <button id="goMySubmissions" class="btn-hero">Мои отправки</button>
  </div>
</div>

<script type="module">
import { auth } from './firebase.js';
import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.14.0/firebase-auth.js";

onAuthStateChanged(auth, user=>{
  if(!user) location.href='index.html';
});

document.getElementById('goSubmitLevel').onclick = ()=> location.href='submit-level.html';
document.getElementById('goSubmitCompletion').onclick = ()=> location.href='submit-completion.html';
document.getElementById('goSubmitAppeal').onclick = ()=> location.href='submit-appeal.html';
document.getElementById('goMySubmissions').onclick = ()=> location.href='my-submissions.html';
document.getElementById('back').onclick = ()=> location.href='main.html';
</script>
</body>
</html>
